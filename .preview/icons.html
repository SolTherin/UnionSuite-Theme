<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Tabler smoke test</title>
<link rel="stylesheet" href="zAdditionalStyling.css">
<link rel="stylesheet" href="Tabler.css">
<style>
 body{font:14px/1.5 var(--font-body);color:var(--text-base);background:var(--bg-page);padding:24px}
 .row{display:flex;gap:22px;align-items:center;margin:14px 0}
 .row i{font-size:26px}
 .teal{color:var(--brand-600)} .accent{color:var(--accent-orange)} .dark{color:var(--brand-900)}
 code{font-size:12px;color:var(--text-muted)}
</style></head><body>
<h2 style="color:var(--brand-900)">Tabler 3.31.0 — the seven icons UTStaff.css uses</h2>
<div class="row dark"><i class="ti ti-home"></i><i class="ti ti-users"></i><i class="ti ti-briefcase"></i><i class="ti ti-heart-handshake"></i><i class="ti ti-phone"></i><i class="ti ti-calendar"></i><i class="ti ti-settings"></i><code>currentColor = --brand-900</code></div>
<div class="row teal"><i class="ti ti-home"></i><i class="ti ti-users"></i><i class="ti ti-briefcase"></i><i class="ti ti-heart-handshake"></i><i class="ti ti-phone"></i><i class="ti ti-calendar"></i><i class="ti ti-settings"></i><code>--brand-600</code></div>
<div class="row accent"><i class="ti ti-home"></i><i class="ti ti-users"></i><i class="ti ti-briefcase"></i><i class="ti ti-heart-handshake"></i><i class="ti ti-phone"></i><i class="ti ti-calendar"></i><i class="ti ti-settings"></i><code>--accent-orange</code></div>
</body></html>
