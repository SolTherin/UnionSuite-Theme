<div class="us-actions">

    <li><button type="button" class="us-actions__item us-action-cases-add-task"><i class="ti ti-square-check" aria-hidden="true"></i>Add Task</button></li>
    <li><button type="button" class="us-actions__item us-action-cases-add-note">Add Note &amp; Attachment</button></li>
    <li><button type="button" class="us-actions__item us-action-cases-schedule-meeting">Schedule Meeting</button></li>
