  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,

  }

svg {

.text-warning,

&lt;div id=&quot;pip-mascot-demo&quot; aria-label=&quot;Pip v2, a taskbar mascot concept&quot;&gt;
  &lt;style&gt;
    #pip-mascot-demo {
      --pip-surface: light-dark(#f6f8f7, #202827);

    #pip-mascot-demo * { box-sizing: border-box; }

    #pip-mascot-demo .pip-character { position:absolute; bottom:-40px; left:10px; width:170px; height:170px; background:none; border:0; padding:0; cursor:pointer; transform:translateY(178px); visibility:hidden; transition:transform 500ms ease-in, visibility 0s linear 500ms; -webkit-tap-highlight-color:transparent; border-radius:50% 50% 0 0; }
    #pip-mascot-demo .pip-character:disabled { cursor:default; }
    #pip-mascot-demo .pip-character:focus-visible { outline:2px solid var(--pip-accent); outline-offset:4px; }

    #pip-mascot-demo[data-phase=&quot;visit&quot;] .pip-character { transform:translateY(0) rotate(0); visibility:visible; transition:transform 720ms cubic-bezier(.34,1.5,.42,1), visibility 0s; }
    #pip-mascot-demo[data-phase=&quot;leaving&quot;] .pip-character { transform:translateY(178px) rotate(3deg); visibility:visible; transition:transform 640ms cubic-bezier(.55,-.38,.78,.22), visibility 0s; }

    /* SVG layers: creature = landing squash + wave bounce, figure = idle breathing. */
    #pip-mascot-demo .pip-creature { display:block; width:100%; height:100%; overflow:visible; filter:drop-shadow(0 6px 8px var(--pip-shadow)); transform-origin:50% 100%; }
    #pip-mascot-demo .pip-figure, #pip-mascot-demo .pip-head, #pip-mascot-demo .pip-ear, #pip-mascot-demo .pip-eyes, #pip-mascot-demo .pip-eye, #pip-mascot-demo .pip-arm, #pip-mascot-demo .pip-tuft, #pip-mascot-demo .pip-nose-group { transform-box:view-box; }
    #pip-mascot-demo .pip-figure { transform-origin:85px 130px; }
    #pip-mascot-demo[data-phase=&quot;visit&quot;] .pip-creature { animation:pip-land 720ms cubic-bezier(.3,1.4,.5,1) both; }
    #pip-mascot-demo[data-phase=&quot;visit&quot;] .pip-figure { animation:pip-breathe 3.6s ease-in-out 720ms infinite; }

    #pip-mascot-demo .pip-fur-flat { fill:var(--pip-fur); }
    #pip-mascot-demo .pip-fur-light { fill:var(--pip-fur-light); }
    #pip-mascot-demo .pip-fur-shade { fill:var(--pip-fur-edge); }
    #pip-mascot-demo .pip-ear-inner { fill:var(--pip-ear); }

    #pip-mascot-demo .pip-sheen { fill:var(--pip-shine); opacity:.15; }

    #pip-mascot-demo .pip-head { transform-origin:85px 112px; transform:rotate(calc(-3deg + var(--pip-turn, 0deg))); transition:transform 320ms cubic-bezier(.3,1.2,.5,1); }
    #pip-mascot-demo .pip-ear-left { transform-origin:50px 60px; transition:transform 260ms cubic-bezier(.3,1.4,.5,1); }

  &lt;div class=&quot;pip-footer&quot;&gt;&lt;span class=&quot;pip-status&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;A little visitor is on the way.&lt;/span&gt;&lt;span&gt;Interactive concept&lt;/span&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;pip-mascot-demo&#x27;);
      const character = root.querySelector(&#x27;.pip-character&#x27;);
      const replay = root.querySelector(&#x27;.pip-replay&#x27;);
      const status = root.querySelector(&#x27;.pip-status&#x27;);
      const visitor = root.querySelector(&#x27;.pip-visitor&#x27;);
      const motion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const settings = { shape:&#x27;koala&#x27;, palette:&#x27;sage&#x27;, size:100 };
      let sequence = [];
      let departure = null;
      let reaction = null;
      let blinkTimer = null;
      let twitchTimer = null;
      let started = false;
      let disposed = false;
      const rand = (min, max) =&gt; min + Math.random() * (max - min);
      function later(fn, ms) { const id = setTimeout(() =&gt; { if (!disposed) fn(); }, ms); sequence.push(id); }
      function clearIdle() { clearTimeout(blinkTimer); clearTimeout(twitchTimer); blinkTimer = twitchTimer = null; }
      function clearSequence() { sequence.forEach(clearTimeout); sequence = []; clearTimeout(departure); clearTimeout(reaction); clearIdle(); }
      function resetExpression() { root.classList.remove(&#x27;is-blinking&#x27;, &#x27;is-waving&#x27;, &#x27;is-twitching&#x27;); }
      function phase(value) { root.dataset.phase = value; character.disabled = value !== &#x27;visit&#x27;; }
      function visiting() { return root.dataset.phase === &#x27;visit&#x27;; }

      /* Idle life: irregular blinks (sometimes doubled) and the odd ear twitch while visiting. */
      function pulse(className, ms) {
        root.classList.remove(className);
        void character.offsetWidth;
        root.classList.add(className);
        later(() =&gt; root.classList.remove(className), ms);
      }
      function blink() { if (!visiting() || motion.matches) return; pulse(&#x27;is-blinking&#x27;, 230); }
      function scheduleBlink() {
        clearTimeout(blinkTimer);
        blinkTimer = setTimeout(() =&gt; {
          if (disposed || !visiting()) return;
          blink();
          if (Math.random() &lt; .25) later(blink, 290);
          scheduleBlink();
        }, rand(2400, 5200));
      }
      function scheduleTwitch() {
        clearTimeout(twitchTimer);
        twitchTimer = setTimeout(() =&gt; {
          if (disposed || !visiting()) return;
          if (!motion.matches &amp;&amp; !root.classList.contains(&#x27;is-waving&#x27;)) pulse(&#x27;is-twitching&#x27;, 460);
          scheduleTwitch();
        }, rand(4500, 8500));
      }

      function leave() {
        if (document.activeElement === character) { departure = setTimeout(leave, 2000); return; }
        clearIdle();
        phase(motion.matches ? &#x27;away&#x27; : &#x27;leaving&#x27;);
        status.textContent = &#x27;Pip has wandered off.&#x27;;
        departure = setTimeout(() =&gt; { phase(&#x27;away&#x27;); resetExpression(); }, 700);
      }
      function planDeparture(ms) { clearTimeout(departure); departure = setTimeout(leave, ms); }
      function visit() {
        started = true;
        clearSequence();
        resetExpression();
        phase(&#x27;away&#x27;);
        status.textContent = &#x27;A little visitor is on the way.&#x27;;
        later(() =&gt; phase(motion.matches ? &#x27;visit&#x27; : &#x27;peek&#x27;), 350);
        later(() =&gt; {
          phase(&#x27;visit&#x27;);
          status.textContent = &#x27;Pip is visiting. Click to make him wave.&#x27;;
          planDeparture(11000);
          scheduleBlink();
          scheduleTwitch();
        }, motion.matches ? 350 : 1900);
        later(() =&gt; { if (!root.classList.contains(&#x27;is-waving&#x27;)) wave(); }, 2750);
      }
      function wave() {
        clearTimeout(reaction);
        root.classList.remove(&#x27;is-waving&#x27;, &#x27;is-blinking&#x27;, &#x27;is-twitching&#x27;);
        void character.offsetWidth;
        root.classList.add(&#x27;is-waving&#x27;);
        reaction = setTimeout(() =&gt; root.classList.remove(&#x27;is-waving&#x27;), 2000);
      }
      function greet() {
        if (!visiting()) return;
        wave();
        status.textContent = &#x27;Pip waves hello.&#x27;;
        planDeparture(7000);
      }
      replay.addEventListener(&#x27;click&#x27;, visit);
      character.addEventListener(&#x27;click&#x27;, greet);

      /* Eyes follow the pointer and the head turns a little with them. */
      root.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
        if (!visiting() || motion.matches || event.pointerType === &#x27;touch&#x27;) return;
        const bounds = character.getBoundingClientRect();
        const dx = (event.clientX - bounds.left - bounds.width / 2) / 80;
        const dy = (event.clientY - bounds.top - 70) / 110;
        const x = Math.max(-3, Math.min(3, dx));
        const y = Math.max(-2, Math.min(2.5, dy));
        root.style.setProperty(&#x27;--pip-gaze-x&#x27;, x.toFixed(2) + &#x27;px&#x27;);
        root.style.setProperty(&#x27;--pip-gaze-y&#x27;, y.toFixed(2) + &#x27;px&#x27;);
        root.style.setProperty(&#x27;--pip-turn&#x27;, (x * 1.4).toFixed(2) + &#x27;deg&#x27;);
      });
      root.addEventListener(&#x27;pointerleave&#x27;, () =&gt; {
        root.style.setProperty(&#x27;--pip-gaze-x&#x27;, &#x27;0px&#x27;);
        root.style.setProperty(&#x27;--pip-gaze-y&#x27;, &#x27;0px&#x27;);
        root.style.setProperty(&#x27;--pip-turn&#x27;, &#x27;0deg&#x27;);
      });

      const palettes = {
        sage:[&#x27;#a3d6be&#x27;, &#x27;#a5d4c0&#x27;, &#x27;#7db59d&#x27;, &#x27;#77ab93&#x27;, &#x27;#cdeedd&#x27;, &#x27;#c9ead9&#x27;],
        lilac:[&#x27;#c9bceb&#x27;, &#x27;#c7b9e8&#x27;, &#x27;#a596cb&#x27;, &#x27;#a596cb&#x27;, &#x27;#e6dff6&#x27;, &#x27;#e1d9f4&#x27;],
        peach:[&#x27;#f0c4a6&#x27;, &#x27;#efc1a2&#x27;, &#x27;#d29d83&#x27;, &#x27;#d29d83&#x27;, &#x27;#fbe1cd&#x27;, &#x27;#f9dbc5&#x27;]
      };
      function renderDesign() {
        root.dataset.shape = settings.shape;
        const p = palettes[settings.palette] || palettes.sage;
        root.style.setProperty(&#x27;--pip-fur&#x27;, `light-dark(${p[0]}, ${p[1]})`);
        root.style.setProperty(&#x27;--pip-fur-edge&#x27;, `light-dark(${p[2]}, ${p[3]})`);
        root.style.setProperty(&#x27;--pip-fur-light&#x27;, `light-dark(${p[4]}, ${p[5]})`);
        visitor.style.transform = `scale(${settings.size / 100})`;
        visitor.style.transformOrigin = &#x27;50% 100%&#x27;;
      }
      renderDesign();
      if (globalThis.Tweak) {
        const tweak = new Tweak({ container:visitor, onChange:renderDesign });
        tweak.addSelect(settings, &#x27;shape&#x27;, { label:&#x27;Character&#x27;, options:[{label:&#x27;Koala&#x27;,value:&#x27;koala&#x27;},{label:&#x27;Little blob&#x27;,value:&#x27;blob&#x27;}] });
        tweak.addSelect(settings, &#x27;palette&#x27;, { label:&#x27;Colour&#x27;, options:[{label:&#x27;Sage&#x27;,value:&#x27;sage&#x27;},{label:&#x27;Lilac&#x27;,value:&#x27;lilac&#x27;},{label:&#x27;Peach&#x27;,value:&#x27;peach&#x27;}] });
        tweak.addSlider(settings, &#x27;size&#x27;, { label:&#x27;Size&#x27;, min:85, max:110, step:5, unit:&#x27;%&#x27; });
      }
      phase(&#x27;away&#x27;);
      let observer;
      if (&#x27;IntersectionObserver&#x27; in window) {
        observer = new IntersectionObserver(entries =&gt; {
          if (entries.some(entry =&gt; entry.isIntersecting) &amp;&amp; !started) { visit(); observer.disconnect(); }
        }, { threshold:0.3 });
        observer.observe(root);
      } else { visit(); }
      window.addEventListener(&#x27;pagehide&#x27;, () =&gt; { disposed = true; clearSequence(); observer?.disconnect(); }, {once:true});
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
