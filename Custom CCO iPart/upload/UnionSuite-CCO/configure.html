<!-- Source template. Build inlines local CSS/JS to match the native HubForms editor pattern. -->
<style>/* Isolated trial component. Consume UnionSuite semantic tokens; no global theme overrides. */
.us-cco, .us-cco-config { color: var(--text-base, #545962); font: 14px/1.5 var(--font-ui, system-ui, sans-serif); }
.us-cco *, .us-cco-config * { box-sizing: border-box; }
.us-cco [hidden], .us-cco-config [hidden] { display: none !important; }
.us-cco { position: relative; min-width: 0; min-height: var(--us-cco-min-height, 480px); background: var(--bg-surface, #fff); }
.us-cco__panel { position: relative; min-height: var(--us-cco-min-height, 480px); }
.us-cco iframe.us-cco__frame { width: 100%; min-width: 0; max-width: 100%; min-height: var(--us-cco-min-height, 480px) !important; flex-shrink: 0; }
.us-cco .us-cco__loader { position: absolute; z-index: 2; top: 180px; left: calc(50% - 24px); pointer-events: none; }
.us-cco:not([aria-busy="true"]) > .us-cco__loader,
.us-cco__panel:not([aria-busy="true"]) > .us-cco__loader { display: none; }
/* Let the surrounding page show through behind horizontal tabs only. */
.us-cco:has(> .tabs-horizontal),
.us-cco > .tabs-horizontal,
.us-cco > .tabs-horizontal > .RadTabStrip,
.us-cco > .tabs-horizontal > .RadTabStrip > .rtsLevel,
.us-cco > .tabs-horizontal > .RadTabStrip > .rtsLevel > .rtsUL { background: transparent; }
.us-cco :is(button,a):focus-visible, .us-cco-config :is(button,a,input,select):focus-visible { outline: 2px solid var(--border-focus, #006f94); outline-offset: 2px; }
.us-cco__status, .us-cco__note { margin: 0; padding: 10px 16px; }
.us-cco__status { min-height: 41px; }
.us-cco__note { color: var(--text-muted, #545962); font-size: 12px; }
.us-cco__error { color: var(--danger, #a42620); }
.us-cco .us-cco__button, .us-cco-config button { min-height: 36px; padding: 6px 12px; border: 1px solid var(--border-strong, #9aa1aa); border-radius: 4px; background: var(--bg-surface, #fff); color: var(--brand-700, #00506a); font: inherit; cursor: pointer; }
.us-cco .us-cco__button:hover, .us-cco-config button:hover { background: var(--brand-50, #eef6f9); }
/* The initial viewport is replaced with the child's measured content height. */
.us-cco__frame { display: block; height: var(--us-cco-frame-height, var(--us-cco-min-height, 480px)); border: 0; background: var(--bg-surface, #fff); }
.us-cco-config { max-width: 800px; margin: 16px 0; }
.us-cco-config [data-folder-search-results] { list-style: none; padding: 0; max-height: 300px; overflow: auto; }
.us-cco-config [data-folder-search-results] button { width: 100%; text-align: left; overflow-wrap: anywhere; margin-bottom: 4px; }
.us-cco-config fieldset { border: 1px solid var(--border, #e2e5e9); border-radius: 6px; padding: 20px; }
.us-cco-config legend { font-weight: 600; color: var(--text-strong, #1c2024); padding: 0 6px; }
.us-cco-config label { display: block; margin: 0 0 16px; font-weight: 600; }
.us-cco-config :is(input:not([type=checkbox]),select) { display: block; width: 100%; margin-top: 6px; min-height: 40px; border: 1px solid var(--border-strong, #9aa1aa); border-radius: 4px; padding: 8px; font: inherit; background: var(--bg-surface, #fff); color: var(--text-strong, #1c2024); }
.us-cco-config small { display: block; font-weight: 400; margin-top: 4px; }
.us-cco-config [data-folder-results] { padding-left: 20px; overflow-wrap: anywhere; }

/* Native navigation is owned by the installed UnionSuite theme. */
.us-cco__panel { display: flex; flex-direction: column; min-width: 0; }
.us-cco__frame { order: 0; }
.us-cco__actions { order: 1; display: flex; justify-content: flex-end; margin-top: 12px; }
.us-cco__refresh > svg { flex: none; pointer-events: none; }
/* Page editor buttons are siblings of the native tabs, not nested controls.
   Keep their visual states in the shared icon-button theme. */
.us-cco .us-cco__tabs > .rtsLI { position: relative; }
:root .us-cco .us-cco__tabs.rtsUL > .rtsLI.us-cco__tab-editable > .us-cco__tab.rtsLink {
  padding-inline-end: 44px; min-height: 44px; white-space: normal; overflow-wrap: anywhere;
}
/* Keep the native loading slot immediately before the separate edit target.
   Reserve it even while idle so horizontal captions do not jump on loading. */
:root .us-cco .us-cco__tabs.rtsUL > .rtsLI.us-cco__tab-editable > .us-cco__tab.rtsLink .rtsTxt { padding-inline-end: 20px; }
:root .us-cco .us-cco__tabs.rtsUL > .rtsLI.us-cco__tab-editable > .us-cco__tab.rtsLink > .us-tab-loading-spinner { inset-inline-end: 44px; }
.us-cco .us-cco__tabs > .rtsLI > .us-cco__edit {
  position: absolute; z-index: 2; right: 4px; top: 50%; transform: translateY(-50%); margin: 0;
}
.us-cco__edit > svg { flex: none; pointer-events: none; }
@media (pointer: coarse) {
  :root .us-cco .us-cco__tabs.rtsUL > .rtsLI.us-cco__tab-editable > .us-cco__tab.rtsLink { padding-inline-end: 52px; min-height: 52px; }
  :root .us-cco .us-cco__tabs.rtsUL > .rtsLI.us-cco__tab-editable > .us-cco__tab.rtsLink > .us-tab-loading-spinner { inset-inline-end: 52px; }
}
.us-cco__options { padding: 8px 16px; }
.us-cco summary { cursor: pointer; font-size: 12px; color: var(--text-muted, #545962); }
.us-cco__sr-only { position: absolute; width: 1px; height: 1px; min-height: 0; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<div class="us-cco-config ng-non-bindable" data-us-cco-config>
  <fieldset>
    <legend>UnionSuite CCO settings - sandbox trial</legend>
    <label>Find a content folder
      <input data-folder-search type="search" autocomplete="off" placeholder="Filepath contains...">
      <small>Search by part of the folder path, or choose Find folders with a blank search to browse the first 20 results.</small>
    </label>
    <button type="button" data-find-folders>Find folders</button>
    <p data-folder-search-status role="status" aria-live="polite"></p>
    <ul data-folder-search-results aria-label="Matching content folders"></ul>
    <label>Folder document-version key
      <input data-setting="folderDocumentVersionId" type="text" aria-required="true" autocomplete="off" spellcheck="false">
      <small>Use the folder's DocumentVersionId from iMIS. A path or DocumentId cannot replace it.</small>
    </label>
    <label>Folder path label
      <input data-setting="folderPathLabel" type="text" maxlength="500">
      <small>Optional label for authors; requests use the key above.</small>
    </label>
    <label>Collection caption <input data-setting="caption" type="text" maxlength="120"></label>
    <label>Tab URL parameter <input data-setting="urlParameter" type="text" maxlength="60" placeholder="Directory">
      <small>Optional. Blank keeps the automatic placement parameter. Use a unique name for each CCO on the page.</small>
    </label>
    <label>Tab URL value
      <select data-setting="urlValue"><option value="name">Tab name (default) - Directory=About</option><option value="key">Document key (stable)</option><option value="number">Tab number - Directory=1</option></select>
      <small>Chooses the value written when a tab is clicked. Names use dashes for spaces: Directory=Notes-and-Interactions. Incoming links accept keys, names (spaces or dashes) and 1-based tab numbers. Ambiguous names use document keys when writing links.</small>
    </label>
    <label>Initial page document-version key
      <input data-setting="initialDocumentVersionId" type="text" autocomplete="off" spellcheck="false">
      <small>Optional. Leave blank to select the first available page sorted by Name. A valid tab deep link takes priority.</small>
    </label>
    <label>Background loading
      <select data-setting="preload"><option value="off">Off - selected page only</option><option value="sequential-idle">Trial - preload sequentially after the selected page</option></select>
    </label>
    <label>Tab layout
      <select data-setting="orientation"><option value="vertical">Vertical - theme CCO sidebar</option><option value="horizontal">Horizontal - theme tabs</option></select>
      <small>Uses the installed UnionSuite theme. Vertical tabs become a horizontal strip on narrow screens.</small>
    </label>
    <label><input data-setting="popupBridge" type="checkbox"> Trial - open supported dialogs in the parent viewport</label>
    <p>The content preview route and permissions require live validation for each intended role. Nested folders are omitted. Retained pages keep their own forms and search state.</p>
    <button type="button" data-check-folder>Check folder contents</button>
    <p data-config-status role="status" aria-live="polite">Waiting for the native JsonSettings field...</p>
    <ol data-folder-results></ol>
  </fieldset>
</div>
<script data-cfasync="false">/* UnionSuite CCO 0.1.0 - generated sandbox trial */
(() => {
'use strict';
// src/contracts.js
// iMIS wrappers shared by the runtime and the native JsonSettings editor.
function unwrap(value) {
  return value && typeof value === 'object' && '$value' in value ? value.$value : value;
}

function objectValue(value, label = 'value') {
  value = unwrap(value);
  if (typeof value === 'string') {
    try { value = JSON.parse(value); } catch { throw new Error(`${label} is invalid JSON.`); }
  }
  if (!value || typeof value !== 'object' || Array.isArray(value)) throw new Error(`${label} must be an object.`);
  return value;
}

function collection(value, label) {
  const rows = unwrap(value)?.$values ?? unwrap(value);
  if (!Array.isArray(rows)) throw new Error(`Unexpected ${label} response.`);
  return rows;
}

function property(record, name) {
  if (record[name] !== undefined) return unwrap(record[name]);
  const props = record.Properties?.$values ?? record.Properties;
  return Array.isArray(props) ? unwrap(props.find(p => p.Name === name)?.Value) : undefined;
}

function guid(value, label = 'Key') {
  value = unwrap(value);
  if (typeof value !== 'string' || !/^[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(value) || /^0{8}(?:-0{4}){3}-0{12}$/.test(value)) {
    throw new Error(`${label} must be a non-empty GUID. Check iMIS token substitution and configuration.`);
  }
  return value.toLowerCase();
}

function placementIdentity(contentKey, contentItemKey) {
  return { contentKey: guid(contentKey, 'ContentKey'), contentItemKey: guid(contentItemKey, 'ContentItemKey') };
}

function placementId(identity) {
  return `${identity.contentKey.replaceAll('-', '')}-${identity.contentItemKey.replaceAll('-', '')}`;
}

function verifiedPlacement(body, identity) {
  const envelope = objectValue(body, 'ContentItem');
  const rows = envelope.Items !== undefined ? collection(envelope.Items, 'ContentItem list') : [envelope];
  const matches = rows.filter(row => {
    const record = objectValue(row, 'ContentItem row');
    const data = record.Data === undefined ? {} : objectValue(record.Data, 'ContentItem Data');
    // Reject conflicts between direct, Data and property-bag identities; never trust a filter alone.
    return [['ContentKey', identity.contentKey], ['ContentItemKey', identity.contentItemKey]].every(([name, expected]) => {
      const values = [data, record].flatMap(owner => {
        const props = owner.Properties?.$values ?? owner.Properties;
        return [unwrap(owner[name]), ...(Array.isArray(props) ? props.filter(p => p.Name === name).map(p => unwrap(p.Value)) : [])];
      }).filter(v => v !== undefined);
      return values.length > 0 && values.every(v => typeof v === 'string' && v.toLowerCase() === expected);
    });
  });
  if (matches.length !== 1) throw new Error('Configuration lookup did not return exactly one matching ContentKey + ContentItemKey placement.');
  return objectValue(matches[0]);
}

function placementSettings(row) {
  const data = row.Data === undefined ? {} : objectValue(row.Data);
  for (const owner of [data, row]) {
    for (const name of ['JsonSettings', 'Settings']) {
      const candidate = property(owner, name);
      if (candidate !== undefined && candidate !== null && candidate !== '') return objectValue(candidate, name);
    }
  }
  throw new Error('No JsonSettings configuration was found. Configure this UnionSuite CCO placement.');
}

function validateConfig(input) {
  const value = objectValue(input, 'JsonSettings');
  if (value.schemaVersion !== 1) throw new Error('Unsupported or missing CCO schemaVersion. Reopen the configuration editor.');
  const textSetting = (key, fallback, max) => {
    const text = value[key] ?? fallback;
    if (typeof text !== 'string' || text.length > max) throw new Error(`Invalid ${key}.`);
    return text.trim();
  };
  const preload = value.preload ?? 'off';
  if (!['off', 'sequential-idle'].includes(preload)) throw new Error('Unsupported preload policy.');
  if (value.popupBridge !== undefined && typeof value.popupBridge !== 'boolean') throw new Error('popupBridge must be true or false.');
  if (value.orientation !== undefined && !['horizontal', 'vertical'].includes(value.orientation)) throw new Error('Unsupported tab orientation.');
  const urlParameter = textSetting('urlParameter', '', 60);
  if (urlParameter && (!/^[A-Za-z][A-Za-z0-9_-]*$/.test(urlParameter) || /^(?:id|contactid|partyid|customerid|context|websitekey|contentkey|contentitemkey|templatetype|imode|iuniformkey|ioperation|documenttypecode|dialogcacheparam|ispopup|popup|pageinstancekey|donotcache|us-cco-)/i.test(urlParameter))) throw new Error('Choose a URL parameter such as Directory; identity and renderer parameters are reserved.');
  const urlValue = value.urlValue ?? 'name';
  if (!['key', 'name', 'number'].includes(urlValue)) throw new Error('Unsupported tab URL value format.');
  return {
    schemaVersion: 1,
    urlParameter, urlValue,
    folderDocumentVersionId: guid(value.folderDocumentVersionId, 'Folder document-version key'),
    folderPathLabel: textSetting('folderPathLabel', '', 500),
    caption: textSetting('caption', 'Content pages', 120) || 'Content pages',
    initialDocumentVersionId: value.initialDocumentVersionId ? guid(value.initialDocumentVersionId, 'Initial page key') : '',
    orientation: value.orientation ?? 'vertical', preload, popupBridge: value.popupBridge ?? false
  };
}

function mergeConfig(existing, edits) {
  const original = objectValue(existing, 'Existing JsonSettings');
  if (original.schemaVersion !== undefined && original.schemaVersion !== 1) throw new Error('Unsupported existing schemaVersion. It was not overwritten.');
  return { ...original, ...validateConfig({ ...original, ...edits, schemaVersion: 1 }) };
}

// src/api.js

function webRoot(win) {
  const root = String(win.gWebRoot || '').replace(/\/+$/, '');
  const url = new URL(root || '/', win.location.origin);
  if (url.origin !== win.location.origin || url.search || url.hash) throw new Error('The iMIS web root must be same-origin.');
  return url.pathname.replace(/\/+$/, '');
}

function createApi(win) {
  return async (method, path, payload, signal) => {
    const controller = new win.AbortController();
    const abort = () => controller.abort();
    signal?.addEventListener('abort', abort, { once: true });
    if (signal?.aborted) controller.abort();
    const timeout = win.setTimeout(() => controller.abort(new Error('The iMIS request timed out after 30 seconds.')), 30000);
    try {
      const token = win.document.querySelector('input[name="__RequestVerificationToken"], input#__RequestVerificationToken')?.value;
      const response = await win.fetch(`${webRoot(win)}/api/${path}`, {
        method, signal: controller.signal, credentials: 'same-origin', cache: 'no-store', redirect: 'error',
        headers: { Accept: 'application/json', ...(token ? { RequestVerificationToken: token } : {}), ...(payload === undefined ? {} : { 'Content-Type': 'application/json' }) },
        ...(payload === undefined ? {} : { body: JSON.stringify(payload) })
      });
      if (!response.ok) throw new Error(`iMIS request failed (HTTP ${response.status}). Check access and session status.`);
      let result;
      try { result = await response.json(); } catch { throw new Error('iMIS returned an unexpected non-JSON response. Check session status.'); }
      if (unwrap(result?.IsSuccessStatusCode) === false || unwrap(result?.IsValid) === false) throw new Error('iMIS reported that the requested operation failed.');
      return result;
    } finally {
      win.clearTimeout(timeout);
      signal?.removeEventListener('abort', abort);
    }
  };
}

// src/documents.js

function folderRequest(folderVersionKey) {
  return {
    $type: 'Asi.Soa.Core.DataContracts.GenericExecuteRequest, Asi.Contracts',
    OperationName: 'FindDocumentsInFolder', EntityTypeName: 'Document',
    Parameters: {
      $type: 'System.Collections.ObjectModel.Collection`1[[System.Object, mscorlib]], mscorlib',
      $values: [guid(folderVersionKey, 'Folder document-version key'), { $type: 'System.String[], mscorlib', $values: ['CON', 'CFL'] }, { $type: 'System.Boolean', $value: true }]
    },
    ParameterTypeName: {
      $type: 'System.Collections.ObjectModel.Collection`1[[System.String, mscorlib]], mscorlib',
      $values: ['System.String', 'System.String[]', 'System.Boolean']
    }
  };
}

function folderPages(body) {
  if (unwrap(body?.IsSuccessStatusCode) === false) throw new Error('iMIS could not list this folder.');
  const rows = collection(body?.Result !== undefined ? body.Result : body, 'folder');
  const pages = [], seen = new Set();
  let folders = 0, excluded = 0;
  for (const value of rows) {
    const row = objectValue(value, 'Folder row');
    const type = property(row, 'DocumentTypeId');
    if (type === 'CFL') { folders++; continue; } // Deliberately no traversal; cycles cannot recurse.
    if (type !== 'CON') throw new Error('Folder listing contains an unexpected document type.');
    const id = guid(property(row, 'DocumentVersionId'), 'Page document-version key');
    if (seen.has(id)) throw new Error('Folder listing contains duplicate page document-version keys.');
    seen.add(id);
    const name = property(row, 'Name'), alternate = property(row, 'AlternateName');
    if (typeof name !== 'string' || !name.trim() || (alternate != null && typeof alternate !== 'string')) throw new Error('Folder listing contains an invalid page name.');
    const statusValue = property(row, 'Status');
    const status = unwrap(statusValue?.Name ?? statusValue?.Description ?? statusValue);
    // Known explicit non-published records fail closed. Unknown status shapes need a live contract.
    if (status !== undefined && status !== null && status !== '' && status !== 'Published') { excluded++; continue; }
    if (property(row, 'IsPublished') === false || property(row, 'IsDeleted') === true || property(row, 'IsAuthorized') === false) { excluded++; continue; }
    pages.push({ id, name: name.trim(), caption: alternate?.trim() || name.trim() });
  }
  pages.sort((a, b) => a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }) || a.id.localeCompare(b.id));
  return { pages, folders, excluded };
}

// src/folder-search.js

// Named Query API filter and direct result fields, in the editor only.
function installFolderSearch(win, mount, signal, isActive) {
  const input = mount.querySelector('[data-folder-search]');
  const results = mount.querySelector('[data-folder-search-results]');
  const status = mount.querySelector('[data-folder-search-status]');
  let request, timer, generation = 0;
  function cancel() { generation++; win.clearTimeout(timer); request?.abort(); }
  async function search() {
    cancel();
    if (!isActive()) return;
    const current = generation;
    request = new win.AbortController();
    results.replaceChildren(); status.textContent = 'Searching folders...';
    const query = new URLSearchParams({ queryname: '$/_i4u_/Core/Admin/CFL Search', limit: '20' });
    const term = input.value.trim();
    if (term) query.set('Path', term);
    try {
      const body = await createApi(win)('GET', `query?${query}`, undefined, request.signal);
      if (current !== generation || !isActive()) return;
      const rows = collection(body.Items, 'folder IQA');
      let count = 0, skipped = 0;
      for (const row of rows) {
        let key;
        try { key = guid(property(row, 'DocumentVersionKey'), 'Folder document-version key'); } catch { skipped++; continue; }
        const path = property(row, 'DocumentPath'), name = property(row, 'Name');
        if (typeof path !== 'string' || typeof name !== 'string') { skipped++; continue; }
        const item = win.document.createElement('li');
        const button = win.document.createElement('button'); button.type = 'button';
        button.textContent = `${name || 'Folder'} - ${path} (${key})`;
        button.addEventListener('click', () => {
          if (!isActive()) return;
          const keyField = mount.querySelector('[data-setting="folderDocumentVersionId"]');
          keyField.value = key;
          mount.querySelector('[data-setting="folderPathLabel"]').value = path;
          keyField.dispatchEvent(new win.Event('change', { bubbles: true }));
          cancel(); results.replaceChildren();
          status.textContent = `Selected ${name || path}. Use native Save to persist the folder.`;
          keyField.focus();
        }, { signal });
        item.append(button); results.append(item); count++;
      }
      status.textContent = `${count} folders shown.${rows.length >= 20 ? ' Refine the path to narrow the results.' : ''}${skipped ? ` ${skipped} invalid results omitted.` : ''}${!count ? ' Try another path or check IQA access.' : ''}`;
    } catch (error) {
      if (current === generation && isActive()) status.textContent = error.message || 'Folder search failed.';
    }
  }
  input.addEventListener('input', () => {
    cancel(); results.replaceChildren(); status.textContent = '';
    if (input.value.trim()) timer = win.setTimeout(search, 300);
  }, { signal });
  input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); search(); } }, { signal });
  mount.querySelector('[data-find-folders]').addEventListener('click', search, { signal });
  signal.addEventListener('abort', cancel, { once: true });
}

// src/config.js

function installEditor(win) {
  if (win.UnionSuiteCCOEditor) { win.UnionSuiteCCOEditor.scan(); return; }
  const doc = win.document, entries = new Map();
  function attach(mount) {
    const events = new win.AbortController();
    const status = mount.querySelector('[data-config-status]');
    const fields = [...mount.querySelectorAll('[data-setting]')];
    let request, loadedField, loadedValue, originalValidator, validator, invalid = false, disposed = false;
    const nativeNameId = 'ctl01_TemplateBody_ContentEditorChildControl_ContentItemName_TextField';
    function active() {
      // A closed/removed editor must not intercept the containing page's Save.
      if (disposed || !mount.isConnected || !mount.getClientRects().length) return false;
      const native = doc.getElementById('JsonSettings');
      return !!native && native === loadedField && native.form === mount.closest('form');
    }
    function ensureNativeName() {
      const name = doc.getElementById(nativeNameId);
      if (!name || name.value.trim()) return; // Keep any author-supplied native name.
      name.value = fields.find(input => input.dataset.setting === 'caption')?.value.trim() || 'UnionSuite CCO';
      name.dispatchEvent(new win.Event('input', { bubbles: true }));
      name.dispatchEvent(new win.Event('change', { bubbles: true }));
    }
    function message(text, error = false) { if (status.textContent !== text) status.textContent = text; status.classList.toggle('us-cco__error', error); }
    function field() {
      const matches = doc.querySelectorAll('#JsonSettings');
      if (matches.length !== 1 || !('value' in matches[0])) throw new Error('The native JsonSettings editor field is missing or ambiguous. Open this through the iMIS Content Type editor.');
      return matches[0];
    }
    function read(native) { return native.value ? objectValue(native.value, 'Existing JsonSettings') : {}; }
    function hydrate() {
      try {
        const native = field();
        if (native === loadedField && native.value === loadedValue) return;
        const saved = read(native);
        if (saved.schemaVersion !== undefined && saved.schemaVersion !== 1) throw new Error('This configuration uses an unsupported schemaVersion. It was not overwritten.');
        for (const input of fields) {
          const value = saved[input.dataset.setting];
          if (input.type === 'checkbox') input.checked = value === true;
          else input.value = value ?? (input.dataset.setting === 'urlValue' ? 'name' : input.dataset.setting === 'orientation' ? 'vertical' : input.dataset.setting === 'preload' ? 'off' : input.dataset.setting === 'caption' ? 'Content pages' : '');
        }
        loadedField = native; loadedValue = native.value; invalid = false;
        ensureNativeName();
        message('Settings load from this placement. Use the native Save or Save & Close button to persist them.');
      } catch (error) { invalid = true; message(error.message, true); }
    }
    function edits() {
      return Object.fromEntries(fields.map(input => [input.dataset.setting, input.type === 'checkbox' ? input.checked : input.value.trim()]));
    }
    function store(report = true) {
      try {
        if (invalid) throw new Error('Existing settings could not be read safely. Reopen the editor before saving.');
        const native = field();
        const value = mergeConfig(read(native), edits()); // Preserve unrelated settings, including last-minute native edits.
        native.value = JSON.stringify(value);
        loadedField = native; loadedValue = native.value;
        ensureNativeName();
        if (report) message('Settings prepared. Use native Save or Save & Close to persist them in iMIS.');
        return true;
      } catch (error) { message(error.message, true); return false; }
    }
    function guardSave(event) {
      if (!active()) return;
      if (!store() && event) { event.preventDefault(); event.stopImmediatePropagation(); fields.find(input => input.dataset.setting === 'folderDocumentVersionId')?.focus(); }
    }
    function installValidator() {
      const current = win.RunAllValidators;
      if (typeof current !== 'function' || current === validator) return;
      originalValidator = current;
      const previous = current;
      validator = function (...args) {
        const valid = !active() || store(false);
        return previous.apply(this, args) !== false && valid;
      };
      win.RunAllValidators = validator;
    }
    doc.addEventListener('click', event => {
      if (event.target.closest?.('#ctl01_SaveButton, #ctl01_SaveAndCloseButton')) guardSave(event);
    }, { capture: true, signal: events.signal });
    // Hub Widgets auto-syncs before the native save callback reads JsonSettings.
    // No document-wide submit cancellation: it can block unrelated page saves.
    mount.addEventListener('input', () => store(false), { signal: events.signal });
    mount.addEventListener('change', () => store(), { signal: events.signal });
    mount.addEventListener('keydown', event => {
      if (event.key === 'Enter' && event.target.matches('input, select')) event.preventDefault();
    }, { signal: events.signal });
    mount.querySelector('[data-check-folder]').addEventListener('click', async () => {
      request?.abort(); request = new win.AbortController();
      const list = mount.querySelector('[data-folder-results]');
      list.replaceChildren();
      try {
        const config = validateConfig({ ...edits(), schemaVersion: 1 });
        message('Checking immediate folder children...');
        const result = folderPages(await createApi(win)('POST', 'Document/_execute', folderRequest(config.folderDocumentVersionId), request.signal));
        if (!mount.isConnected) return;
        for (const page of result.pages) {
          const li = doc.createElement('li'); li.textContent = `${page.caption} - ${page.id}`; list.append(li);
        }
        message(`${result.pages.length} content pages returned; ${result.folders} nested folders omitted; ${result.excluded} unavailable pages omitted. This does not verify access for other roles.`);
      } catch (error) { if (error.name !== 'AbortError') message(error.message, true); }
    }, { signal: events.signal });
    hydrate();
    installFolderSearch(win, mount, events.signal, active);
    installValidator();
    return { hydrate() { hydrate(); installValidator(); }, dispose() {
      disposed = true; request?.abort(); events.abort();
      if (validator && win.RunAllValidators === validator) win.RunAllValidators = originalValidator;
    } };
  }
  function scan() {
    for (const [mount, entry] of entries) if (!mount.isConnected) { entry.dispose(); entries.delete(mount); }
    for (const mount of doc.querySelectorAll('[data-us-cco-config]')) if (!entries.has(mount)) {
      if (entries.size) { const text = 'Only one CCO configuration editor can use the native JsonSettings field at a time.'; if (mount.textContent !== text) mount.textContent = text; continue; }
      entries.set(mount, attach(mount));
    }
    for (const entry of entries.values()) entry.hydrate();
  }
  const observer = new win.MutationObserver(scan);
  observer.observe(doc.documentElement, { childList: true, subtree: true });
  const app = win.Sys?.Application;
  app?.add_load?.(scan);
  win.UnionSuiteCCOEditor = { scan, dispose() { observer.disconnect(); app?.remove_load?.(scan); for (const entry of entries.values()) entry.dispose(); entries.clear(); delete win.UnionSuiteCCOEditor; } };
  scan();
}

installEditor(window);
})();
</script>
