<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HubForms runner</title>
    <style>
      hubforms-runner:not(:defined) {
        display: block;
        padding: 16px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        color: #475569;
        font:
          14px/1.45 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
    </style>
  </head>
  <body>
    <hubforms-runner content-item-key="[x-contentItemKey]" content-key="[x-contentKey]">
      Loading form...
    </hubforms-runner>
    <script data-cfasync="false">
      (function (bootScript) {
        'use strict';

        var runner = bootScript && bootScript.previousElementSibling;
        if (!runner || runner.tagName.toLowerCase() !== 'hubforms-runner') return;

        var src = 'https://hub-forms-runner.pages.dev/runner.js';
        if (customElements.get('hubforms-runner')) return;

        var loader = document.querySelector('script[data-hubforms-runner-loader]');
        if (!loader) {
          loader = document.createElement('script');
          loader.src = src;
          loader.async = true;
          loader.setAttribute('data-cfasync', 'false');
          loader.setAttribute('data-hubforms-runner-loader', 'true');
          document.head.appendChild(loader);
        }

        loader.addEventListener(
          'error',
          function () {
            runner.textContent = 'HubForms could not load the runner application.';
            console.error('[HubForms embed] runner bundle failed to load', { src: src });
          },
          { once: true },
        );
      })(document.currentScript);
    </script>
  </body>
</html>
