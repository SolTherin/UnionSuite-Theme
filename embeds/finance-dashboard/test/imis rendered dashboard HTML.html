/**
 * fd-core.js — Finance Dashboard shared core
 * © Union Innovation Hub.
 *
 * Everything both surfaces need: reference data, formatters, the run/payment
 * roll-ups, badge markup, toasts, sticky-table syncing, and
 * the NAVIGATION layer that moves between the run list and the run screen.
 *
 * Exposes a single global: `window.FDCore`. The app is inlined into a live iMIS
 * page, so bare function globals would risk colliding with iMIS's own scripts.
 */
window.FDCore = (function () {
  "use strict";

  const C = window.FDConfig;

  /* ═══════════════════════════════════════════════════════════
     REFERENCE DATA
     Payment types and decline reasons are small, closed sets. They are
     presentation reference data (label + colour), so they live here rather
     than being fetched — see docs/DATA-REQUIREMENTS.md §4, which explains why
     hard-coding them costs zero API calls and what to do if the finance team
     adds a gateway with new reason codes.
     ═══════════════════════════════════════════════════════════ */

  const PAY_TYPES = [
    { id: "dd",   label: "Direct Debit", color: "#2563c4", pale: "#e8f0fb" },
    { id: "cc",   label: "Credit Card",  color: "#e8720c", pale: "#fdf0e3" },
    { id: "bpay", label: "BPAY",         color: "#0d9488", pale: "#e6f7f5" },
    { id: "eft",  label: "EFT Transfer", color: "#64748b", pale: "#eef2f7" },
    { id: "inv",  label: "Invoice",      color: "#9a6510", pale: "#fdf3e0" },
    { id: "pd",   label: "Payroll",      color: "#7c3aed", pale: "#f1eafd" },
  ];
  const typeById = id => PAY_TYPES.find(t => t.id === id) || PAY_TYPES[3];

  const PAY_AREAS = [
    { id: "dues",  label: "Membership Dues", color: "#1a4b8c" },
    { id: "ins",   label: "Insurance",       color: "#0d9488" },
    { id: "event", label: "Event income",    color: "#7c3aed" },
    { id: "addon", label: "Other add ons",   color: "#e8720c" },
  ];

  const DECLINE_REASONS = [
    "Insufficient funds", "Expired card", "Invalid account number",
    "Payment cancelled by member", "Bank rejected transaction",
    "Card reported lost/stolen",
  ];

  /* Soft = may succeed on retry; hard = will never succeed without new payment
     details, so a bulk retry must exclude it. */
  const DECLINE_KIND = {
    "Insufficient funds":           "Soft",
    "Bank rejected transaction":    "Soft",
    "Expired card":                 "Hard",
    "Invalid account number":       "Hard",
    "Payment cancelled by member":  "Hard",
    "Card reported lost/stolen":    "Hard",
  };
  const declineKind = reason => DECLINE_KIND[reason] || "Soft";

  /* The payment outcomes the UI groups by, in lifecycle order. */
  const STATUS_ORDER = ["Pending", "Processing", "Awaiting payment", "Cleared", "Reconciled", "Declined"];
  const PAID = ["Cleared", "Reconciled"];
  const isPaid = t => PAID.includes(t.status);

  /* ═══════════════════════════════════════════════════════════
     FORMATTERS
     ═══════════════════════════════════════════════════════════ */
  const $ = id => document.getElementById(id);
  const fmtMoney = n => Number(n || 0).toLocaleString("en-AU", { style: "currency", currency: "AUD", maximumFractionDigits: n >= 10000 ? 0 : 2 });
  const fmtNum = n => Number(n || 0).toLocaleString("en-AU");
  const fmtPct = n => (n * 100).toFixed(1) + "%";
  const DOW = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const fmtDateLong = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  const fmtDateShort = d => `${d.getDate()} ${MON[d.getMonth()]}`;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&", "<": "<", ">": ">", '"': """ }[c]));

  /* ═══════════════════════════════════════════════════════════
     ROLL-UPS
     runStats/runState are the ONLY place run-level figures are derived, so the
     list, the KPI cards and the run screen can never disagree. In live mode the
     same shape arrives pre-aggregated from the batch-summary view — see
     docs/DATA-REQUIREMENTS.md §2 — and FDData.runStats() short-circuits to it
     rather than reducing over transactions the browser never loaded.
     ═══════════════════════════════════════════════════════════ */
  function runStats(run) {
    if (run.stats) return run.stats;                 // pre-aggregated (live mode)
    const val = a => a.reduce((s, t) => s + t.amount, 0);
    const paid = run.txns.filter(isPaid);
    const proc = run.txns.filter(t => t.status === "Processing");
    const pend = run.txns.filter(t => t.status === "Pending");
    const wait = run.txns.filter(t => t.status === "Awaiting payment");
    const bad  = run.txns.filter(t => t.status === "Declined");
    return {
      count: run.txns.length,
      okCount: paid.length,   okValue: val(paid),
      procCount: proc.length, procValue: val(proc),
      pendCount: pend.length, pendValue: val(pend),
      waitCount: wait.length, waitValue: val(wait),
      badCount: bad.length,   badValue: val(bad),
      badUnprocessed: bad.filter(t => t.stillOwed).length,
      totalValue: val(run.txns),
    };
  }

  /* The run itself has no stored status — its state is derived from its
     payments. Lifecycle: Generated (created, not yet sent to the bank) →
     Processing (sent, awaiting bank results) → Finalised (nothing left
     processing). */
  function runState(run) {
    const s = runStats(run);
    if (s.pendCount) return { key: "generated",  label: "Generated", cls: "generated" };
    if (s.procCount) return { key: "processing", label: `Processing · ${fmtNum(s.procCount)}`, cls: "processing" };
    return { key: "finalised", label: "Finalised", cls: "completed" };
  }

  /* A run is flagged for review when a payment has sat in Processing longer
     than FDConfig.reviewProcessingDays. In live mode this comes straight off
     the summary view as MaxProcessingDays — no transaction scan. */
  function isLongProcessingRun(run) {
    if (typeof run.maxProcessingDays === "number") return run.maxProcessingDays > C.reviewProcessingDays;
    return !!run.needsReview;
  }

  /* ═══════════════════════════════════════════════════════════
     BADGES & PILLS
     ═══════════════════════════════════════════════════════════ */
  const TXN_BADGES = {
    "Cleared":          '<span class="badge success"><em class="fa-solid fa-check"></em> Cleared</span>',
    "Reconciled":       '<span class="badge reconciled"><em class="fa-solid fa-check-double"></em> Reconciled</span>',
    "Processing":       '<span class="badge processing"><em class="fa-solid fa-rotate"></em> Processing</span>',
    "Awaiting payment": '<span class="badge awaiting"><em class="fa-regular fa-clock"></em> Awaiting payment</span>',
    "Declined":         '<span class="badge declined"><em class="fa-solid fa-xmark"></em> Declined</span>',
    "Pending":          '<span class="badge pending"><em class="fa-regular fa-circle"></em> Pending</span>',
  };
  const txnBadge = status => TXN_BADGES[status] || esc(status);

  function runStatePill(run) {
    const st = runState(run);
    return `<span class="status-pill ${st.cls}"><span class="dot"></span>${st.label}</span>`;
  }

  function typeChip(pt, suffix) {
    return `<span class="type-chip" style="background:${pt.pale};color:${pt.color}">${esc(pt.label)}${suffix || ""}</span>`;
  }

  /* ═══════════════════════════════════════════════════════════
     TOASTS
     ═══════════════════════════════════════════════════════════ */
  function toast(msg, cls) {
    const host = $("toast-container");
    if (!host) return;
    const el = document.createElement("div");
    el.className = "toast " + (cls || "");
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  /* ═══════════════════════════════════════════════════════════
     STICKY TABLE HEADERS
     .table-wrap deliberately has no scroll container so a table's sticky <th>
     pins against .main-scroll instead. The .stuck class squares the header off
     and bleeds it to the gutters; it's re-queried each frame so it survives
     every re-render.
     ═══════════════════════════════════════════════════════════ */
  function syncStuckTables() {
    const sc = $("main-scroll");
    if (!sc) return;
    const rootTop = sc.getBoundingClientRect().top;
    document.querySelectorAll(".page:not([style*='display: none']):not([style*='display:none']) table.report-table")
      .forEach(t => {
        const r = t.getBoundingClientRect();
        t.classList.toggle("stuck", r.top < rootTop && r.bottom > rootTop + 60);
      });
  }

  let stickyObserver = null;
  function watchStickyHeaders() {
    if (stickyObserver) stickyObserver.disconnect();
    const root = $("main-scroll");
    if (!root) return;
    stickyObserver = new IntersectionObserver(
      entries => entries.forEach(e => e.target.classList.toggle(
        "stuck", e.intersectionRatio < 1 && e.boundingClientRect.top < e.rootBounds.top)),
      { root, threshold: [1] }
    );
    document.querySelectorAll(".date-group-sticky").forEach(el => stickyObserver.observe(el));
  }

  function bindScrollSync() {
    const sc = $("main-scroll");
    if (sc) sc.addEventListener("scroll", () => requestAnimationFrame(syncStuckTables), { passive: true });
  }

  /* Re-triggers the small fade used when a metric label set changes. */
  function flashSwap(el) {
    if (!el) return;
    el.classList.remove("swap");
    void el.offsetWidth;
    el.classList.add("swap");
  }

  /* ═══════════════════════════════════════════════════════════
     ENVIRONMENT & LICENCE
     ═══════════════════════════════════════════════════════════ */
  /* iMIS page markers: the anti-forgery token and the client context both exist
     only on a real RiSE page, and both are what the live data layer needs. */
  function isInIMIS() {
    return !!(document.getElementById("__RequestVerificationToken") ||
              document.getElementById("__ClientContext"));
  }

  /* ═══════════════════════════════════════════════════════════
     NAVIGATION — the two surfaces
     Embedded, the app is INLINED into the iMIS page, so `window.location` IS
     the iMIS page's URL: navigating it moves the user between two RiSE pages
     on the iMIS host and the browser Back button works for free. Outside iMIS
     the same calls navigate the two static HTML files instead, so the identical
     build runs from a dev server.

     If a surface has no iMIS page configured, urlFor() returns null and the
     caller falls back to an in-page view swap — the original mockup's
     behaviour. That keeps a half-configured deploy usable.
     ═══════════════════════════════════════════════════════════ */
  const Nav = {

    /* Which surface this document is. Set by the HTML shell. */
    surface: "dashboard",

    /* The run id this page was opened for, or null. Read from the HOST page's
       query string, which is where it lands when embedded. */
    runIdFromUrl() {
      const v = new URLSearchParams(window.location.search).get(C.runParam);
      return v ? v.trim() : null;
    },

    /* Resolve a surface to a URL, or null if it can't be reached by navigation
       and the caller should swap views in place instead. */
    urlFor(surface, params) {
      /* Unresolvable in EITHER branch returns null, not a URL built from
         undefined — `new URL(null, …)` cheerfully resolves to "/null" and would
         navigate the user off the app. */
      const base = isInIMIS()
        ? (C.imisPages && C.imisPages[surface])
        : (C.files && C.files[surface]);
      if (!base || typeof base !== "string") return null;

      const u = new URL(base, window.location.href);
      /* Drop our own param first so navigating dashboard→run→dashboard can't
         accumulate stale copies of it. */
      u.searchParams.delete(C.runParam);
      Object.entries(params || {}).forEach(([k, v]) => u.searchParams.set(k, v));
      return u.pathname + (u.search || "") + (u.hash || "");
    },

    /* Both return true if they navigated, false if the caller must fall back. */
    gotoRun(runId) {
      const url = this.urlFor("run", { [C.runParam]: runId });
      if (!url) return false;
      window.location.assign(url);
      return true;
    },

    gotoDashboard() {
      const url = this.urlFor("dashboard");
      if (!url) return false;
      window.location.assign(url);
      return true;
    },

    /* v2. Returns false in v1, where imisPages.arrears is deliberately null —
       callers must treat that as "the arrears page does not exist here". */
    gotoArrears() {
      const url = this.urlFor("arrears");
      if (!url) return false;
      window.location.assign(url);
      return true;
    },

    /* True when the run screen lives at its own URL, i.e. a real page load got
       us here. Drives whether the run screen shows "Back to dashboard" in the
       header (its own page) or an in-page back button (fallback swap). */
    isDedicatedRunPage() {
      return this.surface === "run" && this.urlFor("dashboard") !== null;
    },
  };

  /* One-time sanity check: each surface is a separate HTML shell and a separate
     runtime-URL iPart, so no two may share a RiSE page — "back to dashboard"
     would reload the page you were already on. */
  function checkConfig() {
    const p = C.imisPages || {};
    const seen = new Map();
    for (const [surface, path] of Object.entries(p)) {
      if (!path) continue;                       // null = not configured / not deployed
      if (seen.has(path)) {
        console.warn(`[FinanceDashboard] FDConfig.imisPages.${seen.get(path)} and .${surface} ` +
                     `both point at "${path}". Each surface needs its own RiSE page, ` +
                     `because each is a different runtime-URL iPart.`);
      }
      seen.set(path, surface);
    }
  }

  /* Render the licence / not-found notice into a page container. */
  function notice(container, title, body, backLabel) {
    const back = backLabel
      ? `<button type="button" class="back-btn" data-fd-back><em class="fa-solid fa-arrow-left"></em> ${esc(backLabel)}</button>`
      : "";
      container.innerHTML = `<div class="fd-notice"><h3>${esc(title)}</h3><p>${esc(body)}</p>${back}</div>`;
    const btn = container.querySelector("[data-fd-back]");
    if (btn) btn.addEventListener("click", () => { if (!Nav.gotoDashboard()) window.history.back(); });
  }

  checkConfig();

  return {
    // reference data
    PAY_TYPES, PAY_AREAS, DECLINE_REASONS, DECLINE_KIND, STATUS_ORDER, PAID,
    typeById, declineKind, isPaid,
    // formatters
    $, fmtMoney, fmtNum, fmtPct, fmtDateLong, fmtDateShort, esc, DOW, MON,
    // roll-ups
    runStats, runState, isLongProcessingRun,
    // markup
    txnBadge, runStatePill, typeChip, toast, notice,
    // chrome
    syncStuckTables, watchStickyHeaders, bindScrollSync, flashSwap,
    // environment
    isInIMIS,
    // navigation
    Nav,
  };
})();

/**

 *
 * Exposes a single global: `window.FDData`.
 */
window.FDData = (function () {
  "use strict";

  const C = window.FDConfig;
  const Core = window.FDCore;
  const { PAY_TYPES, DECLINE_REASONS } = Core;

  /* ═══════════════════════════════════════════════════════════
     MOCK DATA — deterministic pseudo-random so the prototype looks the same on
     every load, and identical across the two surfaces. "Today" is pinned.
     ═══════════════════════════════════════════════════════════ */
  const TODAY = new Date(2026, 6, 6); // 6 Jul 2026

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rnd = mulberry32(20260706);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const between = (min, max) => min + rnd() * (max - min);
  const intBetween = (min, max) => Math.floor(between(min, max + 1));

  const RUN_TEMPLATES = [
    { id: "invoices", name: "Membership Dues — Invoices",  typeLabel: "Invoices", desc: "",               kind: "invoices", mix: { invoice: 1 },        areaMix: { dues: .90, ins: .06, addon: .04 },              size: [400, 900], avg: [60, 220] },
    { id: "daily",    name: "Membership Dues — Daily Run", typeLabel: "CC / DD",  desc: "iMIS Autopay",   kind: "dues",     mix: { dd: .62, cc: .38 },  areaMix: { dues: .93, ins: .04, addon: .03 },              size: [180, 420], avg: [18, 42]  },
    { id: "other",    name: "Membership Dues — Other",     typeLabel: "CC / DD",  desc: "adhoc payments", kind: "dues",     mix: { cc: .75, dd: .25 },  areaMix: { dues: .55, ins: .10, addon: .20, event: .15 }, size: [8, 60],    avg: [30, 160] },
    { id: "payroll",  name: "Payroll Deduction",           typeLabel: "PRD",      desc: "reconciliation", kind: "payroll",  mix: { pd: 1 },             areaMix: { dues: .95, ins: .05 },                          size: [60, 200],  avg: [15, 30]  },
    { id: "bpay",     name: "BPAY",                        typeLabel: "BPAY",     desc: "reconciliation", kind: "bpay",     mix: { bpay: 1 },           areaMix: { dues: .85, ins: .10, addon: .05 },              size: [40, 140],  avg: [40, 260] },
  ];

  const FIRST = ["Sarah","Michael","Emma","David","Jessica","Chris","Amanda","Daniel","Rachel","Mark","Lisa","Tom","Nicole","James","Karen","Peter","Megan","Andrew","Fiona","Luke","Hannah","Sean","Priya","Marco","Yuki","Aisha","Liam","Grace","Noah","Chloe"];
  const LAST  = ["Nguyen","Smith","Patel","Williams","Chen","Brown","Kelly","Taylor","Singh","Wilson","Martin","Lee","Anderson","Thompson","White","Walsh","Harris","King","Costa","Ryan","OBrien","Murphy","Zhang","Ali","Rossi","Kaur","Doyle","Webb","Hunt","Bell"];

  function weightedType(mix) {
    const r = rnd();
    let acc = 0;
    for (const [id, w] of Object.entries(mix)) { acc += w; if (r <= acc) return id; }
    return Object.keys(mix)[0];

  function buildMockRuns() {
    let runSeq = 2040;
    const RUNS = [];
    for (let daysAgo = C.historyDays; daysAgo >= 0; daysAgo--) {
      const d = new Date(TODAY); d.setDate(d.getDate() - daysAgo);
      const dow = d.getDay();
      if (dow === 0 || dow === 6) continue;               // no weekend runs

      /* Scheduled runs for the day:
         - Daily Run fires every weekday, with a big volume spike on Thursdays
         - Other is a single ad hoc batch on most days (never more than one)
         - BPAY reconciliation file lands every weekday
         - Payroll Deduction lands weekly (Friday)
         - Invoices run lands once, on the first weekday of the month */
      const isFirstWeekdayOfMonth = (() => {
        const test = new Date(d.getFullYear(), d.getMonth(), 1);
        while (test.getDay() === 0 || test.getDay() === 6) test.setDate(test.getDate() + 1);
        return test.getDate() === d.getDate();
      })();
      const todaysTemplates = [{ tpl: RUN_TEMPLATES[1], sizeMult: dow === 4 ? 2.5 : 1 }];
      if (rnd() < 0.7) todaysTemplates.push({ tpl: RUN_TEMPLATES[2], sizeMult: 1 });
      todaysTemplates.push({ tpl: RUN_TEMPLATES[4], sizeMult: 1 });
      if (dow === 5) todaysTemplates.push({ tpl: RUN_TEMPLATES[3], sizeMult: 1 });
      if (isFirstWeekdayOfMonth) todaysTemplates.push({ tpl: RUN_TEMPLATES[0], sizeMult: 1 });

      for (const { tpl, sizeMult } of todaysTemplates) {

        const size = Math.max(1, Math.round(intBetween(tpl.size[0], tpl.size[1]) * sizeMult));
        const declineRate = between(0.015, 0.09);
        const txns = [];
        for (let t = 0; t < size; t++) {
          const method = weightedType(tpl.mix);
          const txn = {
            ref: "PMT-" + String(intBetween(100000, 999999)),
            member: pick(FIRST) + " " + pick(LAST),
            memberId: String(intBetween(10000, 89999)),
            type: method === "invoice" ? "inv" : method,
            method,
            area: weightedType(tpl.areaMix),
            amount: Math.round(between(tpl.avg[0], tpl.avg[1]) * 100) / 100,
            /* stillOwed — the decline's invoice is still open with a balance,
               i.e. it needs a human. Live mode supplies this as StillOwed
               (v1-payments.sql Q2). It replaced `processed`, which was a real
               Payments column but has nothing to do with declines. */
            status: "Cleared", reason: "", note: "", dueDays: 0, stillOwed: false,
          };
          if (method === "cc") {
            const declined = rnd() < declineRate;
            txn.status = declined ? "Declined" : "Cleared";
            txn.reason = declined ? pick(DECLINE_REASONS) : "";
            txn.stillOwed = declined ? rnd() < 0.55 : false;   // was processed < 0.45 (inverted)
            txn.note = "instant result";
          } else if (method === "dd") {
            /* most DD clear in 1–3 business days; some take up to a week, and a
               small share are held far longer (disputes / bank holds) */
            const roll = rnd();
            const settleDays = roll < .03 ? intBetween(12, 45) : roll < .15 ? intBetween(4, 7) : intBetween(1, 3);
            if (daysAgo >= settleDays) {
              const declined = rnd() < declineRate;
              txn.status = declined ? "Declined" : "Cleared";
              txn.reason = declined ? pick(DECLINE_REASONS) : "";
              txn.stillOwed = declined ? rnd() < 0.55 : false;  // was processed < 0.45 (inverted)
              txn.note = `settled after ${settleDays}d`;
            } else {
              txn.status = "Processing";
              txn.dueDays = settleDays - daysAgo;
              txn.note = `day ${daysAgo + 1} of ~${settleDays}`;
            }
          } else if (method === "invoice") {
            /* invoice generated by the run; member pays later via BPAY / EFT / CC */
            const payAfter = intBetween(1, 45);
            if (daysAgo >= payAfter) {
              txn.status = "Cleared";
              txn.type = pick(["bpay", "bpay", "eft", "cc"]);
              txn.note = `invoice paid after ${payAfter}d`;
            } else {
              txn.status = "Awaiting payment";
              txn.note = `invoice outstanding ${daysAgo}d`;
            }
          } else if (method === "pd") {
            /* payroll reconciliation file: payments, pending or processing — never declined */
            if (daysAgo <= 2) { txn.status = "Processing"; txn.note = `matching, day ${daysAgo + 1}`; }
            else { txn.status = "Reconciled"; txn.note = `received ${intBetween(1, 12)}d after payroll`; }
          } else if (method === "bpay") {
            /* BPAY reconciliation file: payments, pending or processing — never declined */
            if (daysAgo <= 2) { txn.status = "Processing"; txn.note = `matching, day ${daysAgo + 1}`; }
            else { txn.status = "Reconciled"; txn.note = `matched ${daysAgo}d after receipt`; }
          }
          txns.push(txn);
        }

        /* A run created today has been generated but not yet submitted to the
           bank — every payment sits Pending until the overnight submission. */
        if (daysAgo === 0) {
          txns.forEach(t => { t.status = "Pending"; t.reason = ""; t.stillOwed = false; t.note = "awaiting submission to bank"; });
        }

        RUNS.push({
          id: String(runSeq++),   // bare batch id, matching live
          name: tpl.name,
          kind: tpl.kind,
          typeLabel: tpl.typeLabel,
          desc: tpl.desc,
          date: new Date(d),
          time: pick(["06:00", "06:30", "09:15", "11:00", "14:30", "16:45"]),
          txns, daysAgo,
        });
      }
    }
    RUNS.sort((a, b) => b.date - a.date);

    /* A small, fixed set of runs flagged for manual review — this tracker
       should rarely have anything in it. Both sit inside the 30-day window but
       outside the 7-day window, so the 7-day view is clean. */
    const reviewCandidates = RUNS.filter(r => r.daysAgo >= 8 && r.daysAgo < 30 && r.name === "Membership Dues — Daily Run");
    [reviewCandidates[0], reviewCandidates[reviewCandidates.length - 1]]
      .filter(Boolean)
      .forEach(r => { r.needsReview = true; });

    return RUNS;
  }

  /* ═══════════════════════════════════════════════════════════
     PUBLIC API
     The signatures are the LIVE ones — async, id-addressed, paged — so the
     views are already written against the shape real data will arrive in.
     ═══════════════════════════════════════════════════════════ */

  let RUNS = null;

  function isLive() {
    if (C.mode === "live") return true;
    if (C.mode === "mock") return false;
    return Core.isInIMIS();
  }

  /* ═══════════════════════════════════════════════════════════
     LIVE — CloudToolz 3-step relay
     Transport lifted from HubReportBuilder's api.js → cloudToolzFetch; see
     ../ReportBuilder/docs/CLOUDTOOLZ-INTEGRATION.md §0. Only usable inside a
     logged-in iMIS page: it needs the session cookie, #__RequestVerificationToken
     and #__ClientContext, none of which exist standalone.
     ═══════════════════════════════════════════════════════════ */

  const CT = { baseUrl: null };   // resolved once per page, then cached

  const imisToken = () => document.getElementById("__RequestVerificationToken")?.value || "";

  function clientContext() {
    const parse = raw => (!raw ? null : typeof raw === "string" ? JSON.parse(raw) : raw);
    let ctx = null;
    try {
      const el = document.getElementById("__ClientContext");
      if (el) ctx = parse(el.value || el.getAttribute("value") || el.textContent);
    } catch { /* fall through */ }
    if (!ctx) { try { ctx = parse(window.__ClientContext || window.__clientContext); } catch { /* ignore */ } }
    return {
      loggedInPartyId: ctx ? String(ctx.loggedInPartyId ?? ctx.LoggedInPartyId ?? "") : "",
      selectedPartyId: ctx ? String(ctx.selectedPartyId ?? ctx.SelectedPartyId ?? "") : "",
    };
  }

  /* Step 1 — resolve the CloudToolz base URL from an IQA. Cached for the page. */
  async function ctBaseUrl() {
    if (CT.baseUrl) return CT.baseUrl;
    const qs = new URLSearchParams({ queryname: "$/ZENTSO/Security/CloudToolzUrl" });
    const res = await fetch("/api/iqa?" + qs, {
      headers: { Accept: "application/json", RequestVerificationToken: imisToken() },
      credentials: "include",
    });
    if (!res.ok) throw new Error("Could not resolve the CloudToolz URL (HTTP " + res.status + ")");
    const json = await res.json();
    let raw = json?.Items?.["$values"]?.[0]?.Properties?.["$values"]?.[0]?.Value;
    if (raw !== null && typeof raw === "object" && "$value" in raw) raw = raw["$value"];
    if (!raw || typeof raw !== "string" || !raw.trim()) throw new Error("CloudToolz URL not found");
    CT.baseUrl = raw.trim().replace(/\/+$/, "");
    return CT.baseUrl;
  }

  /* Step 2 — mint a relay token. NOT single-use and valid ≥5 min (measured
     2026-07-25), so one mint per page load is enough; the response is discarded
     because the CT call never carries the token value. */
  async function mintZenToken(partyIds) {
    const prop = (Name, Value) => ({
      "$type": "Asi.Soa.Core.DataContracts.GenericPropertyData, Asi.Contracts", Name, Value,
    });
    const body = {
      "$type": "Asi.Soa.Core.DataContracts.GenericEntityData, Asi.Contracts",
      "EntityTypeName": "ZenTokens",
      "Properties": {
        "$type": "Asi.Soa.Core.DataContracts.GenericPropertyDataCollection, Asi.Contracts",
        "$values": [
          prop("PartyId", partyIds.loggedInPartyId),
          prop("ID", partyIds.loggedInPartyId),
          prop("SelectedPartyId", partyIds.selectedPartyId),
          prop("RequestVerificationToken", imisToken()),
          prop("UtcUnixTimeStamp", Date.now()),
        ],
      },
    };
    const res = await fetch("/api/ZenTokens", {
      method: "POST",
      headers: { Accept: "application/json", "Content-Type": "application/json", RequestVerificationToken: imisToken() },
      credentials: "include",
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("Could not authorise the data request (HTTP " + res.status + ")");
  }

  /* Step 3 — POST the endpoint and return its row array. */
  async function ctFetch(endpoint, payload) {
    if (!endpoint) throw new Error("No CloudToolz endpoint configured for this surface — see FDConfig.endpoints.");
    const base = await ctBaseUrl();
    const ids  = clientContext();
    if (!imisToken() || !ids.loggedInPartyId) {
      throw new Error("Not signed in to iMIS, or this page is missing its client context.");
    }
    await mintZenToken(ids);

    const res = await fetch(base + "/" + String(endpoint).replace(/^\/+/, ""), {
      method: "POST",
      headers: {
        Accept: "application/json",
        "Content-Type": "application/json",
        RequestVerificationToken: imisToken(),
        SelectedPartyId: ids.selectedPartyId,
        LoggedInPartyId: ids.loggedInPartyId,
        WebsiteKey: (typeof gWebsiteKey !== "undefined" ? gWebsiteKey : ""),
        HubReportMode: "report",
      },
      body: JSON.stringify(payload || {}),
    });
    if (!res.ok) throw new Error("The payment data service returned HTTP " + res.status + ".");

    /* The endpoint sends text/plain, so parse the body ourselves rather than
       trusting res.json() to be handed the right content type. */
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); }
    catch { throw new Error("The payment data service returned a malformed response."); }

    if (Array.isArray(data)) return data;
    for (const k of ["Data", "data", "Items", "items", "rows", "Rows", "Result", "result"]) {
      if (Array.isArray(data?.[k])) return data[k];
    }
    return [];
  }

  /* ── Q1 row → run object ──────────────────────────────────────────────────
     Builds `stats` in exactly the shape fd-core.js → runStats() returns, so
     runStats short-circuits on it (line ~88) and the trend, runs list, state
     pill and review chip need no changes at all.

     `waitCount`/`waitValue` are hard 0: "Awaiting payment" is the invoice
     world (Batch.Kind 1), which is v2. The KPI card reading them shows 0 by
     design.

     No `txns` — deliberately. Live mode never loads payment-grain data on this
     surface; anything still reducing over run.txns must be repointed at stats. */
  const num = v => (typeof v === "number" ? v : Number(v) || 0);

  function rowToRun(row) {
    const runDate = new Date(row.RunDate);
    const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const daysAgo = Math.round((midnight(new Date()) - midnight(runDate)) / 86400000);

    return {
      id:        String(row.BatchId),   // the URL key: ?BatchID=3837
      batchId:   row.BatchId,
      name:      row.BatchName || "Membership Dues",
      desc:      row.BatchDescription || "",
      typeLabel: num(row.DDCount) && num(row.CCCount) ? "CC / DD"
               : num(row.CCCount) ? "CC"
               : num(row.DDCount) ? "DD" : "",
      date: runDate,
      time: (row.RunTime || "").slice(0, 5),
      daysAgo,
      maxProcessingDays: row.MaxProcessingDays === null || row.MaxProcessingDays === undefined
        ? null : num(row.MaxProcessingDays),
      /* Per-method totals for the payments-by-type chart. */
      byType: {
        dd:  { count: num(row.DDCount),          value: num(row.DDValue) },
        cc:  { count: num(row.CCCount),          value: num(row.CCValue) },
        oth: { count: num(row.OtherMethodCount), value: num(row.OtherMethodValue) },
      },
      /* Statuses with no home in runStats, kept so nothing is silently lost. */
      errorCount: num(row.ErrorCount), errorValue: num(row.ErrorValue),
      otherCount: num(row.OtherCount), otherValue: num(row.OtherValue),

      stats: {
        count:      num(row.TotalCount),
        okCount:    num(row.ClearedCount),    okValue:   num(row.ClearedValue),
        procCount:  num(row.ProcessingCount), procValue: num(row.ProcessingValue),
        pendCount:  num(row.PendingCount),    pendValue: num(row.PendingValue),
        waitCount:  0,                        waitValue: 0,      // invoice world = v2
        badCount:   num(row.DeclinedCount),   badValue:  num(row.DeclinedValue),
        badUnprocessed: num(row.DeclinedUnprocessedCount),
        totalValue: num(row.TotalValue),
      },
    };
  }

  /* Every run in the history window, newest first. ONE call in live mode: the
     pre-aggregated batch summary (v1-payments.sql Q1). The 7/30/90 range picker
     then filters this in memory, so switching range costs no network. */
  async function load() {
    if (RUNS) return RUNS;

    if (!isLive()) { RUNS = buildMockRuns(); return RUNS; }

    const today = new Date();
    const iso = d => d.toISOString().slice(0, 10);
    const from = new Date(today); from.setDate(from.getDate() - C.historyDays);
    /* @ToDate is EXCLUSIVE and set to tomorrow, so today is included and
       future-dated runs (scheduled retries) are not — they are v2. */
    const to = new Date(today); to.setDate(to.getDate() + 1);

    const rows = await ctFetch(C.endpoints && C.endpoints.dashboard,
                               { FromDate: iso(from), ToDate: iso(to) });
    if (C.debug) console.log("[FinanceDashboard] Q1 returned", rows.length, "runs");

    RUNS = rows.map(rowToRun).sort((a, b) => b.date - a.date || b.batchId - a.batchId);
    return RUNS;
  }

  /* One run's header + roll-up. On the dedicated run page this is the FIRST
     call, and in live mode it is the same summary view filtered to one batch —
     one row, not a transaction scan. */
  async function loadRun(runId) {
    const all = await load();
    return all.find(r => r.id === runId) || null;
  }

  /* One page of a run's transactions. In live mode this is the only call that
     touches payment-grain data, and it is always bounded: one batch, one page.
     Returns { rows, total }. */
  async function loadTransactions(runId, { status = "all", search = "", page = 1, pageSize = C.txnPageSize } = {}) {
    const run = await loadRun(runId);
    if (!run) return { rows: [], total: 0 };
    const q = (search || "").toLowerCase();
    let rows = run.txns;
    if (status !== "all") rows = rows.filter(t => t.status === status);
    if (q) rows = rows.filter(t => (t.member + " " + t.ref + " " + t.memberId).toLowerCase().includes(q));
    const total = rows.length;
    const from = (Math.max(1, page) - 1) * pageSize;
    return { rows: rows.slice(from, from + pageSize), total };
  }

  const runsInRange = (rangeDays) => (RUNS || []).filter(r => r.daysAgo < rangeDays);
  const findRun = (runId) => (RUNS || []).find(r => r.id === runId) || null;
  const all = () => RUNS || [];

  return { load, loadRun, loadTransactions, runsInRange, findRun, all, isLive, TODAY };
})();


/* ══ fd-run.js ══ */
/**
 * fd-run.js — Finance Dashboard: the dedicated payment-run surface
 * © Union Innovation Hub.
 *
 * Renders one payment run in full: header, KPI row, by-type / outcome / decline
 * breakdowns, and the transactions table.
 *
 * It serves two callers, and the only difference between them is how you get
 * back to the run list:
 *   • payment-run.html — its OWN page. `?BatchID=<id>` names the run, and "Back to
 *     dashboard" in the header navigates to the run-list page. Browser Back
 *     works too, because getting here was a real navigation.
 *   • index.html fallback — when no run page is configured for this
 *     environment, FD.openRun() calls showInline() and this renders into the
 *     dashboard page's hidden #view-detail container, with an in-page back
 *     button. That is the original single-file mockup's behaviour.
 *
 * Exposes `window.FDRun`, and its UI callbacks on the shared `window.FD`.
 */
window.FDRun = (function () {
  "use strict";

  const C    = window.FDConfig;
  const Core = window.FDCore;
  const Data = window.FDData;
  const FD   = window.FD = window.FD || {};

  const { $, fmtMoney, fmtNum, fmtDateLong, esc, PAY_TYPES, typeById, isPaid,
          declineKind, STATUS_ORDER, runStats, runStatePill, txnBadge, toast } = Core;

  const detailState = { runId: null, filter: "all", search: "", page: 1 };
  FD.detailState = detailState;

  /* ═══════════════════════════════════════════════════════════
     ENTRY POINTS
     ═══════════════════════════════════════════════════════════ */

  /* Boot the dedicated run page from the URL. */
  async function boot() {
    Core.Nav.surface = "run";
    const runId = Core.Nav.runIdFromUrl();
    const container = $("detail-content");

    /* Before anything can fail: the way out belongs in the header even on the
       error paths, or a stale link strands the user on a dead page. */
    renderBackAffordance();

    if (!runId) {
      Core.notice(container, "No payment run selected",
        "This page shows one payment run. Open it from the payment-runs dashboard, " +
        "or add ?" + C.runParam + "=<run id> to the address.", "Go to the dashboard");
      return;
    }

    await Data.load();
    const run = await Data.loadRun(runId);
    if (!run) {
      Core.notice(container, "Payment run not found",
        `No payment run matching “${runId}” is available in the last ${C.historyDays} days. ` +
        "It may have been archived, or the link may be stale.", "Back to all payment runs");
      return;
    }

    detailState.runId = runId;
    detailState.filter = "all";
    detailState.search = "";
    detailState.page = 1;
    await renderDetail();
  }

  /* Fallback path: render into the dashboard page without a navigation. */
  async function showInline(runId) {
    detailState.runId = runId;
    detailState.filter = "all";
    detailState.search = "";
    detailState.page = 1;
    $("view-dashboard").style.display = "none";
    $("view-declines").style.display = "none";
    $("view-detail").style.display = "";
    $("main-scroll").scrollTop = 0;
    renderBackAffordance();
    await renderDetail();
  }

  /* The way back differs per caller, so it is decided once, here.
     On its own page the header carries the link (it survives every re-render of
     #detail-content); inline, an in-page button above the content is right,
     because the header belongs to the dashboard. */
  function renderBackAffordance() {
    const headerSlot = $("header-back-slot");
    const inlineSlot = $("detail-back-slot");
    const dedicated = Core.Nav.surface === "run";

    if (headerSlot) {
      headerSlot.innerHTML = dedicated
        ? `<a class="header-back" href="${esc(Core.Nav.urlFor("dashboard") || "#")}"><em class="fa-solid fa-arrow-left"></em> Back to dashboard</a>`
        : "";
    }
    if (inlineSlot) {
      inlineSlot.innerHTML = dedicated
        ? ""
        : `<button type="button" class="back-btn"><em class="fa-solid fa-arrow-left"></em> Back to all payment runs</button>`;
    }
    const ctx = $("header-context");
    if (ctx && dedicated) ctx.textContent = "Payment run detail";
  }

  /* One handler for both shapes. As an <a> it has a real href, so middle-click
     and "open in new tab" work; the click handler keeps the in-page fallback and
     avoids a pointless reload when navigation isn't configured. */
  FD.backToDashboard = function (event) {
    if (Core.Nav.gotoDashboard()) return true;      // let the <a> / assign() run
    if (event) event.preventDefault();
    if (window.FD.showDashboard) window.FD.showDashboard();
    else window.history.back();
    return false;
  };

  FD.setDetailFilter = function (f, btn) {
    detailState.filter = f;
    detailState.page = 1;
    btn.parentElement.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c === btn));
    renderDetailTable();
  };
  FD.setDetailSearch = function (v) {
    detailState.search = v;
    detailState.page = 1;
    renderDetailTable();
  };

  /* ═══════════════════════════════════════════════════════════
     RENDER
     ═══════════════════════════════════════════════════════════ */
  async function renderDetail() {
    const run = Data.findRun(detailState.runId);
    if (!run) return;
    const s = runStats(run);

    /* by-type summary */
    const typeRows = PAY_TYPES.map(pt => {
      const mine = run.txns.filter(t => t.type === pt.id);
      if (!mine.length) return null;
      const ok = mine.filter(isPaid);
      return {
        pt, count: mine.length,
        okCount: ok.length,
        pendCount: mine.filter(t => t.status === "Processing" || t.status === "Awaiting payment" || t.status === "Pending").length,
        badCount: mine.filter(t => t.status === "Declined").length,
        okValue: ok.reduce((x, t) => x + t.amount, 0),
      };
    }).filter(Boolean).sort((a, b) => b.count - a.count);

    /* outcome rows — one per payment status, same set the transactions table shows */
    const statusRows = STATUS_ORDER.map(status => {
      const mine = run.txns.filter(t => t.status === status);
      return mine.length ? { status, count: mine.length, value: mine.reduce((x, t) => x + t.amount, 0) } : null;
    }).filter(Boolean);

    /* decline reasons */
    const reasonCounts = {};
    run.txns.filter(t => t.status === "Declined").forEach(t => {
      reasonCounts[t.reason] = reasonCounts[t.reason] || { count: 0, value: 0, unproc: 0 };
      reasonCounts[t.reason].count++;
      reasonCounts[t.reason].value += t.amount;
      if (t.stillOwed) reasonCounts[t.reason].unproc++;
    });
    const reasons = Object.entries(reasonCounts).sort((a, b) => b[1].count - a[1].count);
    const softUnproc = reasons.filter(([r]) => declineKind(r) === "Soft").reduce((x, [, r]) => x + r.unproc, 0);

    $("detail-content").innerHTML = `
      <div class="detail-hd">
        <div>
          <h2>${esc(run.name)}<span class="detail-hd-date">${fmtDateLong(run.date)}<span class="time">${esc(run.time)}</span></span></h2>
          <div class="detail-hd-meta">${runStatePill(run)}<span>Batch ${esc(run.id)}${run.typeLabel ? " · " + esc(run.typeLabel) : ""}${run.desc ? " · " + esc(run.desc) : ""}</span></div>
        </div>
        <span class="spacer"></span>
        <button type="button" class="detail-action"><em class="fa-solid fa-print"></em> Print</button>
        <button type="button" class="detail-action"><em class="fa-solid fa-download"></em> Export CSV</button>
        ${softUnproc ? `<button type="button" class="detail-action danger" batch created for ${softUnproc} unprocessed soft decline${softUnproc > 1 ? "s" : ""} (mock)','success')" title="Soft declines not yet retried — hard declines are excluded"><em class="fa-solid fa-rotate-right"></em> Retry declines (${softUnproc})</button>` : ""}
      </div>

      <div class="kpi-grid" style="margin-top:14px;">
        <div class="kpi-card"><div class="kpi-label">Payments in run</div><div class="kpi-value">${fmtNum(s.count)}</div><div class="kpi-sub">${typeRows.length} payment type${typeRows.length > 1 ? "s" : ""}</div></div>
        <div class="kpi-card"><div class="kpi-label">Collected</div><div class="kpi-value brand">${fmtMoney(s.okValue)}</div><div class="kpi-sub">${fmtNum(s.okCount)} payments cleared</div></div>
        <div class="kpi-card"><div class="kpi-label">Processing</div><div class="kpi-value ${s.procCount ? "" : "pos"}">${fmtNum(s.procCount)}</div><div class="kpi-sub">${fmtMoney(s.procValue)} awaiting DD result</div></div>
        <div class="kpi-card"><div class="kpi-label">Invoices outstanding</div><div class="kpi-value">${fmtNum(s.waitCount)}</div><div class="kpi-sub">${fmtMoney(s.waitValue)} awaiting payment</div></div>
        <div class="kpi-card"><div class="kpi-label">Declined</div><div class="kpi-value ${s.badCount ? "neg" : "pos"}">${fmtNum(s.badCount)}</div><div class="kpi-sub">${fmtMoney(s.badValue)} uncollected</div></div>
        <div class="kpi-card"><div class="kpi-label">Average payment</div><div class="kpi-value">${fmtMoney(s.okCount ? s.okValue / s.okCount : 0)}</div><div class="kpi-sub">collected payments only</div></div>
      </div>

      <div class="detail-panels">
        <div class="panel">
          <div class="panel-title">Payment type</div>
          <table class="mini-table">
            <thead><tr><th>Type</th><th class="num">Count</th><th class="num">OK</th><th class="num">Pend.</th><th class="num">Dec.</th><th class="num">Collected</th></tr></thead>
            <tbody>
              ${typeRows.map(r => `<tr>
                <td>${esc(r.pt.label)}</td>
                <td class="num">${fmtNum(r.count)}</td>
                <td class="num">${fmtNum(r.okCount)}</td>
                <td class="num">${fmtNum(r.pendCount)}</td>
                <td class="num">${fmtNum(r.badCount)}</td>
                <td class="num">${fmtMoney(r.okValue)}</td>
              </tr>`).join("")}
            </tbody>
            <tfoot><tr><td>Total</td><td class="num">${fmtNum(s.count)}</td><td class="num">${fmtNum(s.okCount)}</td><td class="num">${fmtNum(s.pendCount + s.procCount + s.waitCount)}</td><td class="num">${fmtNum(s.badCount)}</td><td class="num">${fmtMoney(s.okValue)}</td></tr></tfoot>
          </table>
        </div>

        <div class="panel">
          <div class="panel-title">Outcome</div>
          <table class="mini-table">
            <thead><tr><th>Outcome</th><th class="num">Count</th><th class="num">Value</th></tr></thead>
            <tbody>
              ${statusRows.map(r => `<tr>
                <td>${esc(r.status)}</td>
                <td class="num">${fmtNum(r.count)}</td>
                <td class="num">${fmtMoney(r.value)}</td>
              </tr>`).join("")}
            </tbody>
            <tfoot><tr><td>Total</td><td class="num">${fmtNum(s.count)}</td><td class="num">${fmtMoney(statusRows.reduce((x, r) => x + r.value, 0))}</td></tr></tfoot>
          </table>
        </div>

        <div class="panel">
          <div class="panel-title">Decline reasons</div>
          ${reasons.length ? `
          <table class="mini-table">
            <thead><tr><th>Reason</th><th>Type</th><th class="num">Count</th><th class="num">Unproc.</th></tr></thead>
            <tbody>
              ${reasons.map(([reason, r]) => {
                const kind = declineKind(reason);
                return `<tr>
                <td>${esc(reason)}</td>
                <td>${kind}</td>
                <td class="num">${fmtNum(r.count)}</td>
                <td class="num">${kind === "Soft" ? fmtNum(r.unproc) : "—"}</td>
              </tr>`;
              }).join("")}
            </tbody>
            <tfoot><tr><td>Total</td><td></td><td class="num">${fmtNum(s.badCount)}</td><td class="num">${fmtNum(softUnproc)}</td></tr></tfoot>
          </table>` : `<div style="font-size:12px;color:var(--text-muted);font-style:italic;padding:6px 0;">No declined payments in this run.</div>`}
        </div>
      </div>

      <div class="section-title" style="margin-top:24px;">Transactions <span class="count-badge" id="txn-count-badge">${fmtNum(s.count)}</span></div>
      <div class="runs-toolbar">
        <input type="text" class="runs-search" id="txn-search" placeholder="Search member, reference…" />
        <span style="flex:1"></span>
        <button type="button" class="filter-chip active">All</button>
        <button type="button" class="filter-chip">Pending</button>
        <button type="button" class="filter-chip">Cleared</button>
        <button type="button" class="filter-chip">Processing</button>
        <button type="button" class="filter-chip">Awaiting</button>
        <button type="button" class="filter-chip">Declined</button>
      </div>
      <div id="txn-table-slot"></div>`;

    await renderDetailTable();
  }

  async function renderDetailTable() {
    if (!detailState.runId) return;
    const { rows, total } = await Data.loadTransactions(detailState.runId, {
      status: detailState.filter,
      search: detailState.search,
      page: detailState.page,
      pageSize: C.txnPageSize,
    });

    const badge = $("txn-count-badge");
    if (badge) badge.textContent = fmtNum(total);

    const slot = $("txn-table-slot");
    if (!slot) return;
    slot.innerHTML = `
      <div class="table-wrap">
        <table class="report-table">
          <thead><tr>
            <th>Reference</th><th>Member</th><th>Member ID</th><th>Payment type</th>
            <th class="num">Amount</th><th>Status</th><th>Result / note</th>
          </tr></thead>
          <tbody>
            ${rows.map(t => {
              const pt = typeById(t.type);
              return `<tr>
                <td class="cell-muted">${esc(t.ref)}</td>
                <td class="cell-strong">${esc(t.member)}</td>
                <td class="cell-muted">${esc(t.memberId)}</td>
                <td><span class="type-chip" style="background:${pt.pale};color:${pt.color}">${esc(pt.label)}</span></td>
                <td class="num cell-amount ${t.status === "Declined" ? "neg" : ""}">${fmtMoney(t.amount)}</td>
                <td>${txnBadge(t.status)}</td>
                <td class="cell-muted">${esc(t.reason) || esc(t.note) || "—"}</td>
              </tr>`;
            }).join("")}
            ${!rows.length ? `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);font-style:italic;">No transactions match the current filters.</td></tr>` : ""}
          </tbody>
        </table>
      </div>
      ${total > C.txnPageSize ? `<p class="more-note">Showing first ${C.txnPageSize} of ${fmtNum(total)} transactions — use Export CSV for the full list.</p>` : ""}`;
    Core.syncStuckTables();
  }

  FD.toast = FD.toast || toast;

  return { boot, showInline, renderDetail, renderDetailTable };
})();


/* ══ fd-dashboard.js ══ */
/**
 * fd-dashboard.js — Finance Dashboard: the run-list surface
 * © Union Innovation Hub.
 *
 * Two views live here: the dashboard (KPIs, daily-volume trend, payments by
 * type, the runs list grouped by date).
 *
 * The declines / arrears area is NOT here — it is its own surface
 * (arrears.html + fd-arrears.js) and is v2.
 *
 * Clicking a run calls FD.openRun(), which NAVIGATES to the dedicated payment
 * run page (payment-run.html / its RiSE page) rather than swapping a hidden div
 * into view. See fd-core.js → Nav for why that works inside an inlined iPart.
 *
 * Inline handlers are namespaced `FD.…` because this file is an IIFE — a bare
 * `onclick="setRange(…)"` has nothing to resolve against, and bare globals in a
 * live iMIS page risk colliding with iMIS's own scripts.
 */
(function () {
  "use strict";

  const C    = window.FDConfig;
  const Core = window.FDCore;
  const Data = window.FDData;
  const FD   = window.FD = window.FD || {};

  const { $, fmtMoney, fmtNum, fmtPct, fmtDateLong, fmtDateShort, esc,
          PAY_TYPES, typeById, isPaid, runStats, runState, isLongProcessingRun,
          txnBadge, runStatePill, toast, flashSwap } = Core;

  /* ═══════════════════════════════════════════════════════════
     STATE
     ═══════════════════════════════════════════════════════════ */
  const state = { rangeDays: 30, runFilter: "all", longProc: false };
  FD.state = state;

  const runsInRange = () => Data.runsInRange(state.rangeDays);

  /* ── Roll-ups across a set of runs ────────────────────────────────────────
     Both go through runStats()/run.byType rather than reducing over run.txns.
     That is load-bearing: LIVE MODE HAS NO run.txns. Q1 returns one
     pre-aggregated row per run and never payment-grain data, so anything that
     reaches for .txns throws on the live shape (REVIEW-2026-07.md #1).
     runStats() short-circuits to run.stats when it is present, so these work
     unchanged in mock mode too — one code path, both modes. */
  function totals(runs) {
    const t = { count: 0, okCount: 0, okValue: 0, procCount: 0, procValue: 0,
                pendCount: 0, pendValue: 0, waitCount: 0, waitValue: 0,
                badCount: 0, badValue: 0, badUnprocessed: 0, totalValue: 0 };
    runs.forEach(r => {
      const s = runStats(r);
      for (const k in t) t[k] += s[k] || 0;
    });
    return t;
  }

  /* Per-payment-type totals. Live runs carry a pre-aggregated `byType`
     (dd / cc / oth); mock runs still have transactions, so fall back to those.
     NOTE: v1 is Kind 2 only, so live data populates dd and cc — the other four
     PAY_TYPES render as zero, which is correct. `byType.oth` has no matching
     PAY_TYPE and is therefore not charted; it should be 0 for Kind 2, and a
     non-zero OtherMethodCount in Q1 is the signal that something unexpected
     turned up. */
  function typeTotals(runs) {
    const out = {};
    PAY_TYPES.forEach(pt => { out[pt.id] = { count: 0, value: 0 }; });
    runs.forEach(r => {
      if (r.byType) {
        for (const id of ["dd", "cc"]) {
          if (out[id] && r.byType[id]) { out[id].count += r.byType[id].count; out[id].value += r.byType[id].value; }
        }
        return;
      }
      (r.txns || []).forEach(t => {
        const o = out[t.type];
        if (o) { o.count++; o.value += t.amount; }
      });
    });
    return out;
  }

  function setMetricActive(btn) {
    btn.parentNode.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }
  FD.setTrendMetric = (m, btn) => { state.trendMetric = m; setMetricActive(btn); renderTrend(); };
  FD.setTypeMetric  = (m, btn) => { state.typeMetric  = m; setMetricActive(btn); renderTypeBars(); };

  FD.setRange = function (days) {
    state.rangeDays = parseInt(days, 10);
    $("kpi-range-days").textContent = state.rangeDays;
    renderDashboard();
  };
  FD.setRunFilter = function (f, btn) {
    state.runFilter = f;
    state.longProc = false;
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c === btn));
    state.animateRuns = true;
    renderRuns();
  };
  FD.showLongProcessing = function () {
    if (!runsInRange().some(isLongProcessingRun)) return;
    state.longProc = true;
    const search = $("runs-search"); if (search) search.value = "";
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c.dataset.f === "review"));
    state.animateRuns = true;
    renderRuns();
    const ms = $("main-scroll"), el = $("runs-list");
    if (ms && el) ms.scrollTop += el.getBoundingClientRect().top - ms.getBoundingClientRect().top - 14;
  };
  FD.setReviewFilter = function (btn) {
    state.longProc = true;
    state.runFilter = "all";
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c === btn));
    state.animateRuns = true;
    renderRuns();
  };
  FD.clearLongProcessing = function () {
    state.longProc = false;
    state.runFilter = "all";
    document.querySelectorAll(".filter-chip").forEach(c => c.classList.toggle("active", c.dataset.f === "all"));
    renderRuns();
  };

  /* ═══════════════════════════════════════════════════════════
     OPENING A RUN — the crossing point between the two surfaces
     ═══════════════════════════════════════════════════════════ */
  FD.openRun = function (runId) {
    /* Preferred path: a real navigation to the dedicated run page, so the run
       gets its own URL, its own history entry and a working browser Back. */
    if (Core.Nav.gotoRun(runId)) return;

    /* Fallback, when no run page is configured for this environment: render the
       run detail into this page's hidden container, the way the original
       single-file mockup did. */
    if (window.FDRun) window.FDRun.showInline(runId);
    else toast("No payment run page is configured for this site.", "");
  };

  FD.showDashboard = function () {
    const detail = $("view-detail");
    if (detail) detail.style.display = "none";
    $("view-dashboard").style.display = "";
    $("main-scroll").scrollTop = 0;
    const ctx = $("header-context");
    if (ctx) ctx.textContent = "Payment runs & settlement tracking";
  };

  /* ═══════════════════════════════════════════════════════════
     VIEW 1 — DASHBOARD
     ═══════════════════════════════════════════════════════════ */
  function renderDashboard() {
    renderKpis();
    renderTrend();
    renderTypeBars();
    renderRuns();
  }
  FD.renderDashboard = renderDashboard;

  function renderKpis() {
    const runs = runsInRange();
    const t = totals(runs);

    /* Previous period comparison. Needs rangeDays × 2 of history loaded, which
       is why FDConfig.historyDays is 365 — at 90 the 90-day range has none. */
    const prev = Data.all().filter(r => r.daysAgo >= state.rangeDays && r.daysAgo < state.rangeDays * 2);
    const prevOkValue = totals(prev).okValue;
    const delta = prevOkValue ? (t.okValue - prevOkValue) / prevOkValue : 0;
    const deltaTxt = delta >= 0
      ? `<span class="up"><em class="fa-solid fa-caret-up"></em> ${fmtPct(Math.abs(delta))}</span> vs prior period`
      : `<span class="down"><em class="fa-solid fa-caret-down"></em> ${fmtPct(Math.abs(delta))}</span> vs prior period`;

    const kpis = [
      { label: "Total collected", value: fmtMoney(t.okValue), cls: "brand", sub: deltaTxt },
      { label: "Payments processed", value: fmtNum(t.count), sub: `across ${runs.length} payment runs` },
      { label: "Processing", value: fmtNum(t.procCount), cls: t.procCount ? "" : "pos", sub: `${fmtMoney(t.procValue)} awaiting DD result` },
      /* Always 0 in v1: "Awaiting payment" is the invoice world (Batch.Kind 1),
         which is v2. Kept deliberately — see README "Scope". */
      { label: "Invoices outstanding", value: fmtNum(t.waitCount), sub: `${fmtMoney(t.waitValue)} awaiting member payment` },
      /* No `action` in v1: the declines/arrears view is v2 (see README "Scope"),
         and this card was its only entry point. Restore
         action: "FD.showDeclines()", hint: "View declines ›"
         when #view-declines is built. */
      { label: "Declined", value: fmtNum(t.badCount), cls: t.badCount ? "neg" : "pos", sub: `${fmtMoney(t.badValue)} uncollected` },
    ];
    const reviewCount = runs.filter(isLongProcessingRun).length;
    const chip = $("chip-review");
    if (chip) {
      $("chip-review-count").textContent = fmtNum(reviewCount);
      chip.disabled = !reviewCount;
      chip.style.opacity = reviewCount ? "" : ".45";
      chip.style.cursor = reviewCount ? "" : "default";
    }
    kpis.push(reviewCount
      ? { label: "Runs to review", value: fmtNum(reviewCount), cls: "neg", sub: `processing longer than ${C.reviewProcessingDays} days`, action: "FD.showLongProcessing()", hint: "View runs ›" }
      : { label: "Runs to review", value: "0", cls: "pos", sub: "nothing needs attention" });
    $("kpi-grid").innerHTML = kpis.map(k => `
      <div class="kpi-card${k.action ? " clickable" : ""}"${k.action ? ` role="button" tabindex="0" title="${k.label}"` : ""}>
        <div class="kpi-label">${k.label}${k.hint ? `<span class="kpi-hint">${k.hint}</span>` : ""}</div>
        <div class="kpi-value ${k.cls || ""}">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>`).join("");
  }

  function paintTrend(svg, geo) {
    geo.forEach((g, i) => {
      const ok  = svg.querySelector(`rect[data-b="ok"][data-i="${i}"]`);
      const bad = svg.querySelector(`rect[data-b="bad"][data-i="${i}"]`);
      if (ok) {
        ok.setAttribute("x", g.x); ok.setAttribute("width", g.w);
        ok.setAttribute("y", g.okH ? g.okY : 130); ok.setAttribute("height", g.okH);
        ok.setAttribute("opacity", g.okH ? "0.85" : "0");
        const t = ok.querySelector("title"); if (t) t.textContent = g.tip;
      }
      if (bad) {
        bad.setAttribute("x", g.x); bad.setAttribute("width", g.w);
        bad.setAttribute("y", g.badH ? g.badY : 130); bad.setAttribute("height", g.badH);
        bad.setAttribute("opacity", g.badH ? "0.8" : "0");
      }
    });
  }

  function renderTrend() {
    const byValue = (state.trendMetric || "value") === "value";
    const fmtM = byValue ? fmtMoney : fmtNum;
    const days = Math.min(state.rangeDays, C.historyDays);

    /* One pass over the runs, bucketed by daysAgo, instead of re-filtering the
       whole set once per day — that inner filter is O(days × runs) and with real
       volumes (a few hundred runs over 90 days) it is the only hot loop here. */
    const buckets = new Map();
    for (const r of Data.all()) {
      if (r.daysAgo >= days) continue;
      let b = buckets.get(r.daysAgo);
      if (!b) buckets.set(r.daysAgo, b = { ok: 0, bad: 0, date: r.date });
      const s = runStats(r);
      b.ok  += byValue ? s.okValue  : s.okCount;
      b.bad += byValue ? s.badValue : s.badCount;
    }

    const byDay = [];
    for (let i = days - 1; i >= 0; i--) {
      const b = buckets.get(i);
      byDay.push({ i, ok: b ? b.ok : 0, bad: b ? b.bad : 0, date: b ? b.date : null });
    }

    const W = 560, H = 130, PAD = 4;
    const max = Math.max(...byDay.map(d => d.ok), 1);
    const bw = (W - PAD * 2) / byDay.length;
    /* Geometry per day; both rects always exist so a metric switch morphs
       instead of redrawing */
    const geo = byDay.map((d, idx) => {
      const x = PAD + idx * bw;
      const okH  = (d.ok / max) * (H - 18);
      const badH = d.bad > 0 ? Math.max((d.bad / max) * (H - 18), 1.5) : 0;
      return {
        x: +(x + bw * 0.12).toFixed(1), w: +(bw * 0.76).toFixed(1),
        okY: +(H - okH).toFixed(1), okH: +okH.toFixed(1),
        badY: +(H - okH - badH - (badH ? 1 : 0)).toFixed(1), badH: +badH.toFixed(1),
        tip: `${d.date ? fmtDateShort(d.date) : ""}: ${fmtM(d.ok)} collected${d.bad ? ", " + fmtM(d.bad) + " declined" : ""}`,
      };
    });
    const svg = $("trend-svg");
    if (svg.dataset.days !== String(geo.length)) {
      svg.dataset.days = String(geo.length);
      svg.innerHTML = `<line x1="0" y1="${H - 0.5}" x2="${W}" y2="${H - 0.5}" stroke="#d0d7e3" stroke-width="1"/>` +
        geo.map((g, i) => `<rect data-b="ok" data-i="${i}" x="${g.x}" y="${H}" width="${g.w}" height="0" rx="1.5" fill="#2563c4" opacity="0.85"><title></title></rect><rect data-b="bad" data-i="${i}" x="${g.x}" y="${H}" width="${g.w}" height="0" rx="1" fill="#dc2626" opacity="0.8"></rect>`).join("");
      requestAnimationFrame(() => paintTrend(svg, geo));
    } else {
      paintTrend(svg, geo);
    }

    /* Y-axis value labels (max → 0) and X-axis date labels across the range */
    $("trend-yaxis").innerHTML = `<span>${fmtM(max)}</span><span>${fmtM(byValue ? max / 2 : Math.round(max / 2))}</span><span>${byValue ? "$0" : "0"}</span>`;
    $("trend-lg-ok").textContent  = byValue ? "Collected value" : "Collected payments";
    $("trend-lg-bad").textContent = byValue ? "Declined value"  : "Declined payments";
    flashSwap($("trend-yaxis"));
    flashSwap($("trend-lg-ok").closest(".trend-legend"));
    const N = byDay.length;
    const dateAt = idx => {
      let j = idx; while (j < N && !byDay[j].date) j++;
      if (j >= N || !byDay[j].date) { j = idx; while (j >= 0 && !byDay[j].date) j--; }
      return (j >= 0 && byDay[j] && byDay[j].date) ? fmtDateShort(byDay[j].date) : "";
    };
    const xlabels = [0, 0.25, 0.5, 0.75, 1].map(f => dateAt(Math.round(f * (N - 1))));
    $("trend-xaxis").innerHTML = xlabels.map(l => `<span>${l}</span>`).join("");
  }

  function renderTypeBars() {
    const byType = typeTotals(runsInRange());
    const rows = PAY_TYPES.map(pt => ({ pt, count: byType[pt.id].count, value: byType[pt.id].value }));
    const byValue = (state.typeMetric || "count") === "value";
    const metric = r => byValue ? r.value : r.count;
    const max = Math.max(...rows.map(metric), 1);
    const cont = $("type-bars");

    /* Rows stay in a fixed DOM order and are re-ranked with translateY, so a
       metric switch animates (bar width + position) instead of redrawing. */
    if (cont.childElementCount !== rows.length) {
      cont.innerHTML = rows.map(r => `
        <div class="hbar-row" data-t="${r.pt.id}">
          <div class="hbar-label" title="${esc(r.pt.label)}">${esc(r.pt.label)}</div>
          <div class="hbar-track"><div class="hbar-fill" style="width:0%;background:${r.pt.color}"></div></div>
          <div class="hbar-val"><span class="m">${fmtNum(r.count)}</span> · <span class="m">${fmtMoney(r.value)}</span></div>
        </div>`).join("");
    }
    const ranked = rows.slice().sort((a, b) => metric(b) - metric(a));

    /* Pitch = the real distance between two rows, read as an offsetTop delta.
       offsetTop is a LAYOUT position, so it ignores the transforms already
       applied by a previous render — which is what makes this safe to re-measure
       on every pass.

       It used to be `firstChild.offsetHeight + 8`, which had two problems. The 8
       silently duplicated `#type-bars`'s CSS `gap`, so changing the gap broke the
       chart. Worse, if the stylesheet has not applied yet the row measures its
       unstyled height (36px, because the label/track/value stack as blocks
       instead of laying out as a flex row) and every offset comes out ~1.7×
       too big — rows overlap above and leave a gap below. That is what Firefox
       showed on first load, where it lost the race against the runtime-injected
       fd-styles.css that Chromium happened to win; the real fix for that is in
       fd-boot.js, but this measurement should not have been fragile either. */
    const rowEls = Array.from(cont.children);
    const pitch = rowEls.length > 1 ? rowEls[1].offsetTop - rowEls[0].offsetTop : 0;

    /* Nothing sensible to measure (detached, display:none, stylesheet still
       pending). Render the bars and figures, but leave the rows in DOM order
       instead of scattering them at a guessed pitch. `typeBarsPending` tells the
       fonts/stylesheet-ready pass in fd-boot.js to come back once layout is real. */
    const rankable = pitch > 0;
    FD.typeBarsPending = !rankable;

    rows.forEach((r, domIdx) => {
      const el = cont.querySelector(`.hbar-row[data-t="${r.pt.id}"]`);
      if (!el) return;
      const rank = ranked.indexOf(r);
      el.style.transform = rankable ? `translateY(${(rank - domIdx) * pitch}px)` : "";
      el.style.zIndex = String(rows.length - rank);
      const val = el.querySelector(".hbar-val");
      /* Bold whichever figure the active toggle is ranking by */
      const html = `<span class="m${byValue ? "" : " on"}">${fmtNum(r.count)}</span> · <span class="m${byValue ? " on" : ""}">${fmtMoney(r.value)}</span>`;
      if (val.innerHTML !== html) { val.innerHTML = html; flashSwap(val); }
      requestAnimationFrame(() => {
        el.querySelector(".hbar-fill").style.width = (metric(r) / max * 100).toFixed(1) + "%";
      });
    });
  }

  /* Exposed so fd-boot.js can re-run the one measurement-dependent render once
     fonts settle — see FD.typeBarsPending above. */
  FD.renderTypeBars = renderTypeBars;

  /* ── Runs list grouped by date ───────────────────────────── */

  /* Staggered entrance for the runs list after a quick-filter change */
  function staggerRuns() {
    state.animateRuns = false;
    const list = $("runs-list");
    if (!list) return;
    list.classList.remove("runs-anim");
    void list.offsetWidth;
    list.classList.add("runs-anim");
    let i = 0;
    list.querySelectorAll(".run-card-5c, .runs-empty").forEach(el => {
      el.style.animationDelay = Math.min(i++ * 22, 260) + "ms";
    });
    list.addEventListener("animationend", function done(e) {
      if (e.target !== list) return;
      list.removeEventListener("animationend", done);
    });
  }

  function renderRuns() {
    const q = ($("runs-search").value || "").toLowerCase();
    let runs = state.longProc ? Data.all().filter(isLongProcessingRun) : runsInRange();
    if (!state.longProc && state.runFilter !== "all") runs = runs.filter(r => runState(r).key === state.runFilter);
    if (q) runs = runs.filter(r => (r.name + " " + r.id + " " + r.typeLabel + " " + fmtDateLong(r.date)).toLowerCase().includes(q));

    const badge = $("runs-count-badge");
    if (badge) badge.textContent = fmtNum(runs.length);

    const notice = state.longProc
      ? `<div class="filter-notice">Showing <strong>${fmtNum(runs.length)}</strong> run${runs.length === 1 ? "" : "s"} with payments processing longer than ${C.reviewProcessingDays} days — across all dates. <button type="button">Clear filter</button></div>`
      : "";

    if (!runs.length) {
      $("runs-list").innerHTML = notice + `<div class="runs-empty">No payment runs match the current filters.</div>`;
      if (state.animateRuns) staggerRuns();
      return;
    }

    /* group by date */
    const groups = new Map();
    runs.forEach(r => {
      const key = r.date.toDateString();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    });

    let html = "";
    for (const [, dayRuns] of groups) {
      const d = dayRuns[0].date;
      const stats = dayRuns.map(runStats);
      const dayOkValue = stats.reduce((s, x) => s + x.okValue, 0);
      const dayCount   = stats.reduce((s, x) => s + x.count, 0);
      const dayBad     = stats.reduce((s, x) => s + x.badCount, 0);
      const dayProc    = stats.reduce((s, x) => s + x.procCount, 0);
      const dayPend    = stats.reduce((s, x) => s + x.pendCount, 0);
      html += `<div class="date-group">
        <div class="date-group-sticky">
        <div class="date-group-hd">
          <h3>${fmtDateLong(d)}</h3>
          <span class="date-group-meta">${dayRuns.length} run${dayRuns.length > 1 ? "s" : ""} · <strong>${fmtNum(dayCount)}</strong> payments · <strong>${fmtMoney(dayOkValue)}</strong> collected${dayPend ? ` · <span style="color:#5c6a79">${fmtNum(dayPend)} pending</span>` : ""}${dayProc ? ` · <span style="color:var(--uih-hub-blue)">${fmtNum(dayProc)} processing</span>` : ""}${dayBad ? ` · <span style="color:var(--danger)">${fmtNum(dayBad)} declined</span>` : ""}</span>
        </div>
        <div class="run-cols-hd">
          <div>Payment run</div>
          <div>Status</div>
          <div>Total amount</div>
          <div>Payments</div>
          <div>Pending</div>
          <div>Processing</div>
          <div>Declined</div>
          <div>Unprocessed</div>
          <div></div>
        </div>
        </div>`;
      for (const run of dayRuns) {
        const s = runStats(run);
        html += `
        <div class="run-card-5c" data-run="${esc(run.id)}" role="button" tabindex="0" title="Open batch ${esc(run.id)} — view payments in this run">
          <div class="run-id-line">
            <div style="min-width:0;">
              <div class="run-name">${esc(run.name)}</div>
              <div class="run-sub">Batch ${esc(run.id)}${run.typeLabel ? " · " + esc(run.typeLabel) : ""}${run.desc ? " · " + esc(run.desc) : ""}</div>
            </div>
          </div>
          <div>${runStatePill(run)}</div>
          <div class="run-col-value amount">${fmtMoney(s.totalValue)}</div>
          <div class="run-col-value">${fmtNum(s.count)}</div>
          <div class="run-col-value" style="color:${s.pendCount ? "#5c6a79" : "var(--text-muted)"}">${s.pendCount ? fmtNum(s.pendCount) : "—"}</div>
          <div class="run-col-value" style="color:${s.procCount ? "var(--uih-hub-blue)" : "var(--text-muted)"}">${s.procCount ? fmtNum(s.procCount) : "—"}</div>
          <div class="run-col-value" style="color:${s.badCount ? "var(--danger)" : "var(--text-muted)"}">${s.badCount ? fmtNum(s.badCount) : "—"}</div>
          <div>${s.badUnprocessed
              ? `<button type="button" class="retry-btn" batch created for ${s.badUnprocessed} payment${s.badUnprocessed > 1 ? "s" : ""} (mock)','success')" title="Retry ${s.badUnprocessed} unprocessed payment${s.badUnprocessed > 1 ? "s" : ""} in this run">Retry · ${fmtNum(s.badUnprocessed)}</button>`
              : `<button type="button" class="retry-btn" disabled>—</button>`}
          </div>
          <div class="run-chevron"><em class="fa-solid fa-chevron-right"></em></div>
        </div>`;
      }
      html += `</div>`;
    }
    $("runs-list").innerHTML = notice + html;
    if (state.animateRuns) staggerRuns();
    Core.watchStickyHeaders();
  }
  FD.renderRuns = renderRuns;

  /* The declines / arrears area used to live here as VIEW 3. It moved to its
     own surface on 3 Sep 2026 — arrears.html + fd-arrears.js — so this v1
     bundle no longer carries it. See README "Scope".                        */

  /* Exposed for inline handlers in the generated markup. */
  FD.toast = toast;
  FD.txnBadge = txnBadge;
})();


/* ══ fd-boot.js ══ */
/**
 * fd-boot.js — Finance Dashboard bootstrap (loaded LAST)
 * © Union Innovation Hub.
 *
 * Licence gate, host-page defences, then boot whichever surface this document
 * is (window.FD_SURFACE, set by the shell).
 */
(function () {
  "use strict";

  const C    = window.FDConfig;
  const Core = window.FDCore;
  const Data = window.FDData;
  const FD   = window.FD = window.FD || {};

  const root = document.getElementById("fd-root");

  /* There is no host allow-list (removed 4 Sep 2026): the app runs on any iMIS
     instance with CloudToolz access. Who may SEE it is controlled by the RiSE
     page's role gating — these surfaces expose every member's payment detail,
     so that gating is not optional. See docs/DATA-REQUIREMENTS.md §9. */

  /* ── Host-page defences (only matter inside iMIS) ─────────────────────────
     1. The app is inlined into iMIS's single ASP.NET <form>, so Enter in ANY
        input triggers a full-page postback and the user loses their place. A
        delegated keydown swallows it. This will NOT reproduce on a dev server —
        do not remove it because "it does nothing".
     2. 100vh is wrong once embedded: the app is only part of the RiSE page, so
        it gets an explicit pane height instead. */
  function harden() {
    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "SELECT")) {
        e.preventDefault();
        e.stopPropagation();
      }
    });

    if (Core.isInIMIS()) {
      root.style.setProperty("--fd-height", C.embedHeight || "780px");
    } else {
      /* Standalone / dev only. Set here rather than in fd-styles.css because a
         `body { margin: 0 }` rule in the stylesheet would restyle the iMIS page. */
      document.body.style.margin = "0";
      document.body.style.background = "#f4f6fa";
    }

    /* Keyboard parity for the run rows, which are clickable grid containers
       rather than links (they contain their own Retry button, so a real <a>
       would be invalid markup). */
    root.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      const card = e.target.closest && e.target.closest(".run-card-5c");
      if (!card || !card.dataset.run) return;
      e.preventDefault();
      FD.openRun(card.dataset.run);
    });
  }

  /* Anything that MEASURES laid-out elements has to wait for the stylesheet the
     shell injected at runtime — it doesn't block these scripts, so without this
     the first render can measure unstyled boxes. `__fdCssReady` resolves on the
     link's load/error and is timeout-capped, so a blocked CDN degrades to an
     unstyled render rather than a blank page. Falls back to resolved if the
     scripts were loaded some other way (static tags, a test harness). */
  async function stylesReady() {
    if (window.__fdCssReady) await window.__fdCssReady;
  }

  /* A webfont landing after first paint changes row heights too, so re-run the
     one measurement-dependent render. Cheap: it re-ranks six existing rows. */
  function relayoutWhenFontsSettle() {
    if (!document.fonts || !document.fonts.ready) return;
    document.fonts.ready.then(function () {
      if (FD.renderTypeBars) FD.renderTypeBars();
      Core.syncStuckTables();
    });
  }

  async function boot() {
    harden();
    Core.bindScrollSync();
    await stylesReady();

    const SURFACES = ["run", "arrears", "dashboard"];
    const surface = SURFACES.includes(window.FD_SURFACE) ? window.FD_SURFACE : "dashboard";
    Core.Nav.surface = surface;

    try {
      if (surface === "run") {
        await window.FDRun.boot();
        relayoutWhenFontsSettle();
        return;
      }

      if (surface === "arrears") {
        await window.FDArrears.boot();
        relayoutWhenFontsSettle();
        return;
      }

      await Data.load();
      FD.renderDashboard();

      /* A ?BatchID= on the LIST page means either the in-page fallback is in play
         or someone bookmarked a deep link against this surface. Either way,
         honour it rather than showing the list they didn't ask for. */
      const deepRun = Core.Nav.runIdFromUrl();
      if (deepRun && window.FDRun) await window.FDRun.showInline(deepRun);

      relayoutWhenFontsSettle();

    } catch (err) {
      console.error("Finance Dashboard: boot failed", err);
      const slot = document.getElementById("detail-content")
                || document.getElementById("arrears-content")
                || document.getElementById("runs-list");
      if (slot) {
        Core.notice(slot, "Could not load payment runs",
          err && err.message ? err.message : "An unexpected error occurred.");
      }
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
