  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

,255,255,.75); white-space: nowrap; }\n.header-spacer { flex: 1; }\n.header-btn {\n  background: rgba(255,255,255,.12);\n  border: 1px solid rgba(255,255,255,.2);\n  color: #fff;\n  border-radius: var(--radius);\n  padding: 5px 12px;\n  font-size: 12px;\n  font-weight: 600;\n  cursor: pointer;\n  white-space: nowrap;\n  display: flex;\n  align-items: center;\n  gap: 5px;\n}\n.header-btn:hover { background: rgba(255,255,255,.22); }\n.header-select {\n  background: rgba(255,255,255,.12);\n  border: 1px solid rgba(255,255,255,.2);\n  color: #fff;\n  border-radius: var(--radius);\n  padding: 5px 8px;\n  font-size: 12px;\n  font-weight: 600;\n  cursor: pointer;\n}\n.header-select option { color: var(--text); }\n\n/* ── Main scroll area ────────────────────────────────────── */\n.main-scroll {\n  flex: 1;\n  overflow-y: auto;\n  overflow-x: hidden;\n}\n.page {\n  max-width: 1240px;\n  margin: 0 auto;\n  padding: 20px 24px 48px;\n}\n\n/* ── Section headings ────────────────────────────────────── */\n.section-title {\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: .6px;\n  color: var(--text-muted);\n  margin: 22px 0 10px;\n  display: flex;\n  align-items: center;\n  gap: 8px;\n}\n.section-title:first-child { margin-top: 0; }\n.section-title .count-badge { text-transform: none; letter-spacing: 0; }\n\n/* ── KPI cards ───────────────────────────────────────────── */\n.kpi-grid {\n  display: grid;\n  grid-template-columns: repeat(auto-fit, minmax(172px, 1fr));\n  gap: 12px;\n}\n.kpi-card {\n  background: var(--surface);\n  border: 1px solid var(--uih-hub-border-soft);\n  border-radius: var(--uih-radius-lg);\n  box-shadow: var(--uih-shadow-card);\n  padding: 14px 18px;\n  min-width: 0;\n  font-family: var(--uih-font-display);\n}\n.kpi-label {\n  font-size: 11.5px;\n  font-weight: 600;\n  text-transform: uppercase;\n  letter-spacing: .4px;\n  color: var(--uih-hub-label);\n  white-space: nowrap;\n  display: flex;\n  align-items: center;\n  gap: 5px;\n}\n.kpi-value { font-size: 22px; font-weight: 700; margin-top: 4px; line-height: 1.2; letter-spacing: -.4px; color: var(--uih-hub-ink); white-space: nowrap; }\n.kpi-card.clickable { cursor: pointer; transition: box-shadow .12s, border-color .12s, transform .12s; }\n.kpi-card.clickable:hover { border-color: var(--danger); box-shadow: var(--shadow-lg); transform: translateY(-1px); }\n.kpi-card.clickable:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }\n.kpi-hint { margin-left: auto; font-size: 10px; font-weight: 700; color: var(--danger); text-transform: none; letter-spacing: 0; }\n.kpi-value.pos    { color: var(--success); }\n.kpi-value.neg    { color: var(--danger); }\n.kpi-value.brand  { color: var(--brand-light); }\n.kpi-sub { font-size: 12px; font-weight: 600; color: var(--uih-hub-sub); margin-top: 1px; white-space: normal; overflow-wrap: anywhere; }\n.kpi-sub .up   { color: var(--success); font-weight: 700; }\n.kpi-sub .down { color: var(--danger);  font-weight: 700; }\n\n/* ── Panels / cards ──────────────────────────────────────── */\n.panel {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  padding: 14px 16px;\n  min-width: 0;\n}\n.panel-title {\n  font-size: 12px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: .5px;\n  color: var(--text);\n  margin-bottom: 10px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 8px;\n}\n.panel-title .hint { font-size: 11px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text-muted); }\n.metric-toggle { display: inline-flex; margin-left: auto; flex-shrink: 0; background: var(--bg); border: 1px solid var(--border); border-radius: 99px; padding: 2px; gap: 2px; }\n.metric-toggle button {\n  font-family: var(--uih-font-sans);\n  font-size: 10.5px; font-weight: 700; letter-spacing: .02em;\n  padding: 3px 11px; border: none; background: none; color: var(--text-muted);\n  border-radius: 99px; cursor: pointer; transition: background .12s, color .12s;\n}\n.metric-toggle button:hover:not(.active) { color: var(--text); }\n.metric-toggle button.active { background: var(--surface); color: var(--brand-light); box-shadow: 0 1px 2px rgba(0,0,0,.10); }\n.metric-toggle button:focus-visible { outline: 2px solid var(--brand-light); outline-offset: 1px; }\n\n.charts-row {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 12px;\n  margin-top: 12px;\n}\n@media (max-width: 980px) { .charts-row { grid-template-columns: 1fr; } }\n\n/* Sparkline / trend chart */\n.trend-chart { display: flex; align-items: stretch; gap: 7px; }\n.trend-yaxis { display: flex; flex-direction: column; justify-content: space-between; height: 130px; padding: 12px 0 1px; font-size: 9.5px; font-weight: 600; color: var(--text-muted); text-align: right; white-space: nowrap; flex-shrink: 0; }\n.trend-svg { flex: 1; width: 100%; height: 130px; display: block; }\n.trend-xaxis { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--text-muted); margin-top: 5px; }\n.trend-xaxis span:first-child { text-align: left; }\n.trend-xaxis span:last-child { text-align: right; }\n.trend-legend { display: flex; gap: 14px; font-size: 11px; color: var(--text-muted); margin-top: 6px; flex-wrap: wrap; }\n.trend-legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }\n\n/* Horizontal breakdown bars */\n.hbar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }\n.hbar-row:last-child { margin-bottom: 0; }\n.hbar-label { width: 108px; flex-shrink: 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.hbar-track { flex: 1; height: 16px; background: var(--bg); border-radius: 99px; overflow: hidden; }\n.hbar-fill  { height: 100%; border-radius: 99px; min-width: 3px; transition: width .38s cubic-bezier(.4,0,.2,1), background .2s; }\n#type-bars { display: flex; flex-direction: column; gap: 8px; }\n#type-bars .hbar-row { margin-bottom: 0; transition: transform .38s cubic-bezier(.4,0,.2,1); }\n.hbar-val.swap { animation: metric-fade .34s ease; }\n.trend-svg rect { transition: y .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1), opacity .2s; }\n.trend-yaxis.swap span, .trend-legend.swap span { animation: metric-fade .34s ease; }\n@keyframes metric-fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }\n@media (prefers-reduced-motion: reduce) {\n  .hbar-fill, #type-bars .hbar-row, .trend-svg rect { transition: none; }\n  .hbar-val.swap, .trend-yaxis.swap span, .trend-legend.swap span { animation: none; }\n}\n.hbar-val   { width: 118px; flex-shrink: 0; font-size: 11px; color: var(--text-muted); text-align: right; white-space: nowrap; }\n.hbar-val .m { transition: color .2s, font-weight .2s; }\n.hbar-val .m.on { color: var(--uih-hub-ink); font-weight: 700; }\n\n/* Donut */\n.donut-wrap { display: flex; align-items: center; gap: 16px; }\n.donut-svg  { width: 118px; height: 118px; flex-shrink: 0; }\n.donut-center-txt  { font-size: 20px; font-weight: 700; fill: var(--text); }\n.donut-center-sub  { font-size: 8.5px; fill: var(--text-muted); }\n.donut-legend { display: flex; flex-direction: column; gap: 7px; font-size: 12px; min-width: 0; }\n.donut-legend .row { display: flex; align-items: center; gap: 7px; white-space: nowrap; }\n.donut-legend .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }\n.donut-legend .lbl { font-weight: 600; }\n.donut-legend .amt { color: var(--text-muted); font-size: 11px; }\n\n/* ── Status + type badges ────────────────────────────────── */\n.badge {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  border-radius: 99px;\n  font-size: 11px;\n  font-weight: 600;\n  padding: 2px 9px;\n  white-space: nowrap;\n  border: 1px solid transparent;\n}\n.badge.success   { background: var(--uih-success-bg); color: var(--success); border-color: var(--uih-success-border); }\n.badge.declined  { background: var(--danger-pale);  color: var(--danger);  border-color: #fecaca; }\n.badge.pending    { background: #eef1f5; color: #5c6a79; border-color: #dfe5ec; }\n.badge.processing { background: #e7effb; color: var(--uih-hub-blue); border-color: #c7dbf5; }\n.badge.awaiting   { background: #fdf3e0; color: #9a6510; border-color: #f3e0b8; }\n.badge.reconciled { background: #f1eafd; color: #7c3aed; border-color: #ddccf8; }\n\n/* Stacked settlement bar */\n.stack-bar { display: flex; width: 110px; height: 8px; border-radius: 99px; overflow: hidden; background: var(--uih-hub-border-soft); }\n.stack-bar span { height: 100%; }\n\n/* Status pill (HUB record-page treatment): leading dot, display font */\n.status-pill {\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  border-radius: 99px;\n  font-family: var(--uih-font-display);\n  font-size: 11.5px;\n  font-weight: 700;\n  letter-spacing: .02em;\n  padding: 3px 10px;\n  white-space: nowrap;\n  border: 1px solid transparent;\n}\n.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }\n.status-pill.completed  { background: var(--uih-hub-green-bg); color: var(--uih-hub-green); border-color: var(--uih-success-border); }\n.status-pill.generated  { background: #eef1f5;                 color: #5c6a79; border-color: #dfe5ec; }\n.retry-btn {\n  font-family: var(--uih-font-display);\n  font-size: 11.5px;\n  font-weight: 700;\n  letter-spacing: .02em;\n  display: inline-flex; align-items: center; gap: 5px;\n  padding: 3px 10px;\n  border: 1px solid #fecaca;\n  background: var(--danger-pale);\n  color: var(--danger);\n  border-radius: 99px;\n  cursor: pointer;\n  white-space: nowrap;\n  transition: background .12s, border-color .12s;\n}\n.retry-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }\n.retry-btn:hover:not(:disabled) { background: var(--uih-danger-bg); border-color: var(--danger); }\n.retry-btn:disabled { color: var(--text-muted); background: var(--bg); border-color: var(--border); cursor: default; opacity: .7; }\n.filter-notice { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--uih-hub-amber); background: var(--uih-hub-amber-bg); border: 1px solid #f3e0b8; border-radius: var(--radius); padding: 8px 12px; margin-bottom: 10px; }\n.filter-notice strong { font-weight: 700; }\n.filter-notice button { margin-left: auto; border: 1px solid #f3e0b8; background: #fff; color: var(--uih-hub-amber); border-radius: 99px; padding: 3px 11px; font-size: 11px; font-weight: 600; cursor: pointer; }\n.filter-notice button:hover { background: var(--uih-hub-amber-bg); }\n.status-pill.errors     { background: var(--danger-pale);      color: var(--danger); border-color: #fecaca; }\n.status-pill.processing { background: #e7effb;                 color: var(--uih-hub-blue); border-color: #c7dbf5; }\n.status-pill.awaiting   { background: #fdf3e0;                 color: #9a6510; border-color: #f3e0b8; }\n.status-pill.reconciled { background: #f1eafd;                 color: #7c3aed; border-color: #ddccf8; }\n\n.type-chip {\n  display: inline-flex;\n  align-items: center;\n  gap: 4px;\n  font-size: 11px;\n  font-weight: 600;\n  padding: 1px 8px;\n  border-radius: 99px;\n  white-space: nowrap;\n}\n\n.count-badge {\n  display: inline-flex;\n  align-items: center;\n  background: var(--brand-pale);\n  color: var(--brand-light);\n  border: 1px solid var(--brand-light);\n  border-radius: 99px;\n  font-size: 10px;\n  font-weight: 700;\n  padding: 1px 7px;\n  white-space: nowrap;\n}\n\n/* ── Attention strip ─────────────────────────────────────── */\n.attention-strip {\n  background: var(--warn-pale);\n  border: 1px solid #fde68a;\n  border-radius: var(--radius);\n  padding: 10px 14px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  font-size: 13px;\n  color: var(--warn);\n  margin-top: 14px;\n}\n.attention-strip strong { font-weight: 700; }\n.attention-strip .spacer { flex: 1; }\n.attention-strip button {\n  border: 1px solid #fde68a;\n  background: #fff;\n  color: var(--warn);\n  border-radius: var(--radius);\n  padding: 3px 10px;\n  font-size: 12px;\n  font-weight: 600;\n  cursor: pointer;\n}\n.attention-strip button:hover { background: var(--warn-pale); }\n\n/* ── Run list (grouped by date) ──────────────────────────── */\n.runs-toolbar {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  flex-wrap: wrap;\n  margin-bottom: 12px;\n}\n.runs-search {\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 6px 10px;\n  font-size: 12px;\n  background: var(--surface);\n  width: 230px;\n}\n.runs-search:focus { outline: none; border-color: var(--brand-light); }\n@keyframes run-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n@keyframes runs-fade-in { from { opacity: 0; } to { opacity: 1; } }\n.runs-anim .run-card-5c, .runs-anim .runs-empty { animation: run-enter .3s cubic-bezier(.4,0,.2,1) both; }\n#runs-list.runs-anim { animation: runs-fade-in .18s ease both; }\n@media (prefers-reduced-motion: reduce) {\n  .runs-anim .run-card-5c, .runs-anim .runs-empty, #runs-list.runs-anim { animation: none; }\n}\n.filter-chip.review { color: var(--danger); border-color: #fecaca; }\n.filter-chip.review:hover:not(.active) { background: var(--danger-pale); }\n.filter-chip.review.active { background: var(--danger); border-color: var(--danger); color: #fff; }\n.filter-chip .chip-count { font-weight: 700; margin-left: 3px; opacity: .8; }\n.filter-chip {\n  font-size: 11px;\n  padding: 3px 11px;\n  border: 1px solid var(--border);\n  border-radius: 99px;\n  background: var(--surface);\n  cursor: pointer;\n  color: var(--text-muted);\n  font-weight: 600;\n  transition: all .12s;\n  white-space: nowrap;\n}\n.filter-chip:hover  { background: var(--brand-pale); border-color: var(--brand-light); color: var(--brand-light); }\n.filter-chip.active { background: var(--brand-light); border-color: var(--brand-light); color: #fff; }\n\n.date-group { padding-bottom: 18px; }\n.date-group-hd {\n  display: flex;\n  align-items: baseline;\n  gap: 10px;\n  padding: 4px 2px 7px;\n  border-bottom: 2px solid var(--brand);\n  margin-bottom: 8px;\n  flex-wrap: wrap;\n}\n.date-group-hd h3 { font-size: 14px; font-weight: 700; color: var(--brand); font-family: var(--uih-font-display); letter-spacing: -.2px; }\n.date-group-meta { font-size: 11px; color: var(--text-muted); }\n.date-group-meta strong { color: var(--text); }\n\n.run-card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  padding: 11px 14px;\n  margin-bottom: 7px;\n  display: grid;\n  grid-template-columns: minmax(210px, 1.4fr) minmax(110px, .8fr) minmax(190px, 1fr) minmax(110px, .7fr) 120px 22px;\n  gap: 8px 14px;\n  align-items: center;\n  cursor: pointer;\n  border-left: 4px solid var(--brand-light);\n  transition: border-color .12s, background .12s, box-shadow .12s;\n}\n.run-card:hover { background: var(--brand-pale); border-color: var(--brand-light); box-shadow: var(--shadow-lg); }\n.run-card.status-errors     { border-left-color: var(--accent); }\n.run-card.status-processing { border-left-color: #94a3b8; }\n\n.run-card-5c {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  padding: 11px 14px;\n  margin-bottom: 7px;\n  display: grid;\n  grid-template-columns: minmax(200px, 1.5fr) 130px 110px 90px 90px 100px 90px 150px 18px;\n  gap: 8px 14px;\n  align-items: center;\n  cursor: pointer;\n  border-left: 4px solid var(--brand-light);\n  transition: border-color .12s, background .12s, box-shadow .12s;\n}\n.run-card-5c:hover { background: var(--brand-pale); border-color: var(--brand-light); box-shadow: var(--shadow-lg); }\n@media (max-width: 1080px) {\n  .run-card-5c { grid-template-columns: 1fr 1fr 1fr; }\n  .run-card-5c .run-chevron { display: none; }\n}\n.run-cols-hd {\n  display: grid;\n  grid-template-columns: minmax(200px, 1.5fr) 130px 110px 90px 90px 100px 90px 150px 18px;\n  gap: 8px 14px;\n  padding: 6px 14px;\n  font-size: 10px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: .5px;\n  color: var(--text-muted);\n  border-left: 4px solid transparent;\n  box-sizing: border-box;\n}\n@media (max-width: 1080px) { .run-cols-hd { display: none; } }\n.date-group-sticky {\n  position: sticky;\n  top: -1px; /* 1px above the scroll edge so the .stuck observer can detect pinning */\n  z-index: 20;\n  background: var(--bg);\n  margin: 0 -24px;          /* bleed across the page gutters so nothing peeks at the edges */\n  padding: 11px 24px 0;\n  transition: box-shadow .12s;\n}\n.date-group-sticky.stuck {\n  box-shadow: 0 1px 0 var(--border), 0 8px 14px -8px rgba(19, 40, 63, .28);\n}\n\n.run-id-line { display: flex; align-items: center; gap: 8px; min-width: 0; }\n.run-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.run-sub  { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n\n.run-col-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); }\n.run-col-value { font-size: 13px; font-weight: 600; white-space: nowrap; }\n.run-col-value.amount { font-size: 14px; font-weight: 700; color: var(--brand-light); }\n\n.run-outcome { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }\n.mini-meter {\n  width: 100%; max-width: 130px;\n  height: 5px;\n  background: var(--danger-pale);\n  border-radius: 99px;\n  overflow: hidden;\n  margin-top: 4px;\n}\n.mini-meter .ok { height: 100%; background: var(--success); border-radius: 99px; }\n\n.run-chevron { color: var(--text-muted); font-size: 14px; text-align: right; }\n\n.runs-empty {\n  color: var(--text-muted);\n  font-style: italic;\n  font-size: 13px;\n  padding: 18px 4px;\n  text-align: center;\n}\n\n@media (max-width: 860px) {\n  .run-card { grid-template-columns: 1fr 1fr; }\n  .run-chevron { display: none; }\n}\n\n/* ── Drill-down view ─────────────────────────────────────── */\n.back-btn {\n  background: none;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  padding: 5px 12px;\n  font-size: 12px;\n  cursor: pointer;\n  color: var(--text-muted);\n  font-weight: 600;\n  display: inline-flex;\n  align-items: center;\n  gap: 5px;\n  margin-bottom: 14px;\n  background: var(--surface);\n}\n.back-btn:hover { background: var(--bg); color: var(--text); }\n\n.detail-hd {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-left: 4px solid var(--brand-light);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow);\n  padding: 15px 18px;\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  flex-wrap: wrap;\n}\n.detail-hd h2 { font-size: 17px; font-weight: 700; font-family: var(--uih-font-display); letter-spacing: -.3px; color: var(--uih-hub-ink); }\n.detail-hd-meta { font-size: 12px; color: var(--text-muted); }\n.detail-hd .spacer { flex: 1; }\n.detail-action {\n  display: flex;\n  align-items: center;\n  gap: 4px;\n  padding: 5px 11px;\n  font-size: 12px;\n  font-weight: 600;\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  background: var(--surface);\n  color: var(--text-muted);\n  cursor: pointer;\n  white-space: nowrap;\n}\n.detail-action:hover { background: var(--bg); color: var(--text); border-color: var(--text-muted); }\n.detail-action.primary { background: var(--brand-light); color: #fff; border-color: var(--brand-light); font-weight: 700; }\n.detail-action.primary:hover { background: var(--brand); border-color: var(--brand); color: #fff; }\n\n.detail-panels {\n  display: grid;\n  grid-template-columns: 1fr 1fr 1fr;\n  gap: 12px;\n  margin-top: 14px;\n}\n@media (max-width: 980px) { .detail-panels { grid-template-columns: 1fr; } }\n\n/* ── Tables ──────────────────────────────────────────────── */\n.table-wrap { overflow-x: auto; }\ntable.report-table {\n  width: 100%;\n  border-collapse: collapse;\n  font-size: 13px;\n  background: var(--surface);\n  border-radius: var(--radius);\n  overflow: hidden;\n  box-shadow: var(--shadow);\n}\ntable.report-table th {\n  background: var(--brand);\n  color: #fff;\n  padding: 9px 12px;\n  text-align: left;\n  font-weight: 600;\n  font-size: 12px;\n  letter-spacing: .3px;\n  white-space: nowrap;\n  position: sticky;\n  top: 0;\n}\ntable.report-table th.num, table.report-table td.num { text-align: right; }\ntable.report-table td {\n  padding: 8px 12px;\n  border-bottom: 1px solid var(--border);\n  vertical-align: middle;\n  white-space: nowrap;\n}\ntable.report-table tr:last-child td { border-bottom: none; }\ntable.report-table tbody tr:nth-child(even) td { background: var(--bg); }\ntable.report-table tbody tr:hover td { background: var(--brand-pale); }\ntable.report-table tfoot td {\n  background: var(--brand-pale);\n  font-weight: 700;\n  border-top: 2px solid var(--brand-light);\n}\n.cell-muted { color: var(--text-muted); }\n.cell-strong { font-weight: 700; }\n.cell-amount { font-weight: 600; }\n.cell-amount.neg { color: var(--danger); }\n\n/* Compact summary tables inside panels */\ntable.mini-table { width: 100%; border-collapse: collapse; font-size: 12px; }\ntable.mini-table th {\n  text-align: left;\n  font-size: 10px;\n  font-weight: 700;\n  text-transform: uppercase;\n  letter-spacing: .5px;\n  color: var(--text-muted);\n  padding: 4px 6px;\n  border-bottom: 1px solid var(--border);\n  white-space: nowrap;\n}\ntable.mini-table th.num, table.mini-table td.num { text-align: right; }\ntable.mini-table td { padding: 6px; border-bottom: 1px solid var(--bg); white-space: nowrap; }\ntable.mini-table tr:last-child td { border-bottom: none; }\ntable.mini-table tfoot td { border-top: 1px solid var(--border); font-weight: 700; }\n\n.more-note {\n  font-size: 12px;\n  color: var(--text-muted);\n  font-style: italic;\n  margin-top: 10px;\n  padding-top: 10px;\n  border-top: 1px dashed var(--border);\n}\n\n/* Toast */\n.toast-container {\n  position: fixed; bottom: 20px; right: 20px;\n  display: flex; flex-direction: column; gap: 7px; z-index: 999;\n}\n.toast {\n  padding: 9px 15px;\n  border-radius: var(--radius);\n  background: var(--text); color: #fff;\n  font-size: 13px;\n  box-shadow: var(--shadow-lg);\n  animation: slideIn .2s ease;\n}\n.toast.success { background: var(--success); }\n@keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }\n\n.mock-note {\n  text-align: center;\n  font-size: 11px;\n  color: var(--text-muted);\n  font-style: italic;\n  margin-top: 26px;\n}\n\n/* ── Dense runs table ────────────────────────────────────── */\n.runs-table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }\ntable.runs-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }\ntable.runs-table th { background: var(--brand); color: #fff; padding: 8px 12px; text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .3px; white-space: nowrap; position: sticky; top: 0; z-index: 4; }\ntable.runs-table th.num, table.runs-table td.num { text-align: right; }\ntable.runs-table td { padding: 7px 12px; border-bottom: 1px solid var(--uih-hub-border-soft); white-space: nowrap; vertical-align: middle; }\ntr.group-row td { position: sticky; top: 33px; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); padding: 6px 12px; }\ntr.group-row .g-date { font-family: var(--uih-font-display); font-weight: 700; font-size: 12.5px; color: var(--brand); margin-right: 10px; }\ntr.group-row .g-meta { font-size: 11px; color: var(--text-muted); }\ntr.run-row { cursor: pointer; }\ntr.run-row:hover td { background: var(--brand-pale); }\n\ntr.run-row td .run-name { font-size: 12.5px; }\n.pct-cell { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text-muted); }\n.pct-cell .mini-meter { width: 64px; margin-top: 0; }\n\n/* ── Print ───────────────────────────────────────────────── */\n@media print {\n  header, .runs-toolbar, .back-btn, .detail-action, .toast-container, .attention-strip button { display: none !important; }\n  body, .main-scroll { display: block !important; overflow: visible !important; height: auto !important; }\n  .panel, .kpi-card, .run-card, table.report-table { box-shadow: none !important; }\n  table.report-table th { background: #1a4b8c !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n\n\n<header>\n  <span class=\"header-logo\">Finance Dashboard<\u002Fspan>\n  <div class=\"header-sep\"><\u002Fdiv>\n  <span class=\"header-sub\" id=\"header-context\">Payment runs &amp; settlement tracking<\u002Fspan>\n  <div class=\"header-spacer\"><\u002Fdiv>\n  <select class=\"header-select\" id=\"range-select\" onchange=\"setRange(this.value)\">\n    <option value=\"30\" selected=\"\">Last 30 days<\u002Foption>\n    <option value=\"7\">Last 7 days<\u002Foption>\n    <option value=\"90\">Last 90 days<\u002Foption>\n  <\u002Fselect>\n<\u002Fheader>\n\n<div class=\"main-scroll\" id=\"main-scroll\">\n\n  <!-- ══ VIEW 1 : Dashboard ══════════════════════════════════ -->\n  <div class=\"page\" id=\"view-dashboard\">\n\n    <div class=\"section-title\">Last <span id=\"kpi-range-days\">30<\u002Fspan> days at a glance<\u002Fdiv>\n    <div class=\"kpi-grid\" id=\"kpi-grid\"><\u002Fdiv>\n\n    <div class=\"charts-row\">\n      <div class=\"panel\">\n        <div class=\"panel-title\">Daily payment volume\n          <span class=\"metric-toggle\" role=\"group\" aria-label=\"Daily volume metric\">\n            <button type=\"button\" onclick=\"setTrendMetric('count', this)\">Count<\u002Fbutton>\n            <button type=\"button\" class=\"active\" onclick=\"setTrendMetric('value', this)\">$ value<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"trend-chart\">\n          <div class=\"trend-yaxis\" id=\"trend-yaxis\"><\u002Fdiv>\n          <svg class=\"trend-svg\" id=\"trend-svg\" viewBox=\"0 0 560 130\" preserveAspectRatio=\"none\"><\u002Fsvg>\n        <\u002Fdiv>\n        <div class=\"trend-xaxis\" id=\"trend-xaxis\"><\u002Fdiv>\n        <div class=\"trend-legend\">\n          <span><span class=\"dot\" style=\"background:var(--brand-light)\"><\u002Fspan><span id=\"trend-lg-ok\">Collected value<\u002Fspan><\u002Fspan>\n          <span><span class=\"dot\" style=\"background:var(--danger)\"><\u002Fspan><span id=\"trend-lg-bad\">Declined value<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\">\n        <div class=\"panel-title\">Payments by type\n          <span class=\"metric-toggle\" role=\"group\" aria-label=\"Payments by type metric\">\n            <button type=\"button\" class=\"active\" onclick=\"setTypeMetric('count', this)\">Count<\u002Fbutton>\n            <button type=\"button\" onclick=\"setTypeMetric('value', this)\">$ value<\u002Fbutton>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div id=\"type-bars\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"section-title\" style=\"margin-top:26px;\">Payment runs <span class=\"count-badge\" id=\"runs-count-badge\">0<\u002Fspan><\u002Fdiv>\n    <div class=\"runs-toolbar\">\n      <input type=\"text\" class=\"runs-search\" id=\"runs-search\" placeholder=\"Search by run title or date…\" oninput=\"renderRuns()\">\n      <span style=\"flex:1\"><\u002Fspan>\n      <button type=\"button\" class=\"filter-chip active\" data-f=\"all\" onclick=\"setRunFilter('all', this)\">All<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" data-f=\"generated\" onclick=\"setRunFilter('generated', this)\">Generated<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" data-f=\"processing\" onclick=\"setRunFilter('processing', this)\">Processing<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" data-f=\"finalised\" onclick=\"setRunFilter('finalised', this)\">Finalised<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip review\" data-f=\"review\" id=\"chip-review\" onclick=\"setReviewFilter(this)\" title=\"Runs with payments processing longer than 5 days\">To review <span class=\"chip-count\" id=\"chip-review-count\">0<\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"runs-list\"><\u002Fdiv>\n\n    <p class=\"mock-note\">Prototype mock-up — all figures are randomly generated sample data.<\u002Fp>\n  <\u002Fdiv>\n\n  <!-- ══ VIEW 2 : Run drill-down ═════════════════════════════ -->\n  <div class=\"page\" id=\"view-detail\" style=\"display:none;\">\n    <button type=\"button\" class=\"back-btn\" onclick=\"showDashboard()\">← Back to all payment runs<\u002Fbutton>\n    <div id=\"detail-content\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"page\" id=\"view-declines\" style=\"display:none;\">\n    <button type=\"button\" class=\"back-btn\" onclick=\"showDashboard()\">← Back to dashboard<\u002Fbutton>\n    <div id=\"declines-content\"><\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<div class=\"toast-container\" id=\"toast-container\"><\u002Fdiv>\n\n<script>\n/* ═══════════════════════════════════════════════════════════\n   MOCK DATA — deterministic pseudo-random so the prototype\n   looks the same on every load. \"Today\" is pinned.\n   ═══════════════════════════════════════════════════════════ */\nconst TODAY = new Date(2026, 6, 6); // 6 Jul 2026\n\nfunction mulberry32(a) {\n  return function() {\n    a |= 0; a = a + 0x6D2B79F5 | 0;\n    let t = Math.imul(a ^ a >>> 15, 1 | a);\n    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;\n    return ((t ^ t >>> 14) >>> 0) / 4294967296;\n  };\n}\nconst rnd = mulberry32(20260706);\nconst pick = arr => arr[Math.floor(rnd() * arr.length)];\nconst between = (min, max) => min + rnd() * (max - min);\nconst intBetween = (min, max) => Math.floor(between(min, max + 1));\n\nconst PAY_TYPES = [\n  { id: \"dd\",   label: \"Direct Debit\", color: \"#2563c4\", pale: \"#e8f0fb\" },\n  { id: \"cc\",   label: \"Credit Card\",  color: \"#e8720c\", pale: \"#fdf0e3\" },\n  { id: \"bpay\", label: \"BPAY\",         color: \"#0d9488\", pale: \"#e6f7f5\" },\n  { id: \"eft\",  label: \"EFT Transfer\", color: \"#64748b\", pale: \"#eef2f7\" },\n  { id: \"inv\",  label: \"Invoice\",      color: \"#9a6510\", pale: \"#fdf3e0\" },\n  { id: \"pd\",   label: \"Payroll\",      color: \"#7c3aed\", pale: \"#f1eafd\" },\n];\nconst typeById = id => PAY_TYPES.find(t => t.id === id);\n\nconst PAY_AREAS = [\n  { id: \"dues\", label: \"Membership Dues\", color: \"#1a4b8c\" },\n  { id: \"ins\",  label: \"Insurance\",       color: \"#0d9488\" },\n  { id: \"event\",label: \"Event income\",     color: \"#7c3aed\" },\n  { id: \"addon\",label: \"Other add ons\",   color: \"#e8720c\" },\n];\n\nconst RUN_TEMPLATES = [\n  { id: \"invoices\", name: \"Membership Dues — Invoices\", typeLabel: \"Invoices\", desc: \"\",              kind: \"invoices\", mix: { invoice: 1 },              areaMix: { dues: .90, ins: .06, addon: .04 },              size: [400, 900], avg: [60, 220] },\n  { id: \"daily\",    name: \"Membership Dues — Daily Run\", typeLabel: \"CC / DD\", desc: \"iMIS Autopay\",   kind: \"dues\",     mix: { dd: .62, cc: .38 },         areaMix: { dues: .93, ins: .04, addon: .03 },              size: [180, 420], avg: [18, 42]  },\n  { id: \"other\",    name: \"Membership Dues — Other\", typeLabel: \"CC / DD\", desc: \"adhoc payments\",        kind: \"dues\",     mix: { cc: .75, dd: .25 },         areaMix: { dues: .55, ins: .10, addon: .20, event: .15 }, size: [8, 60],    avg: [30, 160] },\n  { id: \"payroll\",  name: \"Payroll Deduction\", typeLabel: \"PRD\", desc: \"reconciliation\",                  kind: \"payroll\",  mix: { pd: 1 },                    areaMix: { dues: .95, ins: .05 },                          size: [60, 200],  avg: [15, 30]  },\n  { id: \"bpay\",     name: \"BPAY\", typeLabel: \"BPAY\", desc: \"reconciliation\",                                kind: \"bpay\",     mix: { bpay: 1 },                  areaMix: { dues: .85, ins: .10, addon: .05 },              size: [40, 140],  avg: [40, 260] },\n];\n\nconst DECLINE_REASONS = [\n  \"Insufficient funds\", \"Expired card\", \"Invalid account number\",\n  \"Payment cancelled by member\", \"Bank rejected transaction\", \"Card reported lost/stolen\",\n];\nconst FIRST = [\"Sarah\",\"Michael\",\"Emma\",\"David\",\"Jessica\",\"Chris\",\"Amanda\",\"Daniel\",\"Rachel\",\"Mark\",\"Lisa\",\"Tom\",\"Nicole\",\"James\",\"Karen\",\"Peter\",\"Megan\",\"Andrew\",\"Fiona\",\"Luke\",\"Hannah\",\"Sean\",\"Priya\",\"Marco\",\"Yuki\",\"Aisha\",\"Liam\",\"Grace\",\"Noah\",\"Chloe\"];\nconst LAST  = [\"Nguyen\",\"Smith\",\"Patel\",\"Williams\",\"Chen\",\"Brown\",\"Kelly\",\"Taylor\",\"Singh\",\"Wilson\",\"Martin\",\"Lee\",\"Anderson\",\"Thompson\",\"White\",\"Walsh\",\"Harris\",\"King\",\"Costa\",\"Ryan\",\"OBrien\",\"Murphy\",\"Zhang\",\"Ali\",\"Rossi\",\"Kaur\",\"Doyle\",\"Webb\",\"Hunt\",\"Bell\"];\n\nfunction weightedType(mix) {\n  const r = rnd();\n  let acc = 0;\n  for (const [id, w] of Object.entries(mix)) { acc += w; if (r <= acc) return id; }\n  return Object.keys(mix)[0];\n}\n\n/* Build ~90 days of runs so range switching works */\nlet runSeq = 2040;\nconst RUNS = [];\nfor (let daysAgo = 90; daysAgo >= 0; daysAgo--) {\n  const d = new Date(TODAY); d.setDate(d.getDate() - daysAgo);\n  const dow = d.getDay();\n  if (dow === 0 || dow === 6) continue;               // no weekend runs\n\n  /* Scheduled runs for the day:\n     - Daily Run fires every weekday, with a big volume spike on Thursdays\n     - Other is a single ad hoc batch on most days (never more than one)\n     - BPAY reconciliation file lands every weekday\n     - Payroll Deduction lands weekly (Friday)\n     - Invoices run lands once, on the first weekday of the month */\n  const isFirstWeekdayOfMonth = (() => {\n    const test = new Date(d.getFullYear(), d.getMonth(), 1);\n    while (test.getDay() === 0 || test.getDay() === 6) test.setDate(test.getDate() + 1);\n    return test.getDate() === d.getDate();\n  })();\n  const todaysTemplates = [{ tpl: RUN_TEMPLATES[1], sizeMult: dow === 4 ? 2.5 : 1 }];\n  if (rnd() < 0.7) todaysTemplates.push({ tpl: RUN_TEMPLATES[2], sizeMult: 1 });\n  todaysTemplates.push({ tpl: RUN_TEMPLATES[4], sizeMult: 1 });\n  if (dow === 5) todaysTemplates.push({ tpl: RUN_TEMPLATES[3], sizeMult: 1 });\n  if (isFirstWeekdayOfMonth) todaysTemplates.push({ tpl: RUN_TEMPLATES[0], sizeMult: 1 });\n\n  for (const { tpl, sizeMult } of todaysTemplates) {\n\n    const size = Math.max(1, Math.round(intBetween(tpl.size[0], tpl.size[1]) * sizeMult));\n    const declineRate = between(0.015, 0.09);\n    const txns = [];\n    for (let t = 0; t < size; t++) {\n      const method = weightedType(tpl.mix);\n      const txn = {\n        ref: \"PMT-\" + String(intBetween(100000, 999999)),\n        member: pick(FIRST) + \" \" + pick(LAST),\n        memberId: String(intBetween(10000, 89999)),\n        type: method === \"invoice\" ? \"inv\" : method,\n        method,\n        area: weightedType(tpl.areaMix),\n        amount: Math.round(between(tpl.avg[0], tpl.avg[1]) * 100) / 100,\n        status: \"Cleared\", reason: \"\", note: \"\", dueDays: 0, processed: false,\n      };\n      if (method === \"cc\") {\n        const declined = rnd() < declineRate;\n        txn.status = declined ? \"Declined\" : \"Cleared\";\n        txn.reason = declined ? pick(DECLINE_REASONS) : \"\";\n        txn.processed = declined ? rnd() < 0.45 : false;\n        txn.note = \"instant result\";\n      } else if (method === \"dd\") {\n        /* most DD clear in 1–3 business days; some take up to a week, and a\n           small share are held far longer (disputes / bank holds) */\n        const roll = rnd();\n        const settleDays = roll < .03 ? intBetween(12, 45) : roll < .15 ? intBetween(4, 7) : intBetween(1, 3);\n        if (daysAgo >= settleDays) {\n          const declined = rnd() < declineRate;\n          txn.status = declined ? \"Declined\" : \"Cleared\";\n          txn.reason = declined ? pick(DECLINE_REASONS) : \"\";\n          txn.processed = declined ? rnd() < 0.45 : false;\n          txn.note = `settled after ${settleDays}d`;\n        } else {\n          txn.status = \"Processing\";\n          txn.dueDays = settleDays - daysAgo;\n          txn.note = `day ${daysAgo + 1} of ~${settleDays}`;\n        }\n      } else if (method === \"invoice\") {\n        /* invoice generated by the run; member pays later via BPAY / EFT / CC */\n        const payAfter = intBetween(1, 45);\n        if (daysAgo >= payAfter) {\n          txn.status = \"Cleared\";\n          txn.type = pick([\"bpay\", \"bpay\", \"eft\", \"cc\"]);\n          txn.note = `invoice paid after ${payAfter}d`;\n        } else {\n          txn.status = \"Awaiting payment\";\n          txn.note = `invoice outstanding ${daysAgo}d`;\n        }\n      } else if (method === \"pd\") {\n        /* payroll reconciliation file: payments, pending or processing — never declined */\n        if (daysAgo <= 2) { txn.status = \"Processing\"; txn.note = `matching, day ${daysAgo + 1}`; }\n        else { txn.status = \"Reconciled\"; txn.note = `received ${intBetween(1, 12)}d after payroll`; }\n      } else if (method === \"bpay\") {\n        /* BPAY reconciliation file: payments, pending or processing — never declined */\n        if (daysAgo <= 2) { txn.status = \"Processing\"; txn.note = `matching, day ${daysAgo + 1}`; }\n        else { txn.status = \"Reconciled\"; txn.note = `matched ${daysAgo}d after receipt`; }\n      }\n      txns.push(txn);\n    }\n\n    /* A run created today has been generated but not yet submitted to the bank —\n       every payment sits Pending until the overnight submission. */\n    if (daysAgo === 0) {\n      txns.forEach(t => { t.status = \"Pending\"; t.reason = \"\"; t.processed = false; t.note = \"awaiting submission to bank\"; });\n    }\n\n    RUNS.push({\n      id: \"RUN-\" + (runSeq++),\n      name: tpl.name,\n      kind: tpl.kind,\n      typeLabel: tpl.typeLabel,\n      desc: tpl.desc,\n      date: new Date(d),\n      time: pick([\"06:00\",\"06:30\",\"09:15\",\"11:00\",\"14:30\",\"16:45\"]),\n      txns, daysAgo,\n    });\n  }\n}\nRUNS.sort((a, b) => b.date - a.date);\n\n/* A small, fixed set of runs flagged for manual review — this tracker should\n   rarely have anything in it. All three sit inside the 30-day window but\n   outside the 7-day window, so the 7-day view is clean. */\nconst reviewCandidates = RUNS.filter(r => r.daysAgo >= 8 && r.daysAgo < 30 && r.name === \"Membership Dues — Daily Run\");\n[reviewCandidates[0], reviewCandidates[reviewCandidates.length - 1]]\n  .filter(Boolean)\n  .forEach(r => { r.needsReview = true; });\n\n/* ═══════════════════════════════════════════════════════════\n   HELPERS\n   ═══════════════════════════════════════════════════════════ */\nconst $ = id => document.getElementById(id);\nconst fmtMoney = n => n.toLocaleString(\"en-AU\", { style: \"currency\", currency: \"AUD\", maximumFractionDigits: n >= 10000 ? 0 : 2 });\nconst fmtNum = n => n.toLocaleString(\"en-AU\");\nconst fmtPct = n => (n * 100).toFixed(1) + \"%\";\nconst DOW = [\"Sunday\",\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\nconst MON = [\"Jan\",\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\",\"Dec\"];\nconst fmtDateLong = d => `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;\nconst fmtDateShort = d => `${d.getDate()} ${MON[d.getMonth()]}`;\nconst esc = s => String(s).replace(/[&<>\"]/g, c => ({ \"&\":\"&amp;\", \"<\":\"&lt;\", \">\":\"&gt;\", '\"':\"&quot;\" }[c]));\n\nconst PAID = [\"Cleared\", \"Reconciled\"];\nconst isPaid = t => PAID.includes(t.status);\n\nfunction runStats(run) {\n  const val = a => a.reduce((s, t) => s + t.amount, 0);\n  const paid = run.txns.filter(isPaid);\n  const proc = run.txns.filter(t => t.status === \"Processing\");\n  const pend = run.txns.filter(t => t.status === \"Pending\");\n  const wait = run.txns.filter(t => t.status === \"Awaiting payment\");\n  const bad  = run.txns.filter(t => t.status === \"Declined\");\n  return {\n    count: run.txns.length,\n    okCount: paid.length,   okValue: val(paid),\n    procCount: proc.length, procValue: val(proc),\n    pendCount: pend.length, pendValue: val(pend),\n    waitCount: wait.length, waitValue: val(wait),\n    badCount: bad.length,   badValue: val(bad),\n    badUnprocessed: bad.filter(t => !t.processed).length,\n    totalValue: val(run.txns),\n  };\n}\n\n/* The run itself has no stored status — its state is derived from its payments.\n   Lifecycle: Generated (created, not yet sent to bank) → Processing (sent,\n   awaiting bank results) → Finalised (no payments remain processing). */\nfunction runState(run) {\n  const s = runStats(run);\n  if (s.pendCount)            return { key: \"generated\",  label: \"Generated\",  cls: \"generated\" };\n  if (s.procCount)            return { key: \"processing\", label: `Processing · ${fmtNum(s.procCount)}`, cls: \"processing\" };\n  return { key: \"finalised\", label: \"Finalised\", cls: \"completed\" };\n}\n\nfunction toast(msg, cls) {\n  const el = document.createElement(\"div\");\n  el.className = \"toast \" + (cls || \"\");\n  el.textContent = msg;\n  $(\"toast-container\").appendChild(el);\n  setTimeout(() => el.remove(), 2600);\n}\n\n/* ═══════════════════════════════════════════════════════════\n   STATE\n   ═══════════════════════════════════════════════════════════ */\nconst state = { rangeDays: 30, runFilter: \"all\", longProc: false };\n\nconst runsInRange = () => RUNS.filter(r => r.daysAgo < state.rangeDays);\n\nfunction setMetricActive(btn) {\n  btn.parentNode.querySelectorAll(\"button\").forEach(b => b.classList.remove(\"active\"));\n  btn.classList.add(\"active\");\n}\nfunction setTrendMetric(m, btn) { state.trendMetric = m; setMetricActive(btn); renderTrend(); }\nfunction setTypeMetric(m, btn)  { state.typeMetric  = m; setMetricActive(btn); renderTypeBars(); }\n\nfunction setRange(days) {\n  state.rangeDays = parseInt(days, 10);\n  $(\"kpi-range-days\").textContent = state.rangeDays;\n  renderDashboard();\n}\nfunction setRunFilter(f, btn) {\n  state.runFilter = f;\n  state.longProc = false;\n  document.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c === btn));\n  state.animateRuns = true;\n  renderRuns();\n}\n\n/* A run is flagged when it still has payments that have been processing for\n   more than 5 days (held / disputed direct debits). */\nfunction isLongProcessingRun(run) {\n  return !!run.needsReview;\n}\nfunction showLongProcessing() {\n  if (!runsInRange().some(isLongProcessingRun)) return;\n  state.longProc = true;\n  const search = $(\"runs-search\"); if (search) search.value = \"\";\n  document.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c.dataset.f === \"review\"));\n  state.animateRuns = true;\n  renderRuns();\n  const ms = $(\"main-scroll\"), el = $(\"runs-list\");\n  if (ms && el) ms.scrollTop += el.getBoundingClientRect().top - ms.getBoundingClientRect().top - 14;\n}\nfunction setReviewFilter(btn) {\n  state.longProc = true;\n  state.runFilter = \"all\";\n  document.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c === btn));\n  state.animateRuns = true;\n  renderRuns();\n}\nfunction clearLongProcessing() {\n  state.longProc = false;\n  state.runFilter = \"all\";\n  document.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c.dataset.f === \"all\"));\n  renderRuns();\n}\n\n/* ═══════════════════════════════════════════════════════════\n   VIEW 1 — DASHBOARD\n   ═══════════════════════════════════════════════════════════ */\nfunction renderDashboard() {\n  renderKpis();\n  renderTrend();\n  renderTypeBars();\n  renderRuns();\n}\n\nfunction renderKpis() {\n  const runs = runsInRange();\n  const txns = runs.flatMap(r => r.txns);\n  const paid = txns.filter(isPaid);\n  const proc = txns.filter(t => t.status === \"Processing\");\n  const wait = txns.filter(t => t.status === \"Awaiting payment\");\n  const bad  = txns.filter(t => t.status === \"Declined\");\n  const val = a => a.reduce((s, t) => s + t.amount, 0);\n  const okValue = val(paid), procValue = val(proc), waitValue = val(wait), badValue = val(bad);\n\n  /* previous period comparison */\n  const prev = RUNS.filter(r => r.daysAgo >= state.rangeDays && r.daysAgo < state.rangeDays * 2);\n  const prevOkValue = prev.flatMap(r => r.txns).filter(isPaid).reduce((s, t) => s + t.amount, 0);\n  const delta = prevOkValue ? (okValue - prevOkValue) / prevOkValue : 0;\n  const deltaTxt = delta >= 0\n    ? `<span class=\"up\">&#9650; ${fmtPct(Math.abs(delta))}<\u002Fspan> vs prior period`\n    : `<span class=\"down\">&#9660; ${fmtPct(Math.abs(delta))}<\u002Fspan> vs prior period`;\n\n  const kpis = [\n    { label: \"Total collected\", value: fmtMoney(okValue), cls: \"brand\", sub: deltaTxt },\n    { label: \"Payments processed\", value: fmtNum(txns.length), sub: `across ${runs.length} payment runs` },\n    { label: \"Processing\", value: fmtNum(proc.length), cls: proc.length ? \"\" : \"pos\", sub: `${fmtMoney(procValue)} awaiting DD result` },\n    { label: \"Invoices outstanding\", value: fmtNum(wait.length), sub: `${fmtMoney(waitValue)} awaiting member payment` },\n    { label: \"Declined\", value: fmtNum(bad.length), cls: bad.length ? \"neg\" : \"pos\", sub: `${fmtMoney(badValue)} uncollected`, action: \"showDeclines()\", hint: \"View declines &rsaquo;\" },\n  ];\n  const reviewCount = runs.filter(isLongProcessingRun).length;\n  const chip = $(\"chip-review\");\n  if (chip) {\n    $(\"chip-review-count\").textContent = fmtNum(reviewCount);\n    chip.disabled = !reviewCount;\n    chip.style.opacity = reviewCount ? \"\" : \".45\";\n    chip.style.cursor = reviewCount ? \"\" : \"default\";\n  }\n  kpis.push(reviewCount\n    ? { label: \"Runs to review\", value: fmtNum(reviewCount), cls: \"neg\", sub: \"processing longer than 5 days\", action: \"showLongProcessing()\", hint: \"View runs &rsaquo;\" }\n    : { label: \"Runs to review\", value: \"0\", cls: \"pos\", sub: \"nothing needs attention\" });\n  $(\"kpi-grid\").innerHTML = kpis.map(k => `\n    <div class=\"kpi-card${k.action ? \" clickable\" : \"\"}\"${k.action ? ` onclick=\"${k.action}\" role=\"button\" tabindex=\"0\" title=\"${k.label}\"` : \"\"}>\n      <div class=\"kpi-label\">${k.label}${k.hint ? `<span class=\"kpi-hint\">${k.hint}<\u002Fspan>` : \"\"}<\u002Fdiv>\n      <div class=\"kpi-value ${k.cls || \"\"}\">${k.value}<\u002Fdiv>\n      <div class=\"kpi-sub\">${k.sub}<\u002Fdiv>\n    <\u002Fdiv>`).join(\"\");\n}\n\n/* Re-triggers the small fade used when a metric label set changes */\nfunction flashSwap(el) {\n  if (!el) return;\n  el.classList.remove(\"swap\");\n  void el.offsetWidth;\n  el.classList.add(\"swap\");\n}\n\nfunction paintTrend(svg, geo) {\n  geo.forEach((g, i) => {\n    const ok  = svg.querySelector(`rect[data-b=\"ok\"][data-i=\"${i}\"]`);\n    const bad = svg.querySelector(`rect[data-b=\"bad\"][data-i=\"${i}\"]`);\n    if (ok) {\n      ok.setAttribute(\"x\", g.x); ok.setAttribute(\"width\", g.w);\n      ok.setAttribute(\"y\", g.okH ? g.okY : 130); ok.setAttribute(\"height\", g.okH);\n      ok.setAttribute(\"opacity\", g.okH ? \"0.85\" : \"0\");\n      const t = ok.querySelector(\"title\"); if (t) t.textContent = g.tip;\n    }\n    if (bad) {\n      bad.setAttribute(\"x\", g.x); bad.setAttribute(\"width\", g.w);\n      bad.setAttribute(\"y\", g.badH ? g.badY : 130); bad.setAttribute(\"height\", g.badH);\n      bad.setAttribute(\"opacity\", g.badH ? \"0.8\" : \"0\");\n    }\n  });\n}\n\nfunction renderTrend() {\n  const byValue = (state.trendMetric || \"value\") === \"value\";\n  const fmtM = byValue ? fmtMoney : fmtNum;\n  const days = Math.min(state.rangeDays, 90);\n  const byDay = [];\n  for (let i = days - 1; i >= 0; i--) {\n    const dayRuns = RUNS.filter(r => r.daysAgo === i);\n    const txns = dayRuns.flatMap(r => r.txns);\n    byDay.push({\n      i,\n      ok:  byValue ? txns.filter(isPaid).reduce((s, t) => s + t.amount, 0) : txns.filter(isPaid).length,\n      bad: byValue ? txns.filter(t => t.status === \"Declined\").reduce((s, t) => s + t.amount, 0) : txns.filter(t => t.status === \"Declined\").length,\n      date: dayRuns[0] ? dayRuns[0].date : null,\n    });\n  }\n  const W = 560, H = 130, PAD = 4;\n  const max = Math.max(...byDay.map(d => d.ok), 1);\n  const bw = (W - PAD * 2) / byDay.length;\n  /* Geometry per day; both rects always exist so a metric switch morphs instead of redrawing */\n  const geo = byDay.map((d, idx) => {\n    const x = PAD + idx * bw;\n    const okH  = (d.ok  / max) * (H - 18);\n    const badH = d.bad > 0 ? Math.max((d.bad / max) * (H - 18), 1.5) : 0;\n    return {\n      x: +(x + bw * 0.12).toFixed(1), w: +(bw * 0.76).toFixed(1),\n      okY: +(H - okH).toFixed(1), okH: +okH.toFixed(1),\n      badY: +(H - okH - badH - (badH ? 1 : 0)).toFixed(1), badH: +badH.toFixed(1),\n      tip: `${d.date ? fmtDateShort(d.date) : \"\"}: ${fmtM(d.ok)} collected${d.bad ? \", \" + fmtM(d.bad) + \" declined\" : \"\"}`,\n    };\n  });\n  const svg = $(\"trend-svg\");\n  if (svg.dataset.days !== String(geo.length)) {\n    svg.dataset.days = String(geo.length);\n    svg.innerHTML = `<line x1=\"0\" y1=\"${H-0.5}\" x2=\"${W}\" y2=\"${H-0.5}\" stroke=\"#d0d7e3\" stroke-width=\"1\"/>` +\n      geo.map((g, i) => `<rect data-b=\"ok\" data-i=\"${i}\" x=\"${g.x}\" y=\"${H}\" width=\"${g.w}\" height=\"0\" rx=\"1.5\" fill=\"#2563c4\" opacity=\"0.85\"><title><\u002Ftitle><\u002Frect><rect data-b=\"bad\" data-i=\"${i}\" x=\"${g.x}\" y=\"${H}\" width=\"${g.w}\" height=\"0\" rx=\"1\" fill=\"#dc2626\" opacity=\"0.8\"><\u002Frect>`).join(\"\");\n    requestAnimationFrame(() => paintTrend(svg, geo));\n  } else {\n    paintTrend(svg, geo);\n  }\n\n  /* Y-axis value labels (max → 0) and X-axis date labels across the range */\n  $(\"trend-yaxis\").innerHTML = `<span>${fmtM(max)}<\u002Fspan><span>${fmtM(byValue ? max/2 : Math.round(max/2))}<\u002Fspan><span>${byValue ? \"$0\" : \"0\"}<\u002Fspan>`;\n  $(\"trend-lg-ok\").textContent  = byValue ? \"Collected value\" : \"Collected payments\";\n  $(\"trend-lg-bad\").textContent = byValue ? \"Declined value\"  : \"Declined payments\";\n  flashSwap($(\"trend-yaxis\"));\n  flashSwap($(\"trend-lg-ok\").closest(\".trend-legend\"));\n  const N = byDay.length;\n  const dateAt = idx => {\n    let j = idx; while (j < N && !byDay[j].date) j++;\n    if (j >= N || !byDay[j].date) { j = idx; while (j >= 0 && !byDay[j].date) j--; }\n    return (j >= 0 && byDay[j] && byDay[j].date) ? fmtDateShort(byDay[j].date) : \"\";\n  };\n  const xlabels = [0, 0.25, 0.5, 0.75, 1].map(f => dateAt(Math.round(f * (N - 1))));\n  $(\"trend-xaxis\").innerHTML = xlabels.map(l => `<span>${l}<\u002Fspan>`).join(\"\");\n}\n\nfunction renderTypeBars() {\n  const txns = runsInRange().flatMap(r => r.txns);\n  const rows = PAY_TYPES.map(pt => {\n    const mine = txns.filter(t => t.type === pt.id);\n    return { pt, count: mine.length, value: mine.reduce((s, t) => s + t.amount, 0) };\n  });\n  const byValue = (state.typeMetric || \"count\") === \"value\";\n  const metric = r => byValue ? r.value : r.count;\n  const max = Math.max(...rows.map(metric), 1);\n  const cont = $(\"type-bars\");\n\n  /* Rows stay in a fixed DOM order and are re-ranked with translateY, so a\n     metric switch animates (bar width + position) instead of redrawing. */\n  if (cont.childElementCount !== rows.length) {\n    cont.innerHTML = rows.map(r => `\n      <div class=\"hbar-row\" data-t=\"${r.pt.id}\">\n        <div class=\"hbar-label\" title=\"${esc(r.pt.label)}\">${esc(r.pt.label)}<\u002Fdiv>\n        <div class=\"hbar-track\"><div class=\"hbar-fill\" style=\"width:0%;background:${r.pt.color}\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"hbar-val\"><span class=\"m\">${fmtNum(r.count)}<\u002Fspan> &middot; <span class=\"m\">${fmtMoney(r.value)}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>`).join(\"\");\n  }\n  const ranked = rows.slice().sort((a, b) => metric(b) - metric(a));\n  const pitch = (cont.firstElementChild ? cont.firstElementChild.offsetHeight : 16) + 8;\n  rows.forEach((r, domIdx) => {\n    const el = cont.querySelector(`.hbar-row[data-t=\"${r.pt.id}\"]`);\n    if (!el) return;\n    const rank = ranked.indexOf(r);\n    el.style.transform = `translateY(${(rank - domIdx) * pitch}px)`;\n    el.style.zIndex = String(rows.length - rank);\n    const val = el.querySelector(\".hbar-val\");\n    /* Bold whichever figure the active toggle is ranking by */\n    const html = `<span class=\"m${byValue ? \"\" : \" on\"}\">${fmtNum(r.count)}<\u002Fspan> \\u00b7 <span class=\"m${byValue ? \" on\" : \"\"}\">${fmtMoney(r.value)}<\u002Fspan>`;\n    if (val.innerHTML !== html) { val.innerHTML = html; flashSwap(val); }\n    requestAnimationFrame(() => {\n      el.querySelector(\".hbar-fill\").style.width = (metric(r) / max * 100).toFixed(1) + \"%\";\n    });\n  });\n}\n\n\n/* ── Runs list grouped by date ───────────────────────────── */\nfunction statusBadge(status) {\n  return txnBadge(status);\n}\nfunction runStatePill(run) {\n  const st = runState(run);\n  return `<span class=\"status-pill ${st.cls}\"><span class=\"dot\"><\u002Fspan>${st.label}<\u002Fspan>`;\n}\nfunction txnBadge(status) {\n  const map = {\n    \"Cleared\":          '<span class=\"badge success\">&#10003; Cleared<\u002Fspan>',\n    \"Reconciled\":       '<span class=\"badge reconciled\">&#10003; Reconciled<\u002Fspan>',\n    \"Processing\":       '<span class=\"badge processing\">&#8635; Processing<\u002Fspan>',\n    \"Awaiting payment\": '<span class=\"badge awaiting\">&#8987; Awaiting payment<\u002Fspan>',\n    \"Declined\":         '<span class=\"badge declined\">&#10007; Declined<\u002Fspan>',\n    \"Pending\":          '<span class=\"badge pending\">&#9675; Pending<\u002Fspan>',\n  };\n  return map[status] || esc(status);\n}\n\nfunction runTypeChips(run) {\n  const counts = {};\n  run.txns.forEach(t => counts[t.type] = (counts[t.type] || 0) + 1);\n  return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([id, n]) => {\n    const pt = typeById(id);\n    return `<span class=\"type-chip\" style=\"background:${pt.pale};color:${pt.color}\">${esc(pt.label)} &middot; ${fmtNum(n)}<\u002Fspan>`;\n  }).join(\" \");\n}\n\n/* Staggered entrance for the runs list after a quick-filter change */\nfunction staggerRuns() {\n  state.animateRuns = false;\n  const list = $(\"runs-list\");\n  if (!list) return;\n  list.classList.remove(\"runs-anim\");\n  void list.offsetWidth;\n  list.classList.add(\"runs-anim\");\n  let i = 0;\n  list.querySelectorAll(\".run-card-5c, .runs-empty\").forEach(el => {\n    el.style.animationDelay = Math.min(i++ * 22, 260) + \"ms\";\n  });\n  list.addEventListener(\"animationend\", function done(e) {\n    if (e.target !== list) return;\n    list.removeEventListener(\"animationend\", done);\n  });\n}\n\nfunction renderRuns() {\n  const q = ($(\"runs-search\").value || \"\").toLowerCase();\n  let runs = state.longProc ? RUNS.filter(isLongProcessingRun) : runsInRange();\n  if (!state.longProc && state.runFilter !== \"all\") runs = runs.filter(r => runState(r).key === state.runFilter);\n  if (q) runs = runs.filter(r => (r.name + \" \" + r.id + \" \" + r.typeLabel + \" \" + fmtDateLong(r.date)).toLowerCase().includes(q));\n\n  const badge = $(\"runs-count-badge\");\n  if (badge) badge.textContent = fmtNum(runs.length);\n\n  const notice = state.longProc\n    ? `<div class=\"filter-notice\">Showing <strong>${fmtNum(runs.length)}<\u002Fstrong> run${runs.length === 1 ? \"\" : \"s\"} with payments processing longer than 5 days — across all dates. <button type=\"button\" onclick=\"clearLongProcessing()\">Clear filter<\u002Fbutton><\u002Fdiv>`\n    : \"\";\n\n  if (!runs.length) {\n    $(\"runs-list\").innerHTML = notice + `<div class=\"runs-empty\">No payment runs match the current filters.<\u002Fdiv>`;\n    if (state.animateRuns) staggerRuns();\n    return;\n  }\n\n  /* group by date */\n  const groups = new Map();\n  runs.forEach(r => {\n    const key = r.date.toDateString();\n    if (!groups.has(key)) groups.set(key, []);\n    groups.get(key).push(r);\n  });\n\n  let html = \"\";\n  for (const [key, dayRuns] of groups) {\n    const d = dayRuns[0].date;\n    const stats = dayRuns.map(runStats);\n    const dayOkValue = stats.reduce((s, x) => s + x.okValue, 0);\n    const dayCount   = stats.reduce((s, x) => s + x.count, 0);\n    const dayBad     = stats.reduce((s, x) => s + x.badCount, 0);\n    const dayProc    = stats.reduce((s, x) => s + x.procCount, 0);\n    const dayPend    = stats.reduce((s, x) => s + x.pendCount, 0);\n    html += `<div class=\"date-group\">\n      <div class=\"date-group-sticky\">\n      <div class=\"date-group-hd\">\n        <h3>${fmtDateLong(d)}<\u002Fh3>\n        <span class=\"date-group-meta\">${dayRuns.length} run${dayRuns.length > 1 ? \"s\" : \"\"} &middot; <strong>${fmtNum(dayCount)}<\u002Fstrong> payments &middot; <strong>${fmtMoney(dayOkValue)}<\u002Fstrong> collected${dayPend ? ` &middot; <span style=\"color:#5c6a79\">${fmtNum(dayPend)} pending<\u002Fspan>` : \"\"}${dayProc ? ` &middot; <span style=\"color:var(--uih-hub-blue)\">${fmtNum(dayProc)} processing<\u002Fspan>` : \"\"}${dayBad ? ` &middot; <span style=\"color:var(--danger)\">${fmtNum(dayBad)} declined<\u002Fspan>` : \"\"}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"run-cols-hd\">\n        <div>Payment run<\u002Fdiv>\n        <div>Status<\u002Fdiv>\n        <div>Total amount<\u002Fdiv>\n        <div>Payments<\u002Fdiv>\n        <div>Pending<\u002Fdiv>\n        <div>Processing<\u002Fdiv>\n        <div>Declined<\u002Fdiv>\n        <div>Unprocessed<\u002Fdiv>\n        <div><\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>`;\n    for (const run of dayRuns) {\n      const s = runStats(run);\n      html += `\n      <div class=\"run-card-5c\" onclick=\"showDetail('${run.id}')\" title=\"Open ${esc(run.id)} — view payments in this run\">\n        <div class=\"run-id-line\">\n          <div style=\"min-width:0;\">\n            <div class=\"run-name\">${esc(run.name)}<\u002Fdiv>\n            <div class=\"run-sub\">${esc(run.id)}${run.typeLabel ? \" &middot; \" + esc(run.typeLabel) : \"\"}${run.desc ? \" &middot; \" + esc(run.desc) : \"\"}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>${runStatePill(run)}<\u002Fdiv>\n        <div class=\"run-col-value amount\">${fmtMoney(s.totalValue)}<\u002Fdiv>\n        <div class=\"run-col-value\">${fmtNum(s.count)}<\u002Fdiv>\n        <div class=\"run-col-value\" style=\"color:${s.pendCount ? \"#5c6a79\" : \"var(--text-muted)\"}\">${s.pendCount ? fmtNum(s.pendCount) : \"&mdash;\"}<\u002Fdiv>\n        <div class=\"run-col-value\" style=\"color:${s.procCount ? \"var(--uih-hub-blue)\" : \"var(--text-muted)\"}\">${s.procCount ? fmtNum(s.procCount) : \"&mdash;\"}<\u002Fdiv>\n        <div class=\"run-col-value\" style=\"color:${s.badCount ? \"var(--danger)\" : \"var(--text-muted)\"}\">${s.badCount ? fmtNum(s.badCount) : \"&mdash;\"}<\u002Fdiv>\n        <div>${s.badUnprocessed\n            ? `<button type=\"button\" class=\"retry-btn\" onclick=\"event.stopPropagation();toast('Retry batch created for ${s.badUnprocessed} payment${s.badUnprocessed > 1 ? \"s\" : \"\"} (mock)','success')\" title=\"Retry ${s.badUnprocessed} unprocessed payment${s.badUnprocessed > 1 ? \"s\" : \"\"} in this run\">Retry &middot; ${fmtNum(s.badUnprocessed)}<\u002Fbutton>`\n            : `<button type=\"button\" class=\"retry-btn\" disabled>&mdash;<\u002Fbutton>`}\n        <\u002Fdiv>\n        <div class=\"run-chevron\">&#8250;<\u002Fdiv>\n      <\u002Fdiv>`;\n    }\n    html += `<\u002Fdiv>`;\n  }\n  $(\"runs-list\").innerHTML = notice + html;\n  if (state.animateRuns) staggerRuns();\n  watchStickyHeaders();\n}\n\n/* Toggle .stuck on date-group headers while they are pinned */\nlet stickyObserver = null;\nfunction watchStickyHeaders() {\n  if (stickyObserver) stickyObserver.disconnect();\n  stickyObserver = new IntersectionObserver(\n    entries => entries.forEach(e => e.target.classList.toggle(\"stuck\", e.intersectionRatio < 1 && e.boundingClientRect.top < e.rootBounds.top)),\n    { root: $(\"main-scroll\"), threshold: [1] }\n  );\n  document.querySelectorAll(\".date-group-sticky\").forEach(el => stickyObserver.observe(el));\n}\n\n/* ═══════════════════════════════════════════════════════════\n   VIEW 2 — RUN DRILL-DOWN\n   ═══════════════════════════════════════════════════════════ */\nconst detailState = { runId: null, filter: \"all\", search: \"\" };\n\nfunction showDetail(runId) {\n  detailState.runId = runId;\n  detailState.filter = \"all\";\n  detailState.search = \"\";\n  $(\"view-dashboard\").style.display = \"none\";\n  $(\"view-detail\").style.display = \"\";\n  $(\"main-scroll\").scrollTop = 0;\n  renderDetail();\n}\nfunction showDashboard() {\n  $(\"view-detail\").style.display = \"none\";\n  $(\"view-declines\").style.display = \"none\";\n  $(\"view-dashboard\").style.display = \"\";\n  $(\"main-scroll\").scrollTop = 0;\n}\nfunction setDetailFilter(f, btn) {\n  detailState.filter = f;\n  btn.parentElement.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c === btn));\n  renderDetailTable();\n}\n\nfunction renderDetail() {\n  const run = RUNS.find(r => r.id === detailState.runId);\n  if (!run) return showDashboard();\n  const s = runStats(run);\n\n  /* by-type summary */\n
