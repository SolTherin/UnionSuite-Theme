  const typeRows = PAY_TYPES.map(pt => {\n    const mine = run.txns.filter(t => t.type === pt.id);\n    if (!mine.length) return null;\n    const ok = mine.filter(isPaid);\n    return {\n      pt, count: mine.length,\n      okCount: ok.length,\n      pendCount: mine.filter(t => t.status === \"Processing\" || t.status === \"Awaiting payment\" || t.status === \"Pending\").length,\n      badCount: mine.filter(t => t.status === \"Declined\").length,\n      okValue: ok.reduce((x, t) => x + t.amount, 0),\n    };\n  }).filter(Boolean).sort((a, b) => b.count - a.count);\n\n  /* decline reasons */\n  const reasonCounts = {};\n  run.txns.filter(t => t.status === \"Declined\").forEach(t => {\n    reasonCounts[t.reason] = reasonCounts[t.reason] || { count: 0, value: 0 };\n    reasonCounts[t.reason].count++;\n    reasonCounts[t.reason].value += t.amount;\n  });\n  const reasons = Object.entries(reasonCounts).sort((a, b) => b[1].count - a[1].count);\n\n  const okPct = s.count ? s.okCount / s.count : 0;\n\n  $(\"detail-content\").innerHTML = `\n    <div class=\"detail-hd\">\n      <div>\n        <h2>${esc(run.name)}<\u002Fh2>\n        <div class=\"detail-hd-meta\">${esc(run.id)} &middot; ${fmtDateLong(run.date)} at ${run.time}${run.typeLabel ? \" &middot; \" + esc(run.typeLabel) : \"\"}${run.desc ? \" &middot; \" + esc(run.desc) : \"\"}<\u002Fdiv>\n      <\u002Fdiv>\n      ${runStatePill(run)}\n      <span class=\"spacer\"><\u002Fspan>\n      <button type=\"button\" class=\"detail-action\" onclick=\"window.print()\">&#128424; Print<\u002Fbutton>\n      <button type=\"button\" class=\"detail-action\" onclick=\"toast('CSV export queued (mock)')\">&#128229; Export CSV<\u002Fbutton>\n      ${s.badCount ? `<button type=\"button\" class=\"detail-action primary\" onclick=\"toast('Retry batch created for ${s.badCount} declined payments (mock)')\">&#8635; Retry declined (${s.badCount})<\u002Fbutton>` : \"\"}\n    <\u002Fdiv>\n\n    <div class=\"kpi-grid\" style=\"margin-top:14px;\">\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Payments in run<\u002Fdiv><div class=\"kpi-value\">${fmtNum(s.count)}<\u002Fdiv><div class=\"kpi-sub\">${typeRows.length} payment type${typeRows.length > 1 ? \"s\" : \"\"}<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Collected<\u002Fdiv><div class=\"kpi-value brand\">${fmtMoney(s.okValue)}<\u002Fdiv><div class=\"kpi-sub\">${fmtNum(s.okCount)} payments cleared<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Processing<\u002Fdiv><div class=\"kpi-value ${s.procCount ? \"\" : \"pos\"}\">${fmtNum(s.procCount)}<\u002Fdiv><div class=\"kpi-sub\">${fmtMoney(s.procValue)} awaiting DD result<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Invoices outstanding<\u002Fdiv><div class=\"kpi-value\">${fmtNum(s.waitCount)}<\u002Fdiv><div class=\"kpi-sub\">${fmtMoney(s.waitValue)} awaiting payment<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Declined<\u002Fdiv><div class=\"kpi-value ${s.badCount ? \"neg\" : \"pos\"}\">${fmtNum(s.badCount)}<\u002Fdiv><div class=\"kpi-sub\">${fmtMoney(s.badValue)} uncollected<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Average payment<\u002Fdiv><div class=\"kpi-value\">${fmtMoney(s.okCount ? s.okValue / s.okCount : 0)}<\u002Fdiv><div class=\"kpi-sub\">collected payments only<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"detail-panels\">\n      <div class=\"panel\">\n        <div class=\"panel-title\">Summary by payment type<\u002Fdiv>\n        <table class=\"mini-table\">\n          <thead><tr><th>Type<\u002Fth><th class=\"num\">Count<\u002Fth><th class=\"num\">OK<\u002Fth><th class=\"num\">Pend.<\u002Fth><th class=\"num\">Dec.<\u002Fth><th class=\"num\">Collected<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            ${typeRows.map(r => `<tr>\n              <td><span class=\"type-chip\" style=\"background:${r.pt.pale};color:${r.pt.color}\">${esc(r.pt.label)}<\u002Fspan><\u002Ftd>\n              <td class=\"num\">${fmtNum(r.count)}<\u002Ftd>\n              <td class=\"num\" style=\"color:var(--success);font-weight:600;\">${fmtNum(r.okCount)}<\u002Ftd>\n              <td class=\"num\" style=\"color:${r.pendCount ? \"var(--uih-hub-blue)\" : \"var(--text-muted)\"};font-weight:600;\">${fmtNum(r.pendCount)}<\u002Ftd>\n              <td class=\"num\" style=\"color:${r.badCount ? \"var(--danger)\" : \"var(--text-muted)\"};font-weight:600;\">${fmtNum(r.badCount)}<\u002Ftd>\n              <td class=\"num cell-amount\">${fmtMoney(r.okValue)}<\u002Ftd>\n            <\u002Ftr>`).join(\"\")}\n          <\u002Ftbody>\n          <tfoot><tr><td>Total<\u002Ftd><td class=\"num\">${fmtNum(s.count)}<\u002Ftd><td class=\"num\">${fmtNum(s.okCount)}<\u002Ftd><td class=\"num\">${fmtNum(s.pendCount + s.procCount + s.waitCount)}<\u002Ftd><td class=\"num\">${fmtNum(s.badCount)}<\u002Ftd><td class=\"num\">${fmtMoney(s.okValue)}<\u002Ftd><\u002Ftr><\u002Ftfoot>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <div class=\"panel\">\n        <div class=\"panel-title\">Outcome<\u002Fdiv>\n        <div class=\"donut-wrap\">\n          <svg class=\"donut-svg\" viewBox=\"0 0 42 42\">\n            <circle cx=\"21\" cy=\"21\" r=\"15.9155\" fill=\"none\" stroke=\"#fecaca\" stroke-width=\"5\"/>\n            <circle cx=\"21\" cy=\"21\" r=\"15.9155\" fill=\"none\" stroke=\"#16a34a\" stroke-width=\"5\"\n              stroke-dasharray=\"${(okPct * 100).toFixed(2)} 100\" stroke-dashoffset=\"25\" stroke-linecap=\"round\"\n              pathLength=\"100\"/>\n            <text x=\"21\" y=\"21.5\" text-anchor=\"middle\" style=\"font-size:8px;font-weight:700;fill:var(--text)\">${fmtPct(okPct)}<\u002Ftext>\n            <text x=\"21\" y=\"27.5\" text-anchor=\"middle\" style=\"font-size:3.4px;fill:var(--text-muted)\">collected<\u002Ftext>\n          <\u002Fsvg>\n          <div class=\"donut-legend\">\n            <div class=\"row\"><span class=\"dot\" style=\"background:var(--success)\"><\u002Fspan><span class=\"lbl\">Collected<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"padding-left:16px;\"><span class=\"amt\">${fmtNum(s.okCount)} &middot; ${fmtMoney(s.okValue)}<\u002Fspan><\u002Fdiv>\n            <div class=\"row\"><span class=\"dot\" style=\"background:#5c6a79\"><\u002Fspan><span class=\"lbl\">Pending<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"padding-left:16px;\"><span class=\"amt\">${fmtNum(s.pendCount)} &middot; ${fmtMoney(s.pendValue)}<\u002Fspan><\u002Fdiv>\n            <div class=\"row\"><span class=\"dot\" style=\"background:#2563c4\"><\u002Fspan><span class=\"lbl\">Processing<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"padding-left:16px;\"><span class=\"amt\">${fmtNum(s.procCount)} &middot; ${fmtMoney(s.procValue)}<\u002Fspan><\u002Fdiv>\n            <div class=\"row\"><span class=\"dot\" style=\"background:#d9a842\"><\u002Fspan><span class=\"lbl\">Awaiting payment<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"padding-left:16px;\"><span class=\"amt\">${fmtNum(s.waitCount)} &middot; ${fmtMoney(s.waitValue)}<\u002Fspan><\u002Fdiv>\n            <div class=\"row\"><span class=\"dot\" style=\"background:var(--danger)\"><\u002Fspan><span class=\"lbl\">Declined<\u002Fspan><\u002Fdiv>\n            <div class=\"row\" style=\"padding-left:16px;\"><span class=\"amt\">${fmtNum(s.badCount)} &middot; ${fmtMoney(s.badValue)}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"panel\">\n        <div class=\"panel-title\">Decline reasons<\u002Fdiv>\n        ${reasons.length ? `\n        <table class=\"mini-table\">\n          <thead><tr><th>Reason<\u002Fth><th class=\"num\">Count<\u002Fth><th class=\"num\">Value<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            ${reasons.map(([reason, r]) => `<tr>\n              <td>${esc(reason)}<\u002Ftd>\n              <td class=\"num cell-strong\" style=\"color:var(--danger)\">${fmtNum(r.count)}<\u002Ftd>\n              <td class=\"num cell-muted\">${fmtMoney(r.value)}<\u002Ftd>\n            <\u002Ftr>`).join(\"\")}\n          <\u002Ftbody>\n        <\u002Ftable>` : `<div style=\"font-size:12px;color:var(--text-muted);font-style:italic;padding:6px 0;\">No declined payments in this run. &#127881;<\u002Fdiv>`}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"section-title\" style=\"margin-top:24px;\">Transactions <span class=\"count-badge\" id=\"txn-count-badge\">${fmtNum(s.count)}<\u002Fspan><\u002Fdiv>\n    <div class=\"runs-toolbar\">\n      <input type=\"text\" class=\"runs-search\" id=\"txn-search\" placeholder=\"Search member, reference&hellip;\" oninput=\"detailState.search = this.value; renderDetailTable();\">\n      <span style=\"flex:1\"><\u002Fspan>\n      <button type=\"button\" class=\"filter-chip active\" onclick=\"setDetailFilter('all', this)\">All<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" onclick=\"setDetailFilter('Pending', this)\">Pending<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" onclick=\"setDetailFilter('Cleared', this)\">Cleared<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" onclick=\"setDetailFilter('Processing', this)\">Processing<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" onclick=\"setDetailFilter('Awaiting payment', this)\">Awaiting<\u002Fbutton>\n      <button type=\"button\" class=\"filter-chip\" onclick=\"setDetailFilter('Declined', this)\">Declined<\u002Fbutton>\n    <\u002Fdiv>\n    <div id=\"txn-table-slot\"><\u002Fdiv>`;\n\n  renderDetailTable();\n}\n\nfunction renderDetailTable() {\n  const run = RUNS.find(r => r.id === detailState.runId);\n  if (!run) return;\n  const q = (detailState.search || \"\").toLowerCase();\n  let txns = run.txns;\n  if (detailState.filter !== \"all\") txns = txns.filter(t => t.status === detailState.filter);\n  if (q) txns = txns.filter(t => (t.member + \" \" + t.ref + \" \" + t.memberId).toLowerCase().includes(q));\n\n  $(\"txn-count-badge\").textContent = fmtNum(txns.length);\n\n  const CAP = 100;\n  const shown = txns.slice(0, CAP);\n  $(\"txn-table-slot\").innerHTML = `\n    <div class=\"table-wrap\">\n      <table class=\"report-table\">\n        <thead><tr>\n          <th>Reference<\u002Fth><th>Member<\u002Fth><th>Member ID<\u002Fth><th>Payment type<\u002Fth>\n          <th class=\"num\">Amount<\u002Fth><th>Status<\u002Fth><th>Result / note<\u002Fth>\n        <\u002Ftr><\u002Fthead>\n        <tbody>\n          ${shown.map(t => {\n            const pt = typeById(t.type);\n            return `<tr>\n              <td class=\"cell-muted\">${esc(t.ref)}<\u002Ftd>\n              <td class=\"cell-strong\">${esc(t.member)}<\u002Ftd>\n              <td class=\"cell-muted\">${esc(t.memberId)}<\u002Ftd>\n              <td><span class=\"type-chip\" style=\"background:${pt.pale};color:${pt.color}\">${esc(pt.label)}<\u002Fspan><\u002Ftd>\n              <td class=\"num cell-amount ${t.status === \"Declined\" ? \"neg\" : \"\"}\">${fmtMoney(t.amount)}<\u002Ftd>\n              <td>${txnBadge(t.status)}<\u002Ftd>\n              <td class=\"cell-muted\">${esc(t.reason) || esc(t.note) || \"&mdash;\"}<\u002Ftd>\n            <\u002Ftr>`;\n          }).join(\"\")}\n          ${!shown.length ? `<tr><td colspan=\"7\" style=\"text-align:center;color:var(--text-muted);font-style:italic;\">No transactions match the current filters.<\u002Ftd><\u002Ftr>` : \"\"}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    ${txns.length > CAP ? `<p class=\"more-note\">Showing first ${CAP} of ${fmtNum(txns.length)} transactions &mdash; use Export CSV for the full list.<\u002Fp>` : \"\"}`;\n}\n\n/* ═══════════════════════════════════════════════════════════\n   VIEW 3 — DECLINES AREA\n   ═══════════════════════════════════════════════════════════ */\nconst declineState = { search: \"\", reason: \"all\" };\n\nfunction showDeclines() {\n  declineState.search = \"\";\n  declineState.reason = \"all\";\n  $(\"view-dashboard\").style.display = \"none\";\n  $(\"view-detail\").style.display = \"none\";\n  $(\"view-declines\").style.display = \"\";\n  $(\"main-scroll\").scrollTop = 0;\n  renderDeclines();\n}\nfunction setDeclineReason(r, btn) {\n  declineState.reason = r;\n  btn.parentElement.querySelectorAll(\".filter-chip\").forEach(c => c.classList.toggle(\"active\", c === btn));\n  renderDeclinesTable();\n}\n\nfunction declinesInRange() {\n  const rows = [];\n  runsInRange().forEach(run => {\n    run.txns.filter(t => t.status === \"Declined\").forEach(t => rows.push({ t, run }));\n  });\n  return rows;\n}\n\nfunction renderDeclines() {\n  const rows = declinesInRange();\n  const totalValue = rows.reduce((s, r) => s + r.t.amount, 0);\n  const affectedRuns = new Set(rows.map(r => r.run.id)).size;\n\n  const reasonCounts = {};\n  rows.forEach(r => {\n    reasonCounts[r.t.reason] = reasonCounts[r.t.reason] || { count: 0, value: 0 };\n    reasonCounts[r.t.reason].count++;\n    reasonCounts[r.t.reason].value += r.t.amount;\n  });\n  const reasons = Object.entries(reasonCounts).sort((a, b) => b[1].count - a[1].count);\n  const maxReason = Math.max(...reasons.map(([, r]) => r.count), 1);\n\n  $(\"declines-content\").innerHTML = `\n    <div class=\"detail-hd\">\n      <div>\n        <h2>Declined payments<\u002Fh2>\n        <div class=\"detail-hd-meta\">Last <span>${state.rangeDays}<\u002Fspan> days &middot; across ${fmtNum(affectedRuns)} payment run${affectedRuns === 1 ? \"\" : \"s\"}<\u002Fdiv>\n      <\u002Fdiv>\n      <span class=\"spacer\"><\u002Fspan>\n      ${rows.length ? `<button type=\"button\" class=\"detail-action primary\" onclick=\"toast('Retry batch created for ${rows.length} declined payments (mock)')\">&#8635; Retry all declined (${fmtNum(rows.length)})<\u002Fbutton>` : \"\"}\n    <\u002Fdiv>\n\n    <div class=\"kpi-grid\" style=\"margin-top:14px;\">\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Declined payments<\u002Fdiv><div class=\"kpi-value neg\">${fmtNum(rows.length)}<\u002Fdiv><div class=\"kpi-sub\">in the current period<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Value uncollected<\u002Fdiv><div class=\"kpi-value neg\">${fmtMoney(totalValue)}<\u002Fdiv><div class=\"kpi-sub\">potentially recoverable on retry<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Distinct reasons<\u002Fdiv><div class=\"kpi-value\">${fmtNum(reasons.length)}<\u002Fdiv><div class=\"kpi-sub\">decline categories<\u002Fdiv><\u002Fdiv>\n      <div class=\"kpi-card\"><div class=\"kpi-label\">Runs affected<\u002Fdiv><div class=\"kpi-value\">${fmtNum(affectedRuns)}<\u002Fdiv><div class=\"kpi-sub\">payment runs with declines<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    ${reasons.length ? `\n    <div class=\"panel\" style=\"margin-top:18px;\">\n      <div class=\"panel-title\">Declines by reason<\u002Fdiv>\n      <div id=\"decline-reason-bars\">${reasons.map(([reason, r]) => `\n        <div class=\"hbar-row\">\n          <div class=\"hbar-label\" title=\"${esc(reason)}\">${esc(reason)}<\u002Fdiv>\n          <div class=\"hbar-track\"><div class=\"hbar-fill\" style=\"width:${(r.count / maxReason * 100).toFixed(1)}%;background:var(--danger)\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"hbar-val\"><span class=\"m\">${fmtNum(r.count)}<\u002Fspan> &middot; <span class=\"m\">${fmtMoney(r.value)}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>`).join(\"\")}<\u002Fdiv>\n    <\u002Fdiv>` : \"\"}\n\n    <div class=\"section-title\" style=\"margin-top:24px;\">Declined transactions <span class=\"count-badge\" id=\"declines-count-badge\">${fmtNum(rows.length)}<\u002Fspan><\u002Fdiv>\n    <div class=\"runs-toolbar\">\n      <input type=\"text\" class=\"runs-search\" id=\"declines-search\" placeholder=\"Search member, reference, run&hellip;\" oninput=\"declineState.search = this.value; renderDeclinesTable();\">\n      <span style=\"flex:1\"><\u002Fspan>\n      <button type=\"button\" class=\"filter-chip active\" onclick=\"setDeclineReason('all', this)\">All reasons<\u002Fbutton>\n      ${reasons.map(([reason]) => `<button type=\"button\" class=\"filter-chip\" onclick=\"setDeclineReason('${esc(reason).replace(/'/g, \"\\\\'\")}', this)\">${esc(reason)}<\u002Fbutton>`).join(\"\")}\n    <\u002Fdiv>\n    <div id=\"declines-table-slot\"><\u002Fdiv>`;\n\n  renderDeclinesTable();\n}\n\nfunction renderDeclinesTable() {\n  let rows = declinesInRange();\n  const q = (declineState.search || \"\").toLowerCase();\n  if (declineState.reason !== \"all\") rows = rows.filter(r => r.t.reason === declineState.reason);\n  if (q) rows = rows.filter(r => (r.t.member + \" \" + r.t.ref + \" \" + r.t.memberId + \" \" + r.run.name + \" \" + r.run.id).toLowerCase().includes(q));\n  rows.sort((a, b) => b.run.date - a.run.date);\n\n  $(\"declines-count-badge\").textContent = fmtNum(rows.length);\n\n  const CAP = 100;\n  const shown = rows.slice(0, CAP);\n  $(\"declines-table-slot\").innerHTML = `\n    <div class=\"table-wrap\">\n      <table class=\"report-table\">\n        <thead><tr>\n          <th>Reference<\u002Fth><th>Member<\u002Fth><th>Payment run<\u002Fth><th>Payment type<\u002Fth>\n          <th class=\"num\">Amount<\u002Fth><th>Decline reason<\u002Fth><th><\u002Fth>\n        <\u002Ftr><\u002Fthead>\n        <tbody>\n          ${shown.map(({ t, run }) => {\n            const pt = typeById(t.type);\n            return `<tr>\n              <td class=\"cell-muted\">${esc(t.ref)}<\u002Ftd>\n              <td class=\"cell-strong\">${esc(t.member)}<div class=\"run-sub\">ID ${esc(t.memberId)}<\u002Fdiv><\u002Ftd>\n              <td><a href=\"#\" onclick=\"showDetail('${run.id}');return false;\" style=\"color:var(--brand-light);text-decoration:none;font-weight:600;\">${esc(run.name)}<\u002Fa><div class=\"run-sub\">${fmtDateShort(run.date)} &middot; ${esc(run.id)}<\u002Fdiv><\u002Ftd>\n              <td><span class=\"type-chip\" style=\"background:${pt.pale};color:${pt.color}\">${esc(pt.label)}<\u002Fspan><\u002Ftd>\n              <td class=\"num cell-amount neg\">${fmtMoney(t.amount)}<\u002Ftd>\n              <td class=\"cell-strong\" style=\"color:var(--danger)\">${esc(t.reason)}<\u002Ftd>\n              <td><button type=\"button\" class=\"filter-chip\" onclick=\"toast('Retry queued for ${esc(t.ref)} (mock)')\">Retry<\u002Fbutton><\u002Ftd>\n            <\u002Ftr>`;\n          }).join(\"\")}\n          ${!shown.length ? `<tr><td colspan=\"7\" style=\"text-align:center;color:var(--text-muted);font-style:italic;padding:18px;\">No declined payments match the current filters. &#127881;<\u002Ftd><\u002Ftr>` : \"\"}\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    ${rows.length > CAP ? `<p class=\"more-note\">Showing first ${CAP} of ${fmtNum(rows.length)} declined payments.<\u002Fp>` : \"\"}`;\n}\n\n/* ═══════════════════════════════════════════════════════════ */\nrenderDashboard();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
