   Query Menu CSS class: SearchContactsClass (without a leading dot).

   Add us-report-expandable for the full-window report button.

/* Query-set selector: a white row with an inset divider above the filters.

  border-bottom: 1px solid var(--iqa-border);
  border-radius: 0;
  background: var(--iqa-surface);
  box-shadow: none;
}
/* Once this query's filters are hidden, its selector meets the table header

.SearchContactsClass [id$="_ContentPanel"]:has(> [id$="_ListerPanel"] > [data-gridid] > [data-us-iqa-filter-region][hidden]) > .ClearFix > [id$="_SelectContainer"]:has(> select[id$="_querySelectDropdown"]) {

}

.SearchContactsClass .us-iqa-filter-toggle {
