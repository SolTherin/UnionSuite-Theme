<!-- Case member card (C4, US-CASE-MEMBER) · Query Template Display, one record:
     the primary party, from their iMIS record. First on Overview's side
     column, because most cases have one member and staff need their details
     at once (owner, 8 October 2026).
     iPart CSS class: us-query-template
       The primary party is changed on the Parties tab's preview
       (Make primary party), not here (owner, 8 October 2026).
     Native title: [[user]] Member. Display in cards / columns: unchecked.
     Header/Footer blank. Rows per page: 1. No results: "No member on this case."

     IQA: Case - Primary Member (proposed): the case's party rows joined
     to Name, filtered on CaseNum, the primary party first (sort on the
     primary flag), so the one row is the primary party. An employer as
     the only party still shows here: blank MemberNumber and MemberType
     leave the line under the name out.

     Fixed fields (the head):
     MemberId (required)     the iMIS ID; filters the details IQA below
     MemberName (required)   name; also the avatar initials
     MemberUrl               the member's record, for View profile (the name is
                             plain text; owner, 9 October 2026)
     MemberLine              "Member 20544 · Full member"; blank collapses
     OtherParties       "Also on this case: Josh Kemp and Northside
                             Distribution." Blank (the usual single-member
                             case) leaves it out, with its link: See all
                             parties opens the Parties tab (the
                             theme's section link, data-us-cco-tab).
     View profile (owner, 8 October 2026): opens the member's contact
     profile (MemberUrl); the name is plain text. It is a heading button
     (owner, 9 October 2026), like the other panels' actions: add
     us-action-cases-view-member to the iPart CSS class; cases.view-member
     reads the URL from data-us-member-url on the card.

     The details (client-configurable): US-FIELD-GROUPS runs Case - Member
     Details on the member's ID (filter ID), and lays the fields out from its
     column names, as the agreement panels do. Suggested columns:
       Alert-Title, Alert-Message, Alert-Tone
                        the membership warning, blank for a financial member:
                        Unfinancial (danger) "Paid to 30 Jun 2026. Check
                        eligibility before providing assistance."; Former
                        member (danger); New member (warning) "Joined 3 Sep
                        2026. Check the new member rules …"
       Contact-Mobile, Contact-Email
       Membership-Paid to, Membership-Joined (no Status field: the warning
                        and the banner already say when standing needs a check)
       Work-Employer, Work-Workplace, Work-Classification, Work-Delegate
     Which iMIS fields mark each membership state is for the owner to confirm. -->
<div class="us-case-member" data-us-case-member data-us-member-url="{#query.MemberUrl}">
  <div class="us-case-member__head">
    <span class="us-avatar us-avatar--md" data-us-avatar-name="{#query.MemberName}" aria-hidden="true"></span>
    <div class="us-case-member__who">
      <p class="us-case-member__name"><span class="us-case-member__name-text">{#query.MemberName}</span></p>
      <p class="us-case-member__meta">{#query.MemberLine}</p>
    </div>
  </div>
  <div class="us-field-groups" data-us-fields-query="$/_i4u_/SandBox/Cases/Case - Member Details" data-us-fields-filter="ID" data-us-fields-value="{#query.MemberId}"></div>
  <p class="us-case-member__others"><span>{#query.OtherParties}</span> <a href="#" data-us-section-link="case:parties" data-us-cco-tab="Parties">See all parties</a></p>
</div>
