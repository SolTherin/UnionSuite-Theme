<!-- Case changes · Query Template Display, one record, the Activity tab's
     Changes section (owner, 9 October 2026: changes out of All activity,
     into a section of their own). The theme's activity feed
     (US-ACTIVITY-FEED) over the Changes source alone: one card per save,
     grouped by broad kind (C31: Case updated, Party added, Staff
     removed …), each field's "old → new" listed when the card opens. Its
     Details view (C27) swaps in the History log, the full record with the
     native Export.
     iPart CSS class: us-activity-details us-tab-panel us-tabset-activity us-tab-changes
     Native title: [[history]] Changes. Display in cards: unchecked.
     Rows per page: 1. Source IQA: any one-row IQA on @url:CaseID that
     returns CaseNum (Get Case Details).

     The Changes IQA is All activity's folder's (see
     Case-All-Activity-Query-Template.html for its columns): Subject the
     broad kind, Summary what it touched, Detail one "Field: old → new" per
     line, CreatedBy who saved it. -->
<div class="us-activity-feed"
  data-us-activity-folder="$/_i4u_/SandBox/Cases/Case Activity"
  data-us-activity-filter="CaseNum" data-us-activity-value="{#query.CaseNum}"
  data-us-activity-days="0" data-us-activity-limit="10" data-us-activity-page="10"
  data-us-activity-load-all data-us-activity-filters-open>
  <ul class="us-activity__sources" hidden>
    <li data-source="changes" data-query="Changes" data-type="change" data-label="Change" data-plural="Changes" data-history="#history"></li>
  </ul>
</div>
