<!-- Case files, newest three (C26) · Query Template Display in the Overview's
     side column, under the member card (owner, 9 October 2026: attachments
     on the main tab; a statement or letter that has just come in is wanted
     at once). The theme's attachment row (US-ATTACHMENTS), compact: the
     name, who added it and when, and View and Download; no tags and no
     Edit (those stay on the Attachments tab). In the iPart's Footer, View all
     attachments (N) opens the Attachments tab (owner, 9 October 2026) through
     the theme's section link, as See all parties opens its tab.
     iPart CSS class: us-case-attachments-recent
       Section preset (sectionPresets in zUnionSuite.js, 20 October 2026), standing in for
       us-query-template us-attachments us-action-cases-add-attachment
       (Upload in the heading)
     Native title: Attachments. Display in cards / columns: unchecked. Header blank;
     Footer below.
     Rows per page: 3, no pager. No results (C13, paste as HTML):
       <div class="us-placeholder us-placeholder--compact"><span class="us-placeholder__icon" aria-hidden="true"><i class="ti ti-paperclip"></i></span><h3>No attachments yet</h3><p>Upload statements, letters and other documents.</p><button type="button" class="us-action-cases-add-attachment"></button></div>

     IQA: the case's CloudFiles IQA (as Activity › Attachments), sorted by
     CreatedOn descending, limited to the first 3 results.

     Footer (paste as HTML): the count comes from its own one-row IQA
     through US-QUERY-VALUE (owner, 20 October 2026), not a column on every
     row. It reloads after an upload in place, and stays hidden with no files.
       <div class="us-query-footer" hidden data-us-value-query="$/_i4u_/Client/Cases/Layouts/API - Manage Case - Attachment Count" data-us-value-filter="CaseNum" data-us-value-hide-zero><a class="us-query-footer__link" href="#attachments" data-us-section-link="case:attachments" data-us-cco-tab="Attachments">View all attachments<span>(<span data-us-value-column="AttachmentCount"></span>)</span></a></div>
     Count IQA ($/_i4u_/Client/Cases/Layouts/API - Manage Case - Attachment Count): the case's attachments, filtered on
     the case ordinal with the prompt CaseNum; one display column,
     AttachmentCount, the Ordinal column with the Count aggregate.

     Fields (the Attachments template's, less the tags):
     Ordinal (required)      file ordinal (view and download)
     UniqueID (required)     SharePoint unique ID
     EntityCode (required)   SharePoint branch
     FileName (required)     display name
     CreatedBy               uploader name
     CreatedOn               upload date
     AccessClass             "restricted" for a sensitive document, else blank
                             (C33): its actions stay locked behind Unlock,
                             which checks access through /cases/attachment-access -->
<div class="us-attachment us-case-attachment" data-ordinal="{#query.Ordinal}" data-us-attachment-access="{#query.AccessClass}" data-us-file-id="{#query.UniqueID}" data-us-file-branch="{#query.EntityCode}"
  data-us-file-name="{#query.FileName}">
  <span class="us-attachment__file" aria-hidden="true"><i class="ti ti-file-text"></i></span>
  <div class="us-attachment__copy">
    <span class="us-attachment__name">{#query.FileName}</span>
    <p class="us-attachment__meta"><span>{#query.CreatedBy}</span><span>{#query.CreatedOn}</span></p>
  </div>
  <div class="us-attachment__actions">
    <button type="button" class="us-action-agreements-view-attachment" data-ordinal="{#query.Ordinal}">View</button>
    <button type="button" class="us-action-agreements-download-attachment" data-ordinal="{#query.Ordinal}">Download</button>
  </div>
</div>
