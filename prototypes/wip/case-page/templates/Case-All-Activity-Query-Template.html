<!-- Case all activity · Query Template Display, one record, on the Activity
     tab's All activity section: the case's whole timeline (owner, 8 October
     2026: "full activity should be on the activity tab"). The template is the
     theme's activity feed (US-ACTIVITY-FEED): notes, emails in and out,
     meetings and files, newest first, with the type filters,
     the timeframe (All time first: a case is short and its whole story
     matters), Show more and Load all.
     iPart CSS class: us-case-all-activity
       Section preset (sectionPresets in zUnionSuite.js, 21 October 2026), standing in for
       us-action-cases-add-note us-action-cases-add-meeting us-action-cases-add-attachment
       us-activity-details us-tab-panel us-tabset-activity us-tab-all
       The heading's add button follows the chosen type (owner, 9 October
       2026): Add note for Notes, Add meeting for Meetings, Upload for
       Files, none for All and Emails, and none while a Details view shows
       (the detailed list has its own).
     Native title: [[activity]] All activity. Display in cards: unchecked.
     Rows per page: 1. Source IQA: any one-row IQA on @url:CaseID that
     returns the case's Ordinal, unaliased (Get Case Details;
     owner, 21 October 2026). The feed sends it as the CaseNum filter.

     The feed runs one IQA per source in the base folder below, each
     filtered on CaseNum and on the feed's StartDate (sent unless All time),
     with the feed's fixed columns (ActivityKey, ActivityDate, Subject or
     Summary; optional Detail, CreatedBy, Priority, Category, RecordUrl,
     Direction, FollowUpRequired, FollowUpDate, FollowUpActioned,
     FollowUpNotes). data-details on a source names a second IQA in the
     details folder (the client's), run for one record when its card opens
     (filtered on CaseNum and ActivityKey); each Additional-* column it
     returns is a labelled line in the card's expanded view. Every IQA's
     requirements: Activity-Feed-IQA-Build.md (owner, 21 October 2026).

     Details view (C27; owner, 9 October 2026, comparison option 2): the
     feed's iPart carries us-activity-details. data-history="#<key>" on a
     source gives its type a Details view toggle at the end of the type
     filters (US-ACTIVITY-FEED), which swaps the timeline for the
     detailed iPart marked us-activity-detail-<key>: Notes and Meetings.
     Changes are their own section, apart from the timeline (owner,
     9 and 25 October 2026): the guide's change history (#change-history),
     not a feed. Emails and files have none:
     the email's card holds everything, and files have their own section.

     Sources:
       Notes        type note. Restricted notes are included, with "Restricted"
                    as the Summary (data-restricted="Restricted"): the card
                    shows the notes screen's restricted notice and Show note
                    (C29). ActivityKey is the note ordinal.
                    A note marked follow-up (converted to a task) returns
                    FollowUpRequired, FollowUpDate and FollowUpActioned, and
                    shows the theme's follow-up badge. Tasks are notes with a
                    follow-up (owner, 9 October 2026), so they are here too:
                    no Tasks source.
       Notes Details   Additional-Staff, Additional-Members: who the note is
                    assigned to; blank lines are left out.
       Emails Sent  type email, always outgoing: sent from iMIS through the
                    case send page and linked to the case in
                    i4u_UT_Cases_Communications, as agreement emails are.
                    The card is the agreement Communications panel's
                    (owner, 21 October 2026): the audience, the subject
                    without its tag, "4 recipients · 4 sent", and opened,
                    the full subject and the send's results and recipients
                    (data-comms-recipients: the agreement's details IQA,
                    which only needs the CommunicationLogKey).
       Emails Logged   type email: attached to the case through the Outlook
                    plugin, either direction, so each row's Direction says
                    which (from the sender's domain). View and Download open
                    the stored email as an attachment's do
                    (data-record-actions and the Data-us-file-* columns;
                    owner, 21 October 2026). Duplicates of sent emails are
                    fine.
       Emails Sent Details, Emails Logged Details   Additional-From,
                    Additional-To, Additional-Cc (and Additional-Bcc).
       Meetings     type meeting; Detail is the description (headed
                    Description). Meetings Details: Additional-Location,
                    Additional-Attendees.
       Attachments  type attachment (C26): Subject the file name, Summary
                    its tags; View and Download, as Emails Logged.
     View all attachments (C36; owner, 9 October 2026): with Attachments
     chosen, the heading shows View all attachments beside Upload, opening
     the Attachments tab (data-section-link, -tab and -label on the source).
     Proposed IQAs (not built): Notes, Emails Sent, Emails Logged, Meetings
     and Attachments (base), and Notes, Emails Sent, Emails Logged
     and Meetings Details (details); Activity-Feed-IQA-Build.md. -->
<div class="us-activity-feed"
  data-us-activity-folder="$/_i4u_/Core/Cases/Layouts v2/Activity Feed - Base"
  data-us-activity-details-folder="$/_i4u_/Client/Cases - UnionSuite/Layouts/Activity Feed - Details"
  data-us-activity-filter="CaseNum" data-us-activity-value="{#query.Ordinal}"
  data-us-activity-days="0" data-us-activity-limit="10" data-us-activity-page="10"
  data-us-activity-load-all data-us-activity-filters-open>
  <ul class="us-activity__sources" hidden>
    <li data-source="notes" data-query="Notes" data-details="Notes Details" data-type="note" data-history="#notes" data-restricted="Restricted" data-record-popup="true"></li>
    <li data-source="emails-sent" data-query="Emails Sent" data-details="Emails Sent Details" data-type="email" data-direction="out" data-comms-recipients="$/_i4u_/Core/CA/v2/API - Manage Agreement - Communications - Details"></li>
    <li data-source="emails-logged" data-query="Emails Logged" data-details="Emails Logged Details" data-type="email" data-record-actions="agreements.view-attachment agreements.download-attachment"></li>
    <li data-source="meetings" data-query="Meetings" data-details="Meetings Details" data-detail-label="Description" data-type="meeting" data-history="#meetings" data-record-popup="true"></li>
    <li data-source="attachments" data-query="Attachments" data-type="attachment" data-record-actions="agreements.view-attachment agreements.download-attachment" data-label="Attachment added" data-plural="Attachments" data-section-link="case:attachments" data-section-tab="Attachments" data-section-label="View all attachments"></li>
  </ul>
</div>
