<!-- Agreement meetings · Query Template Display on the existing Meetings IQA.
     IQA fix needed: it has no filter, so it lists every agreement's meetings.
     Add AgreementOrdinal Equal @url:AgreementNum (URL parameter).
     iPart CSS class: us-agreement-meetings (add us-panel-fill when it shares a row)
       Section preset in zUnionSuite.js, standing in for
       us-query-template us-meetings us-task-completed-filter us-task-progress us-list-scroll us-action-agreements-add-meeting
     Native title: Meetings. Display in cards / columns: unchecked. Header blank.
     Footer: blank. The theme adds the card footer with the results line
     (us-task-progress); an existing <div class="us-query-footer"><span
     data-us-task-summary></span></div> is harmless and stays hidden.
     (as on Tasks: us-task-progress shows "x upcoming" in the heading and
     keeps the footer summary for screen readers only).
     Rows per page: 30. No results: "No meetings scheduled."

     Fields (aliases from the current template):
     Ordinal (required)      meeting ordinal; the pencil (agreements.edit-meeting)
                             opens the meeting (owner, 7 October 2026: the
                             title is plain text)
     Date-ISO (required)     yyyy-MM-dd; past meetings are worked out from it
                             and hidden until "Show past meetings"
     Date-Month (required)   short month (Aug)
     Date-Day (required)     day of month (4)
     MeetingType (required)  first half of the title (General, Hearing …)
     Matter (required)       second half of the title (EADispute …)
     Date-Time               time text; blank hides it
     Location                location or link text; blank hides it

     No Upcoming badge (owner, 3 October 2026): the list shows upcoming
     meetings by default, so the tag said nothing. The IQA's MeetingBadge
     column is no longer used and can be dropped. -->
<div class="us-meeting" data-us-meeting-date="{#query.Date-ISO}" data-us-search="{#query.MeetingType} {#query.Matter} {#query.Location}">
  <span class="us-meeting__tile" aria-hidden="true">
    <span class="us-meeting__month">{#query.Date-Month}</span>
    <span class="us-meeting__day">{#query.Date-Day}</span>
  </span>
  <span class="us-meeting__copy">
    <span class="us-meeting__title">{#query.MeetingType} – {#query.Matter}</span>
    <span class="us-meeting__meta">
      <span>{#query.Date-Time}</span>
      <span>{#query.Location}</span>
    </span>
  </span>
  <button type="button" class="us-action-agreements-edit-meeting" data-ordinal="{#query.Ordinal}"></button>
</div>
