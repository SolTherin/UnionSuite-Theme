<!-- Agreement terms and clauses · Query Template Display on the existing Terms
     IQA, as expandable rows (decided 4 October 2026: option 7 of
     terms-compare.html; theme block US-TERMS in zUnionSuite.css and .js).
     Closed: the status icon in its own column, the term with its status and
     amount under it ("Included · 17.5%"), the category in its column, a
     chevron. Open (click the row, or Enter on it): the description, and Edit
     and Delete at the bottom right. The row slides open and closed; a click anywhere on an open
     row closes it. Clicking the status icon opens a status menu instead.

     iPart CSS class: us-agreement-terms
       Section preset in zUnionSuite.js, standing in for
       us-query-template us-terms us-query-search us-list-scroll
       us-action-agreements-remove-terms us-action-agreements-add-term
       (heading: filter, Bulk remove, Add term). Add us-panel-fill when the
       panel shares a row.
     Native title: [[file-text]] Terms and clauses covered
     Display in cards: unchecked. Display in columns: unchecked.
     Header/Footer blank. Rows per page: 30. No results: "No terms recorded."
     IQA sort: Term.

     Status, from the icon: a menu of Negotiating, Included and Not Included.
     The change shows at once; Included plays the completion confetti. The
     save is a hook, UnionSuiteTermStatus.defineSaver(async ({ordinal, status,
     label}) => …). The saver (owner, 6 October 2026, in
     Scripts/ActionDefinitions.js) posts {"TermID": Ordinal, "Action":
     "Negotiating" | "Included" | "Not Included"} to CloudToolz
     /ca/quick-edit-term, as complete-task is called; a failed save reverts
     the change and the row says "Not saved". Status quick filters (chips in the funnel disclosure, the
     count beside the title) appear when the list has two or more statuses.

     Actions in the open row (no View: it opened the same popup as Edit,
     owner 5 October 2026):
     Edit    agreements.edit-term, the existing Add-or-Update-Term popup
     Delete  agreements.delete-term (owner, 6 October 2026), the bin: asks
             "Delete this term?", posts {"TermID": Ordinal} to CloudToolz
             /ca/quick-delete-term (as the status quick edit is saved), then
             the row's words fly into the bin (US-TERM-DELETE, the word
             vacuum; skipped with reduced motion) and the list refreshes. The heading's Bulk remove keeps
             Delete_Terms.aspx, the checkbox form for several terms.

     Fields (the existing Terms IQA, unchanged):
     Ordinal (required)      term ordinal: each action and the status save
     Term (required)         term title
     Category                category, in its column; blank leaves it empty
     StatusClass             included | negotiating | not-included; the icon and colour
     StatusLabel             Included | Negotiating | Not Included
     Amount                  amount with its unit, as text (17.5%, $4.20 per shift,
                             4 weeks), after the status on the row's second line
                             (owner, 4 October 2026); blank leaves it out.
                             The live IQA gives a bare number (12.00); add the unit
     Comment                 description, in the open row; blank collapses -->
<details class="us-term" data-us-term-status="{#query.StatusClass}" data-us-term-category="{#query.Category}"
  data-us-term-ordinal="{#query.Ordinal}" data-us-search="{#query.Term} {#query.Category} {#query.StatusLabel} {#query.Comment}">
  <summary class="us-term__row">
    <button type="button" class="us-term__status-button" aria-haspopup="menu" aria-expanded="false" aria-label="Change status" title="Change status"></button>
    <div class="us-term__main">
      <h3 class="us-term__title">{#query.Term}</h3>
      <p class="us-term__meta"><span class="us-badge us-term-status us-term__status" data-us-term-status="{#query.StatusClass}">{#query.StatusLabel}</span><span class="us-term__amount">{#query.Amount}</span></p>
    </div>
    <span class="us-term__category">{#query.Category}</span>
    <span class="us-term__chevron" aria-hidden="true"></span>
  </summary>
  <div class="us-term__detail">
    <p class="us-term__comment">{#query.Comment}</p>
    <p class="us-term__actions">
      <button type="button" class="us-term__edit us-action-agreements-edit-term" data-ordinal="{#query.Ordinal}">Edit term</button>
      <button type="button" class="us-term__delete us-action-agreements-delete-term" data-ordinal="{#query.Ordinal}">Delete term</button>
    </p>
  </div>
</details>
