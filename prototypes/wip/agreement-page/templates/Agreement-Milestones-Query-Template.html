<!-- Agreement milestones · Query Template Display on the existing Milestones IQA
     ("Query Template - Manage Agreement - Milestones").
     Milestones are the broad stages of the agreement's lifecycle, set up
     without a date (owner, 6 October 2026; milestones-compare.html option 6,
     in the theme 7 October 2026).
     iPart CSS class: us-agreement-milestones (add us-panel-fill when it shares a row)
       Section preset in zUnionSuite.js, standing in for
       us-query-template us-milestones us-milestones--bar us-milestones--reorder
       us-task-completed-filter us-task-progress us-action-agreements-add-milestone
     Native title: Milestones. Display in cards / columns: unchecked. Header blank.
     Footer: blank. The theme adds the card footer with the results line
     (us-task-progress); an existing <div class="us-query-footer"><span
     data-us-task-summary></span></div> is harmless and stays hidden.
     (as on Tasks: us-task-progress shows "x of y complete" in the heading and
     keeps the footer summary for screen readers only).
     Rows per page: 30 (the progress bar shows the rows on the page).
     No results: "No milestones yet."

     Fields:
     Ordinal (required)      note ordinal; saves the status and the order, and
                             edits the milestone
     Note (required)         milestone (stage) name
     TaskStatus (required)   Not Complete | In Progress | Complete; the icon shows
                             it, the words say it and the status menu saves it

     IQA change needed: a Sequence number on each milestone, the IQA sorted by
     Sequence then Ordinal, so the list comes back in the saved order (a
     milestone without one sorts last). The template does not show it: the
     order of the rows is the order. Deadline is no longer used and can be
     dropped from the IQA.

     The theme builds the progress bar from these rows (US-MILESTONES). The
     status icon opens the status menu; choosing Complete plays the task
     completion effect, saves through CloudToolz /ca/complete-task, and the
     row slides out. The pencil (agreements.edit-milestone) opens the
     milestone in NoteDetails. The heading's Reorder toggle
     (US-MILESTONE-ORDER) saves the order through the proposed CloudToolz
     /ca/reorder-milestones (not built yet). -->
<div class="us-milestone" data-us-milestone-status="{#query.TaskStatus}" data-us-milestone-ordinal="{#query.Ordinal}"
  data-us-search="{#query.Note}">
  <button type="button" class="us-milestone__status-button" aria-haspopup="menu" aria-expanded="false"
    aria-label="Status: {#query.TaskStatus}. Change status" title="Change status"></button>
  <span class="us-milestone__copy">
    <span class="us-milestone__title">{#query.Note}</span>
    <span class="us-milestone__meta">
      <span class="us-milestone__state" data-us-milestone-status="{#query.TaskStatus}">{#query.TaskStatus}</span>
    </span>
  </span>
  <button type="button" class="us-action-agreements-edit-milestone" data-ordinal="{#query.Ordinal}"></button>
</div>
