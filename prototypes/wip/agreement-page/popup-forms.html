<!doctype html>
<!--
  Agreement popup forms: mock-ups for the shared Zidebar Add Note form
  (/_i4u_/Core/Zidebar/Add-Note-New.aspx), one per Type:
    note            Add note
    task            Add task
    attachmentonly  Add attachment
  Milestone (Type=milestone) waits on its field list.

  Mock-up only (owner, 19 October 2026): the real forms are BeyondFormz /
  HubForms pages in the theme's popup. Tags, subtags, file tags and staff
  are sample values. Uses the theme's tokens, switch and icons; the form
  layout itself is page CSS below. Serve the project root (static-node) and
  open this page; ?type=note|task|attachmentonly picks the form.
-->
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agreement Popup Forms</title>
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Guides/usage/vendor/10-UltraWaveResponsive.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/99-Orion.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/zUnionSuite.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/Tabler/tabler-icons.min.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Client/Branding.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Client/Override.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/zzDarkMode.css">
  <style>
    /* Mock-up page layout. */
    body.pm-page {
      margin: 0;
      background: var(--bg-page);
      color: var(--text-base);
      font: 14px/1.5 var(--font-ui);
    }

    .pm-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
    }

    .pm-toolbar h1 {
      margin: 0 var(--space-3) 0 0;
      color: var(--text-strong);
      font-size: 15px;
      font-weight: 700;
    }

    .pm-segmented {
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      background: var(--bg-sunken);
      border-radius: var(--radius);
    }

    .pm-segmented button {
      padding: 5px 12px;
      border: 0;
      border-radius: calc(var(--radius) - 2px);
      background: transparent;
      color: var(--text-base);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 150ms, color 150ms;
    }

    .pm-segmented button[aria-pressed="true"] {
      background: var(--bg-surface);
      color: var(--text-strong);
      box-shadow: 0 1px 2px rgb(0 0 0 / .08);
    }

    .pm-stage {
      display: grid;
      grid-template-columns: minmax(0, 800px) minmax(240px, 340px);
      justify-content: center;
      gap: var(--space-6);
      padding: var(--space-6) var(--space-4) var(--space-8);
    }

    .pm-stage[data-width="narrow"] {
      grid-template-columns: 375px minmax(240px, 340px);
    }

    @media (max-width: 950px) {
      .pm-stage,
      .pm-stage[data-width="narrow"] {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* The theme's popup frame, drawn statically. */
    .pm-popup {
      display: flex;
      flex-direction: column;
      min-height: 560px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 40px rgb(15 23 42 / .18);
    }

    .pm-popup__head {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-4) var(--space-5);
      border-bottom: 1px solid var(--border);
    }

    .pm-popup__title {
      margin: 0;
      color: var(--text-strong);
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
    }

    .pm-popup__context {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    .pm-icon-button {
      display: inline-grid;
      place-items: center;
      width: 32px;
      height: 32px;
      margin-inline-start: auto;
      padding: 0;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pm-icon-button:hover {
      background: var(--bg-sunken);
      color: var(--text-strong);
    }

    .pm-popup__body {
      display: grid;
      gap: var(--space-5);
      padding: var(--space-5);
      flex: 1;
    }

    .pm-popup__foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-3) var(--space-5);
      background: var(--bg-subtle);
      border-top: 1px solid var(--border);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    .pm-popup__hint {
      margin-inline-end: auto;
      color: var(--text-muted);
      font-size: 12px;
    }

    .pm-popup__hint kbd {
      padding: 1px 5px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      font: inherit;
      font-size: 11px;
    }

    .pm-button {
      min-height: 36px;
      padding: 0 16px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg-surface);
      color: var(--text-strong);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .pm-button--primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--text-on-accent);
    }

    .pm-button--primary:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    /* Fields. */
    .pm-field {
      display: grid;
      align-content: start;
      gap: 6px;
      min-width: 0;
    }

    /* As the composer's date field: the browser's icon, not 99-Orion's grey box. */
    .pm-input[type="date"]::-webkit-calendar-picker-indicator {
      margin-inline-start: 4px;
      padding: 2px;
      border: 0;
      border-radius: 3px;
      background-color: transparent;
      opacity: .6;
      cursor: pointer;
      filter: none;
    }

    .pm-input[type="date"]::-webkit-calendar-picker-indicator:hover {
      background-color: var(--bg-sunken);
      opacity: 1;
    }

    .pm-label {
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 600;
    }

    .pm-label .pm-required {
      color: var(--danger);
    }

    .pm-label .pm-optional {
      margin-inline-start: 4px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .pm-help {
      margin: 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .pm-error {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 600;
    }

    .pm-input,
    .pm-textarea,
    .pm-multi__control {
      width: 100%;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg-surface);
      color: var(--text-strong);
      font: inherit;
      box-sizing: border-box;
      transition: border-color 150ms, box-shadow 150ms;
    }

    .pm-textarea {
      min-height: 132px;
      resize: vertical;
      line-height: 1.55;
    }

    .pm-input:focus,
    .pm-textarea:focus,
    .pm-multi__control:focus-visible {
      outline: 0;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--border-focus) 20%, transparent);
    }

    .pm-field[data-invalid] :is(.pm-textarea, .pm-input, .pm-drop) {
      border-color: var(--danger);
    }

    .pm-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-4);
    }

    .pm-stage[data-width="narrow"] .pm-row {
      grid-template-columns: minmax(0, 1fr);
    }

    @media (max-width: 560px) {
      .pm-row {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* Revealed groups slide open. */
    .pm-reveal {
      display: grid;
      grid-template-rows: 1fr;
      transition: grid-template-rows 220ms cubic-bezier(.2, 0, 0, 1), opacity 180ms;
    }

    .pm-reveal > * {
      min-height: 0;
      overflow: hidden;
    }

    .pm-reveal[data-closed] {
      grid-template-rows: 0fr;
      opacity: 0;
    }

    /* Once open, let dropdowns inside spill out of the section. */
    .pm-reveal[data-settled] > * {
      overflow: visible;
    }

    @media (prefers-reduced-motion: reduce) {
      .pm-reveal {
        transition: none;
      }
    }

    /* Multi-select: chips in the control, a checklist under it. */
    .pm-multi {
      position: relative;
    }

    .pm-multi__control {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding-inline-end: 32px;
      text-align: start;
      cursor: pointer;
    }

    .pm-multi__control::after {
      content: '\ea5f';
      position: absolute;
      top: 10px;
      right: 10px;
      color: var(--text-muted);
      font-family: 'tabler-icons';
      font-size: 16px;
      line-height: 1;
      transition: transform 180ms;
    }

    .pm-multi[data-open] .pm-multi__control::after {
      transform: rotate(180deg);
    }

    .pm-multi__placeholder {
      color: var(--text-muted);
    }

    .pm-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      max-width: 100%;
      padding: 1px 4px 1px 8px;
      border-radius: var(--radius-pill);
      background: var(--bg-sunken);
      color: var(--text-strong);
      font-size: 12px;
      font-weight: 600;
    }

    .pm-chip__parent {
      color: var(--text-muted);
      font-weight: 400;
    }

    .pm-chip__remove {
      display: inline-grid;
      place-items: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .pm-chip__remove:hover {
      background: var(--border);
      color: var(--text-strong);
    }

    .pm-multi__panel {
      position: absolute;
      z-index: 5;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 260px;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 6px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgb(15 23 42 / .14);
    }

    .pm-multi__search {
      width: 100%;
      margin-bottom: 4px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-strong);
      font: inherit;
      box-sizing: border-box;
    }

    .pm-multi__group {
      margin: 6px 8px 2px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .pm-multi__option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      color: var(--text-strong);
      cursor: pointer;
    }

    .pm-multi__option:hover {
      background: var(--bg-sunken);
    }

    .pm-multi__option input {
      accent-color: var(--border-focus);
    }

    /* Attachments. */
    .pm-drop {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px dashed var(--border-strong);
      border-radius: var(--radius);
      background: var(--bg-subtle);
      color: var(--text-base);
      cursor: pointer;
      transition: border-color 150ms, background-color 150ms;
    }

    .pm-drop:hover,
    .pm-drop[data-over] {
      border-color: var(--border-focus);
      background: color-mix(in srgb, var(--border-focus) 6%, var(--bg-surface));
    }

    .pm-drop .ti {
      color: var(--text-muted);
      font-size: 20px;
    }

    .pm-drop__browse {
      color: var(--text-link);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: .2em;
    }

    .pm-drop__limit {
      margin-inline-start: auto;
      color: var(--text-muted);
      font-size: 12px;
    }

    .pm-drop--large {
      flex-direction: column;
      justify-content: center;
      min-height: 150px;
      text-align: center;
    }

    .pm-drop--large .ti {
      font-size: 28px;
    }

    .pm-drop--large .pm-drop__limit {
      margin: 0;
    }

    .pm-files {
      display: grid;
      gap: 4px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .pm-file {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 6px 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .pm-file .ti-file-text {
      color: var(--text-muted);
      font-size: 18px;
    }

    .pm-file__name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      color: var(--text-strong);
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pm-file__size {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* Follow up: a switch, then its fields in a sunken group. */
    .pm-section-title {
      margin: 0;
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 600;
    }

    .pm-subgroup {
      display: grid;
      gap: var(--space-4);
      margin-top: var(--space-2);
      padding: var(--space-4);
      border-radius: var(--radius);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    /* Follow-up fields: High priority under Assign to, beside the
       deadline and its quick dates, so the columns end level. One column
       when narrow: assign, deadline, then priority. */
    .pm-followup {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-areas:
        "assign deadline"
        "priority deadline";
      column-gap: var(--space-4);
      row-gap: var(--space-3);
      align-items: start;
    }

    .pm-followup__assign {
      grid-area: assign;
    }

    .pm-followup__deadline {
      grid-area: deadline;
    }

    .pm-followup__priority {
      grid-area: priority;
    }

    .pm-stage[data-width="narrow"] .pm-followup {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "assign"
        "deadline"
        "priority";
      row-gap: var(--space-4);
    }

    @media (max-width: 560px) {
      .pm-followup {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "assign"
          "deadline"
          "priority";
        row-gap: var(--space-4);
      }
    }

    .pm-quick {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .pm-quick button {
      padding: 2px 9px;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      background: var(--bg-surface);
      color: var(--text-base);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .pm-quick .pm-quick__clear {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      border-style: dashed;
      color: var(--text-muted);
    }

    .pm-quick .pm-quick__clear .ti {
      font-size: 12px;
    }

    .pm-quick button:hover {
      border-color: var(--border-focus);
      color: var(--text-strong);
    }

    /* Sized to its contents, so only the box and its label check it. */
    .pm-check {
      display: inline-flex;
      justify-self: start;
      align-items: center;
      gap: 8px;
      color: var(--text-strong);
      font-weight: 600;
      cursor: pointer;
    }

    .pm-check input {
      width: 16px;
      height: 16px;
      accent-color: var(--border-focus);
    }

    .pm-check .ti-flag {
      color: var(--danger);
    }

    .pm-divider {
      height: 1px;
      margin: 0;
      border: 0;
      background: var(--border);
    }

    /* Design notes beside the popup. */
    .pm-notes {
      align-self: start;
      padding: var(--space-4) var(--space-5);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 13px;
    }

    .pm-notes h2 {
      margin: 0 0 var(--space-2);
      color: var(--text-strong);
      font-size: 14px;
      font-weight: 700;
    }

    .pm-notes ol,
    .pm-notes ul {
      margin: 0 0 var(--space-3);
      padding-inline-start: 18px;
    }

    .pm-notes li + li {
      margin-top: 6px;
    }

    .pm-notes strong {
      color: var(--text-strong);
    }

    .pm-notes .pm-assume {
      margin: var(--space-3) 0 0;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius);
      background: var(--warning-bg);
      color: var(--text-strong);
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body class="pm-page">
  <div class="pm-toolbar">
    <h1>Agreement popup forms</h1>
    <div class="pm-segmented" role="group" aria-label="Form" data-control="type">
      <button type="button" data-value="note">Add note</button>
      <button type="button" data-value="task">Add task</button>
      <button type="button" data-value="attachmentonly">Add attachment</button>
    </div>
    <div class="pm-segmented" role="group" aria-label="Popup width" data-control="width">
      <button type="button" data-value="wide">800px</button>
      <button type="button" data-value="narrow">Phone</button>
    </div>
    <div class="pm-segmented" role="group" aria-label="Appearance" data-control="mode">
      <button type="button" data-value="light">Light</button>
      <button type="button" data-value="dark">Dark</button>
    </div>
  </div>

  <main class="pm-stage" id="stage">
    <section class="pm-popup" aria-labelledby="pm-title">
      <header class="pm-popup__head">
        <div>
          <h2 class="pm-popup__title" id="pm-title">Add note</h2>
          <p class="pm-popup__context">A107 · Collective Bargaining – Stark Industries</p>
        </div>
        <button type="button" class="pm-icon-button" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button>
      </header>

      <form class="pm-popup__body" id="form" novalidate>
        <!-- Attachment only: the files lead. -->
        <div class="pm-field" data-for="attachmentonly" data-key="files-first"></div>

        <!-- 1. The note (task text for a task; a description for files). -->
        <div class="pm-field" data-key="note">
          <label class="pm-label" for="note"><span data-text="note-label">Note</span> <span class="pm-required" data-text="note-required">*</span><span class="pm-optional" data-text="note-optional" hidden>(optional)</span></label>
          <textarea class="pm-textarea" id="note" data-text-placeholder="note-placeholder"></textarea>
          <p class="pm-error" id="note-error" hidden><i class="ti ti-alert-circle" aria-hidden="true"></i> <span data-text="note-error">Write the note before saving.</span></p>
        </div>

        <!-- Task: who and when sit straight under the task. -->
        <div data-for="task" data-key="task-details"></div>

        <!-- 2. Tags, then subtags of the chosen tags. -->
        <div class="pm-row">
          <div class="pm-field">
            <span class="pm-label" id="tags-label">Tags <span class="pm-optional">(optional)</span></span>
            <div class="pm-multi" data-multi="tags" aria-labelledby="tags-label"></div>
          </div>
          <div class="pm-reveal" id="subtags-reveal" data-closed>
            <div>
              <div class="pm-field">
                <span class="pm-label" id="subtags-label">Subtags <span class="pm-optional">(optional)</span></span>
                <div class="pm-multi" data-multi="subtags" aria-labelledby="subtags-label"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. Attachments: always there, one line until files are added. -->
        <div class="pm-field" data-not-for="attachmentonly" data-key="files"></div>

        <!-- 4. Follow up (note only): a switch revealing its fields. -->
        <div data-for="note">
          <hr class="pm-divider">
          <label class="us-switch">
            <input type="checkbox" id="followup">
            <span class="us-switch__track" aria-hidden="true"></span>
            <span>Follow up required</span>
          </label>
          <div class="pm-reveal" id="followup-reveal" data-closed>
            <div data-key="followup-details"></div>
          </div>
        </div>
      </form>

      <footer class="pm-popup__foot">
        <span class="pm-popup__hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> to save</span>
        <button type="button" class="pm-button">Cancel</button>
        <button type="submit" form="form" class="pm-button pm-button--primary" id="save">Save note</button>
      </footer>
    </section>

    <aside class="pm-notes" id="notes"></aside>
  </main>

  <!-- The follow-up / task fields, shared by Add note and Add task. -->
  <template id="tpl-followup">
    <div class="pm-subgroup pm-followup">
        <div class="pm-field pm-followup__assign">
          <span class="pm-label" id="assign-label">Assign to</span>
          <div class="pm-multi" data-multi="assign" data-single aria-labelledby="assign-label"></div>
        </div>
        <div class="pm-field pm-followup__deadline">
          <label class="pm-label" for="deadline"><span data-text="deadline-label">Deadline</span> <span class="pm-optional">(optional)</span></label>
          <input class="pm-input" type="date" id="deadline">
          <div class="pm-quick" aria-label="Quick dates">
            <button type="button" data-days="1">Tomorrow</button>
            <button type="button" data-days="7">In a week</button>
            <button type="button" data-days="14">In 2 weeks</button>
            <button type="button" class="pm-quick__clear" data-clear hidden><i class="ti ti-x" aria-hidden="true"></i> Clear date</button>
          </div>
        </div>
      <label class="pm-check pm-followup__priority"><input type="checkbox"> <i class="ti ti-flag" aria-hidden="true"></i> High priority</label>
    </div>
  </template>

  <!-- The attachment field, compact (notes, tasks) or large (attachment only). -->
  <template id="tpl-files">
    <span class="pm-label" id="files-label"><span data-text="files-label">Attachments</span> <span class="pm-optional" data-text="files-optional">(optional)</span><span class="pm-required" data-text="files-required" hidden>*</span></span>
    <label class="pm-drop" aria-labelledby="files-label">
      <input type="file" multiple hidden>
      <i class="ti ti-upload" aria-hidden="true"></i>
      <span>Drop files here or <span class="pm-drop__browse">choose files</span></span>
      <span class="pm-drop__limit">Up to 20 MB each</span>
    </label>
    <p class="pm-error" data-files-error hidden><i class="ti ti-alert-circle" aria-hidden="true"></i> Add at least one file.</p>
    <ul class="pm-files" aria-label="Files to upload"></ul>
    <div class="pm-reveal" data-files-tags data-closed>
      <div>
        <div class="pm-field" style="padding-top: 6px">
          <span class="pm-label" id="filetags-label">File tags <span class="pm-optional">(apply to every file above)</span></span>
          <div class="pm-multi" data-multi="filetags" aria-labelledby="filetags-label"></div>
        </div>
      </div>
    </div>
  </template>

  <script>
  (function () {
    'use strict';

    // Sample values. The real lists come from the tag and staff tables.
    const TAGS = {
      'Bargaining': ['Log of claims', 'Bargaining meeting', 'Offer received', 'Ballot'],
      'Wages & allowances': ['Pay rise', 'Allowances', 'Back pay'],
      'Leave': ['Annual leave', 'Personal leave', 'Parental leave'],
      'Hours & rostering': ['Overtime', 'Rosters', 'Breaks'],
      'Health & safety': ['Incident', 'Hazard', 'Fatigue'],
      'Dispute': ['Fair Work application', 'Conciliation', 'Internal grievance']
    };
    const FILE_TAGS = ['Agreement draft', 'Correspondence', 'Log of claims', 'Minutes', 'Offer', 'Evidence'];
    const STAFF = ["James Driscoll (me)", "Mary O'Conner", 'Priya Nair', 'Sam Whitfield', 'Lena Kovac'];
    const SAMPLE_FILES = [
      {name: 'Survey Responses.pdf', size: '15 KB'},
      {name: 'Stark Industries – offer 2.docx', size: '84 KB'}
    ];

    const COPY = {
      note: {
        title: 'Add note', save: 'Save note',
        'note-label': 'Note', 'note-placeholder': 'What happened, what was said or agreed…',
        'note-error': 'Write the note before saving.'
      },
      task: {
        title: 'Add task', save: 'Save task',
        'note-label': 'Task', 'note-placeholder': 'What needs to be done…',
        'note-error': 'Describe the task before saving.', 'deadline-label': 'Due date'
      },
      attachmentonly: {
        title: 'Add attachment', save: 'Upload',
        'note-label': 'Description', 'note-placeholder': 'What these files are (shown with them in the list)…',
        'files-label': 'Files'
      }
    };

    const NOTES = {
      note: `
        <h2>Add note</h2>
        <ol>
          <li><strong>Note first</strong>, focused on open. It is the only required field, so the popup can be typed and saved with nothing else touched (Ctrl+Enter).</li>
          <li><strong>Tags, then subtags beside them.</strong> Subtags slide in once a tag is chosen and list only the chosen tags' subtags, grouped by tag. Removing a tag removes its subtags.</li>
          <li><strong>Attachments always shown, as one dashed line.</strong> No toggle or button to find first: files can be dropped straight on it, and it costs one row when unused. File tags appear only once a file is added.</li>
          <li><strong>Follow up last.</strong> It is a separate decision about what happens next. The switch reveals Assign to, Deadline (with quick dates) and High priority in one sunken group, so they read as belonging to the follow-up.</li>
        </ol>
        <p class="pm-assume"><strong>Decided:</strong> Assign to takes one person (owner, 19 October 2026), from the case staff value list, and starts with you chosen.</p>`,
      task: `
        <h2>Add task</h2>
        <ol>
          <li><strong>The same form</strong> with the follow-up always on: a task is a note with a follow-up, so there is no switch.</li>
          <li><strong>Who and when straight under the task</strong>, before tags: on a task they matter more than its tags. Deadline reads <em>Due date</em>.</li>
          <li>Tags and attachments as on Add note.</li>
        </ol>
        <p class="pm-assume"><strong>To confirm:</strong> that Type=task saves with Follow up required set, and whether Due date should be required for a task.</p>`,
      attachmentonly: `
        <h2>Add attachment</h2>
        <ol>
          <li><strong>Files lead</strong>, as a large drop area, and are the only required field.</li>
          <li><strong>File tags</strong> appear once a file is added and apply to every file in the upload.</li>
          <li><strong>Description is optional</strong> and replaces the note.</li>
          <li><strong>Tags and subtags</strong> as on Add note, after the description: file tags say what the files are, tags say what the record is about. No follow-up.</li>
        </ol>
        <p class="pm-assume"><strong>To confirm:</strong> whether the description is saved with the files (the submit call sends <code>Note</code> empty today), whether file tags should be per file instead of per upload, and whether the attachment needs both file tags and tags.</p>`
    };

    const params = new URLSearchParams(location.search);
    const state = {
      type: COPY[params.get('type')] ? params.get('type') : 'note',
      width: params.get('width') === 'narrow' ? 'narrow' : 'wide',
      mode: params.get('mode') === 'dark' ? 'dark' : 'light'
    };
    const stage = document.getElementById('stage');
    const form = document.getElementById('form');

    function escape(value) {
      return String(value).replace(/[&<>"']/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[ch]);
    }

    // Slide a section open or shut. It clips while it moves, then stops
    // clipping so an open dropdown inside it is not cut off.
    function reveal(element, open) {
      if (open) {
        if (!element.hasAttribute('data-closed')) return;
        clearTimeout(element._settle);
        element.removeAttribute('data-closed');
        element._settle = setTimeout(() => element.setAttribute('data-settled', ''), 240);
      } else {
        clearTimeout(element._settle);
        element.removeAttribute('data-settled');
        element.setAttribute('data-closed', '');
      }
    }

    // ── Multi-select ─────────────────────────────────────────
    // options(): [{group, items}] so subtags can follow the chosen tags.
    function multiSelect(root, options, {single = false, initial = [], onChange} = {}) {
      let selected = initial.slice();
      root.innerHTML = '<button type="button" class="pm-multi__control" aria-haspopup="listbox" aria-expanded="false"></button>' +
        '<div class="pm-multi__panel" hidden><input class="pm-multi__search" type="search" placeholder="Search" aria-label="Search options"><div class="pm-multi__list" role="listbox"></div></div>';
      const control = root.querySelector('.pm-multi__control');
      const panel = root.querySelector('.pm-multi__panel');
      const search = root.querySelector('.pm-multi__search');
      const list = root.querySelector('.pm-multi__list');
      const label = value => value.split('›').pop();

      function drawControl() {
        control.innerHTML = selected.length
          ? selected.map(value => {
              const [parent, child] = value.split('›');
              const text = child ? `<span class="pm-chip__parent">${escape(parent)} ›</span> ${escape(child)}` : escape(value);
              return `<span class="pm-chip">${text}<span class="pm-chip__remove" role="button" tabindex="0" aria-label="Remove ${escape(label(value))}" data-remove="${escape(value)}"><i class="ti ti-x" aria-hidden="true"></i></span></span>`;
            }).join('')
          : `<span class="pm-multi__placeholder">${single ? 'Choose a person' : 'Choose…'}</span>`;
      }

      function drawList() {
        const term = search.value.trim().toLowerCase();
        list.innerHTML = options().map(({group, items}) => {
          const shown = items.filter(item => !term || item.toLowerCase().includes(term));
          if (!shown.length) return '';
          return (group ? `<div class="pm-multi__group">${escape(group)}</div>` : '') + shown.map(item => {
            const value = group ? group + '›' + item : item;
            return `<label class="pm-multi__option"><input type="${single ? 'radio' : 'checkbox'}" name="${root.dataset.multi}" value="${escape(value)}"${selected.includes(value) ? ' checked' : ''}> ${escape(item)}</label>`;
          }).join('');
        }).join('') || '<div class="pm-multi__group">No matches</div>';
      }

      function open(next) {
        panel.hidden = !next;
        control.setAttribute('aria-expanded', String(next));
        root.toggleAttribute('data-open', next);
        if (next) { search.value = ''; drawList(); search.focus(); }
      }

      function set(next) {
        selected = next;
        drawControl();
        onChange?.(selected.slice());
      }

      control.addEventListener('click', event => {
        const remove = event.target.closest('[data-remove]');
        if (remove) { event.stopPropagation(); set(selected.filter(value => value !== remove.dataset.remove)); return; }
        open(panel.hidden);
      });
      search.addEventListener('input', drawList);
      list.addEventListener('change', event => {
        const value = event.target.value;
        if (single) { set([value]); open(false); control.focus(); return; }
        set(event.target.checked ? [...selected, value] : selected.filter(item => item !== value));
      });
      root.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !panel.hidden) { event.stopPropagation(); open(false); control.focus(); }
      });
      document.addEventListener('click', event => { if (!root.contains(event.target)) open(false); });

      drawControl();
      return {
        get: () => selected.slice(),
        // Drop values the options no longer offer (a removed tag's subtags).
        prune() {
          const allowed = new Set(options().flatMap(({group, items}) => items.map(item => group ? group + '›' + item : item)));
          const kept = selected.filter(value => allowed.has(value));
          if (kept.length !== selected.length) set(kept);
        }
      };
    }

    // ── Files ────────────────────────────────────────────────
    function filesField(container, {large, required, label}) {
      container.innerHTML = document.getElementById('tpl-files').innerHTML;
      container.querySelector('[data-text="files-label"]').textContent = label;
      const drop = container.querySelector('.pm-drop');
      const input = drop.querySelector('input');
      const list = container.querySelector('.pm-files');
      const tags = container.querySelector('[data-files-tags]');
      const error = container.querySelector('[data-files-error]');
      let files = [];
      drop.classList.toggle('pm-drop--large', large);
      container.querySelector('[data-text="files-optional"]').hidden = required;
      container.querySelector('[data-text="files-required"]').hidden = !required;
      multiSelect(container.querySelector('[data-multi="filetags"]'), () => [{items: FILE_TAGS}]);

      function draw() {
        list.innerHTML = files.map((file, index) =>
          `<li class="pm-file"><i class="ti ti-file-text" aria-hidden="true"></i><span class="pm-file__name">${escape(file.name)}</span><span class="pm-file__size">${escape(file.size)}</span>` +
          `<button type="button" class="pm-icon-button" style="margin:0" aria-label="Remove ${escape(file.name)}" data-index="${index}"><i class="ti ti-x" aria-hidden="true"></i></button></li>`).join('');
        reveal(tags, files.length > 0);
        if (files.length) { error.hidden = true; container.removeAttribute('data-invalid'); }
      }

      function add(list) {
        files = files.concat([...list].map(file => ({name: file.name, size: Math.max(1, Math.round(file.size / 1024)) + ' KB'})));
        draw();
      }

      // The mock-up adds sample files when the file picker is cancelled.
      drop.addEventListener('click', event => {
        event.preventDefault();
        input.value = '';
        input.click();
        const fallback = setTimeout(() => { if (!files.length) { files = SAMPLE_FILES.slice(); draw(); } }, 1500);
        input.addEventListener('change', () => { clearTimeout(fallback); add(input.files); }, {once: true});
      });
      drop.addEventListener('dragover', event => { event.preventDefault(); drop.setAttribute('data-over', ''); });
      drop.addEventListener('dragleave', () => drop.removeAttribute('data-over'));
      drop.addEventListener('drop', event => { event.preventDefault(); drop.removeAttribute('data-over'); add(event.dataTransfer.files); });
      list.addEventListener('click', event => {
        const button = event.target.closest('[data-index]');
        if (button) { files.splice(Number(button.dataset.index), 1); draw(); }
      });

      return {
        validate() {
          const ok = !required || files.length > 0;
          error.hidden = ok;
          container.toggleAttribute('data-invalid', !ok);
          return ok;
        }
      };
    }

    // ── Follow-up / task details ─────────────────────────────
    function followupFields(container) {
      container.innerHTML = document.getElementById('tpl-followup').innerHTML;
      multiSelect(container.querySelector('[data-multi="assign"]'), () => [{items: STAFF}], {single: true, initial: [STAFF[0]]});
      const date = container.querySelector('input[type="date"]');
      const clear = container.querySelector('[data-clear]');
      // Clear date shows only while there is a date to clear.
      const sync = () => { clear.hidden = !date.value; };
      date.addEventListener('input', sync);
      date.addEventListener('change', sync);
      container.querySelector('.pm-quick').addEventListener('click', event => {
        if (event.target.closest('[data-clear]')) {
          date.value = '';
          sync();
          date.focus();
          return;
        }
        const button = event.target.closest('[data-days]');
        if (!button) return;
        const day = new Date();
        day.setDate(day.getDate() + Number(button.dataset.days));
        date.value = day.toISOString().slice(0, 10);
        sync();
      });
    }

    // ── Build the chosen form ────────────────────────────────
    let filesController = null;

    function build() {
      const copy = COPY[state.type];
      document.getElementById('pm-title').textContent = copy.title;
      document.getElementById('save').textContent = copy.save;
      document.getElementById('notes').innerHTML = NOTES[state.type];
      form.querySelectorAll('[data-for]').forEach(el => { el.hidden = el.dataset.for !== state.type; });
      form.querySelectorAll('[data-not-for]').forEach(el => { el.hidden = el.dataset.notFor === state.type; });

      // Texts that change per form.
      const texts = {...COPY.note, ...copy};
      form.querySelectorAll('[data-text]').forEach(el => { if (texts[el.dataset.text]) el.textContent = texts[el.dataset.text]; });
      const note = document.getElementById('note');
      note.placeholder = texts['note-placeholder'];
      note.value = '';
      note.classList.toggle('pm-textarea--short', state.type === 'attachmentonly');
      note.style.minHeight = state.type === 'attachmentonly' ? '72px' : '';
      const noteRequired = state.type !== 'attachmentonly';
      form.querySelector('[data-text="note-required"]').hidden = !noteRequired;
      form.querySelector('[data-text="note-optional"]').hidden = noteRequired;
      document.getElementById('note-error').hidden = true;
      form.querySelector('[data-key="note"]').removeAttribute('data-invalid');

      // Tags and subtags.
      const subReveal = document.getElementById('subtags-reveal');
      reveal(subReveal, false);
      let tagPicker = null;
      const subPicker = multiSelect(form.querySelector('[data-multi="subtags"]'),
        () => (tagPicker ? tagPicker.get() : []).map(tag => ({group: tag, items: TAGS[tag]})));
      tagPicker = multiSelect(form.querySelector('[data-multi="tags"]'), () => [{items: Object.keys(TAGS)}], {
        onChange(tags) { reveal(subReveal, tags.length > 0); subPicker.prune(); }
      });

      // Attachments: compact for notes and tasks, large and required alone.
      const filesFirst = form.querySelector('[data-key="files-first"]');
      const filesAfter = form.querySelector('[data-key="files"]');
      filesFirst.innerHTML = '';
      filesAfter.innerHTML = '';
      filesController = state.type === 'attachmentonly'
        ? filesField(filesFirst, {large: true, required: true, label: 'Files'})
        : filesField(filesAfter, {large: false, required: false, label: 'Attachments'});

      // Follow-up fields: behind the switch on a note, always on a task.
      const followup = document.getElementById('followup');
      followup.checked = false;
      reveal(document.getElementById('followup-reveal'), false);
      const noteFollowup = form.querySelector('[data-key="followup-details"]');
      const taskDetails = form.querySelector('[data-key="task-details"]');
      noteFollowup.innerHTML = '';
      taskDetails.innerHTML = '';
      if (state.type === 'note') followupFields(noteFollowup);
      if (state.type === 'task') {
        followupFields(taskDetails);
        taskDetails.querySelector('.pm-subgroup').style.marginTop = '0';
        taskDetails.querySelector('[data-text="deadline-label"]').textContent = 'Due date';
      }

      note.focus();
    }

    document.getElementById('followup').addEventListener('change', event => {
      reveal(document.getElementById('followup-reveal'), event.target.checked);
    });

    form.addEventListener('submit', event => {
      event.preventDefault();
      const note = document.getElementById('note');
      const noteField = form.querySelector('[data-key="note"]');
      const noteOk = state.type === 'attachmentonly' || note.value.trim() !== '';
      document.getElementById('note-error').hidden = noteOk;
      noteField.toggleAttribute('data-invalid', !noteOk);
      const filesOk = filesController.validate();
      if (!noteOk) note.focus();
      if (noteOk && filesOk) {
        const save = document.getElementById('save');
        const text = save.textContent;
        save.textContent = 'Saved';
        setTimeout(() => { save.textContent = text; }, 1200);
      }
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) form.requestSubmit();
    });
    document.getElementById('note').addEventListener('input', event => {
      if (event.target.value.trim()) {
        document.getElementById('note-error').hidden = true;
        form.querySelector('[data-key="note"]').removeAttribute('data-invalid');
      }
    });

    // ── Toolbar ──────────────────────────────────────────────
    function apply() {
      document.querySelectorAll('[data-control]').forEach(group => {
        group.querySelectorAll('button').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.value === state[group.dataset.control]));
        });
      });
      stage.dataset.width = state.width;
      document.documentElement.setAttribute('data-us-color-scheme', state.mode);
      const url = new URL(location.href);
      url.searchParams.set('type', state.type);
      url.searchParams.set('width', state.width);
      url.searchParams.set('mode', state.mode);
      history.replaceState(null, '', url);
    }

    document.querySelectorAll('[data-control]').forEach(group => {
      group.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        const key = group.dataset.control;
        const changed = state[key] !== button.dataset.value;
        state[key] = button.dataset.value;
        apply();
        if (key === 'type' && changed) build();
      });
    });

    apply();
    build();
  })();
  </script>
</body>
