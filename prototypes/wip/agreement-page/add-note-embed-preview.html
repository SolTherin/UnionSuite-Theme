<!doctype html>
<!--
  Offline preview of templates/Add-Note-Form-Content-HTML.html, the Add note
  form embed. Stubs what iMIS provides (the client context, /api/query, the
  RadWindow) and CloudToolz (the base URL and fineUpload), then loads the
  embed exactly as it would be pasted. The close value the form sends shows
  under the frame. Serve the project root (static-node) and open this page.
-->
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Note Preview</title>
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Guides/usage/vendor/10-UltraWaveResponsive.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/99-Orion.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/zUnionSuite.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/Tabler/tabler-icons.min.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Client/Branding.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite-Client/Override.css">
  <link rel="stylesheet" href="../../../THeme/UnionSuite/zzDarkMode.css">
  <style>
    /* Preview frame only. */
    body.np-page {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg-page);
      font: 14px/1.5 var(--font-ui);
    }

    .np-window {
      max-width: 800px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 12px 40px rgb(15 23 42 / .18);
    }

    .np-window__title {
      margin: 0;
      padding: 10px 20px;
      border-bottom: 1px solid var(--border);
      color: var(--text-strong);
      font-size: 15px;
      font-weight: 700;
    }

    .np-log {
      max-width: 800px;
      margin: 16px auto 0;
      color: var(--text-muted);
      font: 12px/1.5 ui-monospace, monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body class="np-page">
  <input type="hidden" id="__RequestVerificationToken" value="preview-token">
  <input type="hidden" id="__ClientContext" value='{"isAnonymous":false,"loggedInPartyId":"104203","selectedPartyId":"104203"}'>

  <div class="np-window">
    <p class="np-window__title">Add note</p>
    <div id="slot"></div>
  </div>
  <pre class="np-log" id="log">Close value: (none yet)</pre>

  <script>
  (function () {
    'use strict';

    if (!new URLSearchParams(location.search).has('ModuleID')) {
      history.replaceState(null, '', '?Type=note&ID=104203&Module=agreement&ModuleID=A107&ModuleOrdinal=123');
    }

    const log = message => { document.getElementById('log').textContent = message; };

    // The native popup: closing reports the value under the frame.
    window.GetRadWindow = () => ({close: value => log('Close value: ' + JSON.stringify(value))});
    window.CloseAndCancelRadWindow = () => log('CloseAndCancelRadWindow() called');

    const rows = list => ({Items: {$values: list}});
    // The dev tenant's tags, as tags-iqa-probe.js read them (19 October 2026).
    const parentTags = [[6, 'Something Test'], [32, 'Test Case Tag'], [58, 'Test2'], [60, 'Discrimination'],
      [64, 'Dismissal'], [69, 'Bullying / Harassment'], [70, 'Insurance'], [71, 'Grievance']]
      .map(([Ordinal, TagName]) => ({Ordinal, TagName}));
    const childTags = [[3, 'Tag 1 Subtype 1', 32], [37, 'Testing Module', 32], [52, 'test 1234', 32], [59, 'Test3', 58],
      [61, 'Age', 60], [62, 'Gender', 60], [63, 'Disability', 60], [65, 'Unfair', 64], [66, 'Entitlements', 64],
      [67, 'Notice period', 64], [68, 'Termination', 64], [77, 'Something Test Sub Type', 6]]
      .map(([Ordinal, TagName, ParentTagOrdinal]) => ({Ordinal, TagName, ParentTagOrdinal,
        ParentTagName: parentTags.find(tag => tag.Ordinal === ParentTagOrdinal).TagName}));
    window.__childTagCalls = [];
    const staff = [['104203', 'James Driscoll'], ['104010', "Mary O'Conner"], ['104022', 'Priya Nair'], ['104031', 'Sam Whitfield']]
      .map(([ID, Name]) => ({ID, Name}));
    const fileTags = ['Agreement draft', 'Correspondence', 'Minutes', 'Offer'].map((TagName, i) => ({Ordinal: String(i + 1), TagName}));

    const realFetch = window.fetch.bind(window);
    const json = (body, status = 200) => new Response(JSON.stringify(body), {status, headers: {'Content-Type': 'application/json'}});
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    window.fetch = async (input, init) => {
      const url = new URL(typeof input === 'string' ? input : input.url, location.href);
      if (url.pathname === '/api/query') {
        await wait(300);
        const name = url.searchParams.get('QueryName');
        if (name.endsWith('CloudToolzUrl')) return json(rows([{Description: 'https://cloudtoolz.example'}]));
        if (name.endsWith('Parent Tags')) return json(rows(parentTags));
        if (name.endsWith('Child Tags')) {
          const wanted = (url.searchParams.get('ParentTag') || '').replace(/"/g, '').split(',').map(Number);
          window.__childTagCalls.push(url.searchParams.get('ParentTag'));
          return json(rows(childTags.filter(tag => wanted.includes(tag.ParentTagOrdinal))));
        }
        if (name.endsWith('Case Staff')) return json(rows(staff));
        if (name.endsWith('ZenFileTags')) return json(rows(fileTags));
        return json({}, 404);
      }
      if (url.host === 'cloudtoolz.example' && url.pathname === '/api/formz/fineUpload') {
        await wait(1200);
        return json({success: true});
      }
      return realFetch(input, init);
    };

    // Load the embed as it would be pasted, scripts included.
    realFetch('templates/Add-Note-Form-Content-HTML.html').then(response => response.text()).then(html => {
      const slot = document.getElementById('slot');
      slot.append(document.createRange().createContextualFragment(html));
    });
  })();
  </script>
</body>
</html>
