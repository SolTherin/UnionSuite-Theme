<!-- PROPOSED Query Template, not yet supported. The current supported templates are
     in THeme/UnionSuite/guides/usage/templates/List-Templates/.
     Keeps the shipped contract: .us-task carries data-us-task-completed, the toggle
     stays a direct child, and .us-task__date remains the element the completion
     sequence rewrites. New: a one-line note, a member with a person icon, and the
     task's origin.
     CreatedLabel is composed by the query, like TaskDateLabel, so a missing author
     or date cannot leave a fragment such as "created  by " in the row.
     TaskTitle links to the task; the destination is a placeholder until the popup
     action is agreed. -->
<div class="us-task us-task--detail" data-us-task-completed="{#query.IsCompleted}"
  data-us-task-due-state="{#query.DueState}" data-us-task-due-label="{#query.DueLabel}">
  <button type="button" class="us-task__check" data-us-task-toggle
    role="checkbox" aria-checked="false" aria-label="Complete task: {#query.TaskTitle}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" focusable="false"><path d="m5 12 4 4L19 6"/></svg>
  </button>
  <div class="us-task__open">
    <span class="us-task__copy">
      <a class="us-task__title" href="{#query.TaskUrl}">{#query.TaskTitle}</a>
      <span class="us-task__note">{#query.TaskNote}</span>
    </span>
    <span class="us-task__meta">
      <span class="us-task__member">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
        <a class="us-task__member-name" href="{#query.MemberUrl}">{#query.MemberName}</a>
      </span>
      <span class="us-task__origin">{#query.CreatedLabel}</span>
    </span>
    <span class="us-task__date">{#query.TaskDateLabel}</span>
  </div>
</div>
