<div class="contact-preview-tools">
  <span><strong>Contact lists</strong><span class="us-badge">Shared template</span></span>
  <button type="button" class="TextButton" id="preview-width" aria-pressed="false">Narrow view</button>
</div>
<main class="contact-preview-layout">
  <div class="contact-preview-context"><h1>Workplace contacts</h1><p>People who support this member at their workplace.</p></div>
  <div class="contact-preview-columns">{{PANELS}}</div>
  <p class="contact-preview-note">Sample contacts · Use the filter icons to search each list.</p>
</main>
<dialog class="contact-preview-dialog" aria-labelledby="contact-dialog-title">
  <div class="contact-dialog-heading"><h2 id="contact-dialog-title"></h2><button type="button" class="us-icon-button" id="close-contact" aria-label="Close"><i class="ti ti-x" aria-hidden="true"></i></button></div>
  <p id="contact-dialog-detail"></p>
  <p class="contact-dialog-note">This is a preview. In iMIS, this link opens the corresponding record.</p>
  <button type="button" class="TextButton" id="done-contact">Done</button>
</dialog>
