    background: linear-gradient(180deg, #4C2BD9 0%, #6F3AE6 22%, #4356E8 46%,
                                        #2B87E0 70%, #17BFC9 88%, #12D3A8 100%);
  }
  .side.light .fill {
    background: linear-gradient(180deg, #FFC24A 0%, #FF9257 22%, #FF6E86 46%,
                                        #E060C6 70%, #7FC85C 88%, #34C878 100%);
  }
  .check, .ghost {
    position: absolute; left: 0; top: 0; width: 32px; height: 32px; pointer-events: none;
  }
  .check path, .ghost path {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .check path { stroke: var(--mark); }
  .ghost path { stroke: var(--edge); stroke-dashoffset: 0; }
  .ghost { opacity: 0; }

  .label {
    position: absolute; left: 43px; bottom: 4px;
    font-size: 18px; line-height: 1.2; white-space: pre; color: var(--ink);
  }
  .strike {
    position: absolute; left: 43px; top: 16.5px; height: 1px; width: 1px;
    background: var(--ink); opacity: 0;
  }
  .side.dark  .strike { box-shadow: 0 1px 2px rgba(0,0,0,.9); }
  .side.light .strike { box-shadow: none; }

  .side.dark  { --ink: #ffffff; --edge: #ffffff; --mark: #ffffff; }
  .side.light { --ink: #4D352D; --edge: #6E4D43; --mark: #ffffff; }

  /* ---- particles ------------------------------------------------------- */
  .petals { position: absolute; inset: 0; pointer-events: none; z-index: 9; }
  .petals > div { position: absolute; will-change: transform, opacity; }

    <div class="list" id="listDark"></div><div class="petals" id="pDark"></div></div>
  <div class="side light" id="sideLight"><div class="wash"></div><div class="grain"></div>
    <div class="list" id="listLight"></div><div class="petals" id="pLight"></div></div>
</div>

<script>
const SHAPES = {"leaf": "<path d=\"M12 2C17 7 20 13 12 22 4 13 7 7 12 2Z\" fill=\"{c}\"/>\n<path d=\"M12 5.5V19.5\" stroke=\"{d}\" stroke-width=\"1\" stroke-linecap=\"round\" opacity=\".55\"/>", "flower": "<ellipse cx=\"12\" cy=\"6.4\" rx=\"3.5\" ry=\"5.2\" fill=\"{c}\" transform=\"rotate(0 12 12)\"/><ellipse cx=\"12\" cy=\"6.4\" rx=\"3.5\" ry=\"5.2\" fill=\"{c}\" transform=\"rotate(72 12 12)\"/><ellipse cx=\"12\" cy=\"6.4\" rx=\"3.5\" ry=\"5.2\" fill=\"{c}\" transform=\"rotate(144 12 12)\"/><ellipse cx=\"12\" cy=\"6.4\" rx=\"3.5\" ry=\"5.2\" fill=\"{c}\" transform=\"rotate(216 12 12)\"/><ellipse cx=\"12\" cy=\"6.4\" rx=\"3.5\" ry=\"5.2\" fill=\"{c}\" transform=\"rotate(288 12 12)\"/><circle cx=\"12\" cy=\"12\" r=\"2.6\" fill=\"{d}\"/>", "star": "<path d=\"M12 1.6 14.7 9 22.4 9.4 16.4 14.2 18.4 21.7 12 17.4 5.6 21.7 7.6 14.2 1.6 9.4 9.3 9Z\" fill=\"{c}\"/>", "sparkle": "<path d=\"M12 1C13 8 16 11 23 12 16 13 13 16 12 23 11 16 8 13 1 12 8 11 11 8 12 1Z\" fill=\"{c}\"/>", "moon": "<path d=\"M15.2 2.2A10 10 0 1 0 15.2 21.8 11.6 11.6 0 0 1 15.2 2.2Z\" fill=\"{c}\"/>", "bat": "<path d=\"M9.7 6.9 9.1 4.3 11.2 6.3ZM14.3 6.9 14.9 4.3 12.8 6.3Z\" fill=\"{c}\"/>\n<path d=\"M12 8.2C10.6 6.6 9.2 6.2 8.2 7.2 6.7 5.6 4.2 5 2.1 6.1 3.1 7.6 3.1 9.6 2.6 11.2 4.7 10.6 6.2 11.2 7.2 12.7 8.2 11.6 9.7 11.6 10.7 12.7L12 15.2 13.3 12.7C14.3 11.6 15.8 11.6 16.8 12.7 17.8 11.2 19.3 10.6 21.4 11.2 20.9 9.6 20.9 7.6 21.9 6.1 19.8 5 17.3 5.6 15.8 7.2 14.8 6.2 13.4 6.6 12 8.2Z\" fill=\"{c}\"/>", "unicorn": "<path d=\"M10.1 6.7 12.0 0.6 13.5 7.5Z\" fill=\"{d}\"/>\n<path d=\"M2.2 12.4C2.6 10.9 4.4 10.2 6.4 9.8 7.7 9 8.9 8.1 10 6.9L13.3 7.7C14.1 6 15.5 5.4 16.4 5.9 16.2 7.6 15.7 9.2 14.8 10.3 16.4 12.9 17.1 15.8 17.5 18.8L18 22.2 10.6 22.2C10.2 19.4 9.2 17.2 7.4 15.8 6 14.7 4 14.3 2.9 13.6 2.4 13.3 2.2 12.9 2.2 12.4Z\" fill=\"{c}\"/>\n<path d=\"M14.8 10.3C17.6 9.6 19.4 11.4 19.3 14 18.2 12.6 16.6 12.1 15.4 12.4ZM16.4 14.1C18.5 14.3 19.6 16.1 19.2 18.2 18.4 16.6 17.4 15.6 16.2 15.4Z\" fill=\"{d}\" opacity=\".9\"/>\n<circle cx=\"10.3\" cy=\"10.1\" r=\".8\" fill=\"{d}\" opacity=\".75\"/>\n<circle cx=\"3.7\" cy=\"12.2\" r=\".55\" fill=\"{d}\" opacity=\".6\"/>"};
const MARK = '<svg viewBox="0 0 32 32"><path d="M 9.5 16 L 14 20.5 L 23 11.5" pathLength="1"/></svg>';

const ROWS = {
  dark: ["Wished on a questionable star",
         "Howled at the moon. Politely.",
         "Went full creature of the night"],
  light:["Went outside. Touched grass.",
         "Kept the plant alive. Barely.",
         "Believed something ridiculous"],
};

/* Dark checks top-to-bottom, then each light row takes over from its
   opposite number — light on, dark off, one pair at a time. */
const LOOP = 10.0;
const SCHED = {
  dark:  [{ on: 0.80, off: 3.60, kind: "star"    },
          { on: 1.60, off: 4.60, kind: "moon"    },
          { on: 2.40, off: 5.60, kind: "bat"     }],
  light: [{ on: 3.60, off: 7.60, kind: "leaf"    },
          { on: 4.60, off: 7.90, kind: "flower"  },
          { on: 5.60, off: 8.20, kind: "unicorn" }],
};
const EVENTS = [];
for (const side of ["dark", "light"])
  SCHED[side].forEach((e, row) => EVENTS.push({ side, row, t: e.on, kind: e.kind }));

const PALETTE = {
  leaf:    [["#4FA85C","#2C6B36"],["#79C167","#3A7A44"],["#2F8B45","#1D5A2C"],["#9AD07A","#4A8C50"]],
  flower:  [["#FF6B8A","#FFE9A3"],["#FF9F5A","#FFF0C0"],["#E86BD8","#FFE9A3"],["#FFC24A","#FFF6D8"]],
  unicorn: [["#F0A3D4","#FFC94A"],["#BFA2EE","#FFC94A"],["#8FD8EA","#FFC94A"],["#F7C7E4","#F0A93C"]],
  star:    [["#FFFFFF","#FFF3C4"],["#FFF3C4","#fff"],["#CFE3FF","#fff"],["#FFE9A3","#fff"]],
  moon:    [["#FFE39A","#fff"],["#E8ECF5","#fff"],["#FFD98A","#fff"],["#CFE3FF","#fff"]],
  bat:     [["#9A93C8","#9A93C8"],["#7C75AE","#7C75AE"],["#B3ACDC","#B3ACDC"],["#6E689A","#6E689A"]],
};
/* stars mix in four-point sparkles so the burst isn't uniform */
const GLYPH = k => k === "star" ? ["star","sparkle"] : [k];

/* deterministic RNG so every capture of frame N is identical */
function rng(seed) {
  let a = seed >>> 0;
  return () => { a += 0x6D2B79F5; let x = a;
    x = Math.imul(x ^ x >>> 15, x | 1); x ^= x + Math.imul(x ^ x >>> 7, x | 61);
    return ((x ^ x >>> 14) >>> 0) / 4294967296; };
}
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const eOut = t => 1 - Math.pow(1 - t, 3);
const eInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const TAU = Math.PI * 2;

/* ---- build the two lists ---------------------------------------------- */
const CELLS = {};
for (const side of ["dark", "light"]) {
  const list = document.getElementById(side === "dark" ? "listDark" : "listLight");
  CELLS[side] = ROWS[side].map(text => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="box"><div class="fill"></div><div class="check">' + MARK + '</div>'
      + '<div class="ring"></div></div>'
      + '<div class="ghost">' + MARK + '</div>'
      + '<div class="label"></div><div class="strike"></div>';
    row.querySelector(".label").textContent = text;
    list.appendChild(row);
    return {
      row, box: row.querySelector(".box"), ring: row.querySelector(".ring"),
      fill: row.querySelector(".fill"), mark: row.querySelector(".check path"),
      ghost: row.querySelector(".ghost"), label: row.querySelector(".label"),
      strike: row.querySelector(".strike"),
    };
  });
}
/* size each row to its own text, so the strike line stops at the last word */
function measure() {
  for (const side of ["dark", "light"]) CELLS[side].forEach(c => {
    const w = c.label.getBoundingClientRect().width / 1.6;
    c.row.style.width = (43 + w + 2) + "px";
    c.target = w;
  });
}

/* ---- particles --------------------------------------------------------- */
const LAYERS = { dark: document.getElementById("pDark"), light: document.getElementById("pLight") };
const SIDE_RECT = { dark: document.getElementById("sideDark").getBoundingClientRect(),
                    light: document.getElementById("sideLight").getBoundingClientRect() };
const PARTS = [];
function buildParticles() {
  EVENTS.forEach((ev, ei) => {
    const cell = CELLS[ev.side][ev.row];
    const r = cell.box.getBoundingClientRect(), sr = SIDE_RECT[ev.side];
    const ox = r.left + r.width / 2 - sr.left, oy = r.top + r.height / 2 - sr.top;
    const glyphs = GLYPH(ev.kind), pal = PALETTE[ev.kind];
    const n = ev.kind === "unicorn" ? 10 : 15;
    const rand = rng(1000 + ei * 97);
    for (let i = 0; i < n; i++) {
      const g = glyphs[Math.floor(rand() * glyphs.length)];
      const [c, d] = pal[Math.floor(rand() * pal.length)];
      const size = (ev.kind === "unicorn" ? 42 : ev.kind === "star" ? 26 : 32)
                 + rand() * (ev.kind === "star" ? 18 : 24);
      const el = document.createElement("div");
      el.style.width = el.style.height = size + "px";
      el.innerHTML = '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24">'
                   + SHAPES[g].replaceAll("{c}", c).replaceAll("{d}", d) + '</svg>';
      el.style.left = (ox - size / 2) + "px";
      el.style.top  = (oy - size / 2) + "px";
      el.style.display = "none";
      LAYERS[ev.side].appendChild(el);
      PARTS.push({
        el, kind: ev.kind, t0: ev.t + rand() * 0.16,
        life: ({ leaf: 1.9, flower: 1.35, unicorn: 1.8, star: 1.05, moon: 1.7, bat: 1.6 })[ev.kind]
              * (0.82 + rand() * 0.36),
        ang: (-148 + Math.pow(rand(), 0.8) * 128) * Math.PI / 180,
        dist: 72 + rand() * (ev.kind === "star" ? 78 : 108),
        spin: (rand() < .5 ? -1 : 1) * (60 + rand() * 320),
        wob: rand() * TAU, seed: rand(),
      });
    }
  });
}

function drawParticle(p, t) {
  const age = (t - p.t0) / p.life;
  if (age < 0 || age > 1) { p.el.style.display = "none"; return; }
  p.el.style.display = "block";
  const e = eOut(age);
  let x = Math.cos(p.ang) * p.dist * e;
  let y = Math.sin(p.ang) * p.dist * e;
  let sc = 1, rot = p.spin * age, op = 1;

  switch (p.kind) {
    case "leaf":                                   // flutters down
      x += Math.sin(age * TAU * 1.6 + p.wob) * 20;
      y += 215 * age * age; rot = p.spin * 1.6 * age; break;
    case "flower":                                 // pops, then falls
      y += 185 * age * age; sc = 0.25 + eOut(Math.min(1, age * 4)) * 0.85; break;
    case "unicorn":                                // floats, gentle bob
      y += 58 * age * age - Math.sin(age * TAU + p.wob) * 12;
      rot = p.spin * 0.22 * age; sc = 0.3 + eOut(Math.min(1, age * 3.5)) * 0.8; break;
    case "star":                                   // fast twinkle
      y += 100 * age * age;
      sc = (0.2 + eOut(Math.min(1, age * 5)) * 0.9)
         * (0.78 + 0.3 * Math.abs(Math.sin(age * TAU * 3 + p.wob)));
      rot = p.spin * 0.5 * age; break;
    case "moon":                                   // slow rise
      y -= 48 * age; rot = p.spin * 0.3 * age;
      sc = 0.3 + eOut(Math.min(1, age * 3)) * 0.8; break;
    case "bat":                                    // erratic, flapping
      x += Math.sin(age * TAU * 2.1 + p.wob) * 32;
      y += Math.sin(age * TAU * 3.4 + p.wob * 2) * 26 - 38 * age;
      rot = Math.sin(age * TAU * 1.3 + p.wob) * 26;
      sc = 0.3 + eOut(Math.min(1, age * 4)) * 0.8; break;
  }
  if (p.kind !== "flower" && p.kind !== "leaf") { /* scale set above */ }
  else if (p.kind === "leaf") sc = 0.3 + eOut(Math.min(1, age * 4)) * 0.85;

  op = age < .12 ? age / .12 : 1 - eInOut(clamp01((age - .58) / .42));
  const flap = p.kind === "bat"
    ? " scaleX(" + (0.35 + 0.65 * Math.abs(Math.sin(age * TAU * 7 + p.wob))).toFixed(3) + ")" : "";
  p.el.style.opacity = op.toFixed(3);
  p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate("
                       + rot.toFixed(1) + "deg) scale(" + sc.toFixed(3) + ")" + flap;
}

/* ---- per-row state ------------------------------------------------------ */
function drawRow(cell, tOn, tOff, t) {
  const on = (d, lag = 0) => eInOut(clamp01((t - tOn - lag) / d));
  const of = (d, lag = 0) => eInOut(clamp01((t - tOff - lag) / d));

  // Unchecking is staged, not a straight reverse: the mark retracts along its
  // own path first, then the fill drops away and the strike pulls back.
  const fast = on(0.20)       * (1 - of(0.28, 0.10));   // fill in / border out
  const mark = on(0.30, 0.02) * (1 - of(0.24));         // checkmark draw
  const slow = on(0.50)       * (1 - of(0.30, 0.06));   // gradient + strike
  // a squish + faint preview just before the tap lands, standing in for a cursor
  const hov = eInOut(clamp01((t - (tOn - 0.34)) / 0.18)) * (t < tOn ? 1 : 0);
  // small settle bounce as it releases
  const u = clamp01((t - tOff) / 0.36);
  const bounce = (u > 0 && u < 1) ? Math.sin(u * Math.PI) : 0;

  const s = 32 - 4 * hov;
  cell.box.style.width = cell.box.style.height = s + "px";
  cell.box.style.left = cell.box.style.top = ((32 - s) / 2) + "px";
  cell.box.style.borderRadius = (10 - 2 * hov) + "px";
  cell.box.style.transform = "scale(" + (1 - 0.10 * bounce).toFixed(4) + ")";
  cell.ring.style.borderWidth = (2 * (1 - fast)) + "px";
  cell.ghost.style.opacity = (0.3 * hov).toFixed(3);

  cell.fill.style.opacity = fast.toFixed(3);
  cell.fill.style.top = (-96 * slow) + "px";
  cell.mark.style.strokeDashoffset = (1 - mark).toFixed(3);
  cell.label.style.opacity = (1 - 0.5 * fast).toFixed(3);
  cell.strike.style.width = (1 + (cell.target - 1) * slow) + "px";
  cell.strike.style.opacity = slow.toFixed(3);
}

function renderAt(t) {
  t = ((t % LOOP) + LOOP) % LOOP;
  for (const side of ["dark", "light"])
    SCHED[side].forEach((e, row) => drawRow(CELLS[side][row], e.on, e.off, t));
  for (const p of PARTS) drawParticle(p, t);
}

window.CAPTURE = false;
document.fonts.ready.then(() => {
  measure(); buildParticles(); renderAt(0);
  const t0 = performance.now();
  (function loop(now) {
    if (!window.CAPTURE) renderAt((now - t0) / 1000);
    requestAnimationFrame(loop);
  })(t0);
  window.READY = true;
});
</script>
